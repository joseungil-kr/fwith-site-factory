name: Namyangju exact manual artifacts and pixel evidence
on:
  push:
    branches: [manual-namyangju-qa-20261007]
    paths:
      - 'site-factory/namyangju-flower/**'
      - '.github/workflows/namyangju-manual-preview-qa.yml'
      - '.github/workflows/namyangju-manual-release-20261007.yml'
      - '.github/scripts/namyangju-manual-preview.mjs'
permissions:
  contents: read
jobs:
  exact-evidence:
    if: github.ref == 'refs/heads/manual-namyangju-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: [preview, production]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_QA_PHASE: ${{ matrix.phase }}
      SITE_URL: ${{ matrix.phase == 'preview' && 'https://namyangju-flower-guide-qa.joseungil.workers.dev' || 'https://namyangju.fwith.kr' }}
      SITE_ORIGIN: ${{ matrix.phase == 'preview' && 'https://namyangju-flower-guide-qa.joseungil.workers.dev' || 'https://namyangju.fwith.kr' }}
      SITE_INDEXABLE: ${{ matrix.phase == 'preview' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact content and reviewed native boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/manual-namyangju-qa-20261007'
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/namyangju-manual-playwright" >> "$GITHUB_ENV"
          mkdir -p "namyangju-$MANUAL_QA_PHASE-evidence/logs"
          node -e 'const fs=require("fs"),crypto=require("crypto");const h=crypto.createHash("sha256").update(fs.readFileSync("site-factory/namyangju-flower/src/data/manual-pages.json")).digest("hex");if(h!=="1fb3a55e1938a5a4b60a3712e5812db88d2145048b4f2fb80d91f87ff14b0365")throw Error("Unexpected content digest");const p=JSON.parse(fs.readFileSync("site-factory/namyangju-flower/src/data/manual-provenance.json"));if(p.dependencyHash!=="bcc8263b780a5c8479fc8eaf2db8c022db2f02b0e410ced09c97e1a698e90805"||p.independentReview.status!=="approved")throw Error("Native review missing");'
          node -e 'const fs=require("fs");fs.writeFileSync("namyangju-"+process.env.MANUAL_QA_PHASE+"-evidence/logs/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,phase:process.env.MANUAL_QA_PHASE,siteUrl:process.env.SITE_URL,siteIndexable:process.env.SITE_INDEXABLE},null,2));'
      - name: Install exact native dependency lock
        working-directory: site-factory/namyangju-flower
        run: npm ci --no-audit --no-fund
      - name: Build twice and prove exact deterministic artifacts
        shell: bash
        working-directory: site-factory/namyangju-flower
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/namyangju-$MANUAL_QA_PHASE-evidence"
          for attempt in first second; do
            npm test 2>&1 | tee "$evidence/logs/native-tests-$attempt.log"
            npm run build 2>&1 | tee "$evidence/logs/native-build-$attempt.log"
            python3 scripts/qa_static.py 2>&1 | tee "$evidence/logs/static-$attempt.log"
            node scripts/qa_graph.mjs 2>&1 | tee "$evidence/logs/graph-$attempt.log"
            python3 -c 'import hashlib,json,pathlib,sys; d=pathlib.Path("dist"); m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob("*")) if f.is_file()}; assert len(m)==58,len(m);pathlib.Path(sys.argv[1]).write_text(json.dumps(m,sort_keys=True,separators=(",",":")))' "$evidence/logs/$attempt.manifest.json"
          done
          cmp "$evidence/logs/first.manifest.json" "$evidence/logs/second.manifest.json"
          cp -a dist "$evidence/dist"
          sha256sum "$evidence/logs/second.manifest.json" > "$evidence/logs/artifact-manifest.sha256"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > "namyangju-$MANUAL_QA_PHASE-evidence/logs/font-match.txt"
      - name: Capture both viewports of every exact rendered route
        run: node .github/scripts/namyangju-manual-preview.mjs
      - name: Enforce independently retrievable evidence chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path('namyangju-'+os.environ['MANUAL_QA_PHASE']+'-evidence')
          for part in ['screenshots/desktop','screenshots/mobile','logs','dist']:
            files=[f for f in (root/part).rglob('*') if f.is_file()]
            assert files,part
            assert sum(f.stat().st_size for f in files)<24*1024*1024,part
          PY
      - name: Retain machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-${{ matrix.phase }}-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            namyangju-${{ matrix.phase }}-evidence/*.json
            namyangju-${{ matrix.phase }}-evidence/logs/
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact dist
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-${{ matrix.phase }}-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: namyangju-${{ matrix.phase }}-evidence/dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Retain desktop pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-${{ matrix.phase }}-desktop-${{ github.sha }}-${{ github.run_attempt }}
          path: namyangju-${{ matrix.phase }}-evidence/screenshots/desktop/
          if-no-files-found: error
          retention-days: 7
      - name: Retain mobile pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-${{ matrix.phase }}-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: namyangju-${{ matrix.phase }}-evidence/screenshots/mobile/
          if-no-files-found: error
          retention-days: 7
