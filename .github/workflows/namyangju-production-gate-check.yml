name: Namyangju historical exact20 initial-release regression
on:
  push:
    branches: [codex/namyangju-production-gate]
  pull_request:
    paths:
      - .github/site-factory-sites.json
      - site-factory/engine/**
      - site-factory/releases/namyangju-flower-v2-initial-20261005/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 374918f70a532db2ef79bf30e6efbbc59741f1a5
          path: target
          fetch-depth: 0
      - name: Load genuine immutable registry for historical initial20 regression
        run: |
          set -euo pipefail
          git -C control show dbb8c43ca51e732c8744a03dbbbd6cb14d042604:.github/site-factory-sites.json > historical-registry.json
      - name: Verify historical exact20 fixture using current PR engine without deploying
        run: |
          python3 control/site-factory/engine/whole_initial.py \
            --registry historical-registry.json \
            --site-key namyangju-flower-v2 \
            --revision 374918f70a532db2ef79bf30e6efbbc59741f1a5 \
            --root target/site-factory/namyangju-flower \
            --control control \
            --workspace target \
            --report initial-source.json
          python3 - <<'PY'
          import json
          report=json.load(open('initial-source.json'))
          assert report['pipelineState']=='initial_source_validated', report
          assert report['batchBarrier']['state']=='staging_complete', report
          assert report['batchBarrier']['newDetailCount']==20, report
          print(json.dumps(report,ensure_ascii=False))
          PY
