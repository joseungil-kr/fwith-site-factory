name: Unpublished regional loopback visual QA only
on:
  push:
    branches: [qa/unpublished-regional-visual-20261012, qa/gangdong-local-preview-20261014]
    paths:
      - '.github/workflows/unpublished-regional-visual-qa.yml'
      - '.github/qa/unpublished-regional/**'
      - '.github/qa/unpublished-gangdong/**'
permissions:
  contents: read
jobs:
  visual-evidence:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/qa/unpublished-regional-visual-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: gangseo
            source: f7f2b9d017b8b8352aae8b0339b5a2cac0da1d32
            tree: d91a88816ce75e677c59e4e7f7ed0f82ef1d09a5
            path: site-factory/seoul-gangseo-flower
            url: https://seoul-gangseo.fwith.kr
            indexable: 'true'
          - key: guro
            source: 500d82d01c1cdaed3ebde047bb3ce056705daac1
            tree: 455433060062e8089ca3ff9c0f2ebc8efb04a319
            path: site-factory/seoul-guro-flower
            url: https://seoul-guro.fwith.kr
            indexable: 'false'
          - key: geumcheon
            source: bbb016305dd2fe29f7d985a669acaa02224a9f2f
            tree: 1f2397c6a00c34e74ec2d3441001b233934fbb25
            path: site-factory/seoul-geumcheon-flower
            url: https://seoul-geumcheon.fwith.kr
            indexable: 'false'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_ROOT: ${{ github.workspace }}/source
      EVIDENCE_ROOT: ${{ github.workspace }}/evidence/${{ matrix.key }}
      SITE_FACTORY_REVISION: ${{ matrix.source }}
      SITE_URL: ${{ matrix.url }}
      SITE_ORIGIN: ${{ matrix.url }}
      SITE_INDEXABLE: ${{ matrix.indexable }}
    steps:
      - name: Check out QA controls only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out immutable unpublished source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkout bytes and immutable source approval facts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse 'HEAD:${{ matrix.path }}')" = '${{ matrix.tree }}'
          mkdir -p "$EVIDENCE_ROOT/logs"
          python3 control/.github/qa/unpublished-regional/controls.py source '${{ matrix.key }}'
          python3 control/.github/qa/unpublished-regional/test_controls.py -v 2>&1 | tee "$EVIDENCE_ROOT/logs/control-tests.log"
      - name: Install exact native dependency lock
        working-directory: source/${{ matrix.path }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all native tests and prove two identical builds
        working-directory: source/${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          controls="$GITHUB_WORKSPACE/control/.github/qa/unpublished-regional"
          for attempt in first second; do
            npm run build 2>&1 | tee "$EVIDENCE_ROOT/logs/native-build-$attempt.log"
            npm test 2>&1 | tee "$EVIDENCE_ROOT/logs/native-tests-$attempt.log"
            npm run qa 2>&1 | tee "$EVIDENCE_ROOT/logs/native-qa-$attempt.log"
            python3 "$controls/controls.py" manifest '${{ matrix.key }}' "$EVIDENCE_ROOT/logs/$attempt.manifest.json"
          done
          cmp "$EVIDENCE_ROOT/logs/first.manifest.json" "$EVIDENCE_ROOT/logs/second.manifest.json"
          cp -a dist "$EVIDENCE_ROOT/dist"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' | tee "$EVIDENCE_ROOT/logs/font-match.txt"
      - name: Execute unchanged native gate and all-route screenshot extension
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/qa/unpublished-regional/capture.py '${{ matrix.key }}' 2>&1 | tee "$EVIDENCE_ROOT/logs/browser-capture.log"
      - name: Seal artifact file hashes after capture log closes
        if: always()
        run: python3 control/.github/qa/unpublished-regional/controls.py evidence '${{ matrix.key }}'
      - name: Retain machine evidence and native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/${{ matrix.key }}/*.json
            evidence/${{ matrix.key }}/logs/
            evidence/${{ matrix.key }}/native/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact deterministic build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.key }}/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Retain native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-native-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.key }}/native/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain every 320-pixel route screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-320-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.key }}/screenshots/320/
          if-no-files-found: error
          retention-days: 7
      - name: Retain every 390-pixel route screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-390-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.key }}/screenshots/390/
          if-no-files-found: error
          retention-days: 7
      - name: Retain every 1280-pixel route screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ matrix.key }}-1280-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.key }}/screenshots/1280/
          if-no-files-found: error
          retention-days: 7
  gangdong-local-preview:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/qa/gangdong-local-preview-20261014' && github.event_name == 'push' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_ROOT: ${{ github.workspace }}/source
      EVIDENCE_ROOT: ${{ github.workspace }}/evidence/gangdong
      SITE_FACTORY_REVISION: 9c044584505eec60c71f2bc7add497f0902f5424
      SITE_URL: https://seoul-gangdong.local.invalid
      SITE_ORIGIN: https://seoul-gangdong.local.invalid
      SITE_INDEXABLE: 'false'
      PRODUCTION_APPROVED: 'false'
      PUBLIC_APPROVED: 'false'
      OWNERSHIP_VERIFIED: 'false'
      INDEXNOW_ENABLED: 'false'
    steps:
      - name: Check out exact QA control commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out immutable Gangdong source
        uses: actions/checkout@v4
        with:
          ref: 9c044584505eec60c71f2bc7add497f0902f5424
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and controls before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          controls="$GITHUB_WORKSPACE/control/.github/qa/unpublished-gangdong"
          python3 "$controls/adapter.py" source
          python3 "$controls/test_controls.py" -v 2>&1 | tee "$EVIDENCE_ROOT/logs/control-tests.log"
      - name: Install exact locked native dependencies on runner only
        working-directory: source/site-factory/seoul-gangdong-flower
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged Gangdong native gates and exact two-build comparison
        working-directory: source/site-factory/seoul-gangdong-flower
        shell: bash
        run: |
          set -euo pipefail
          controls="$GITHUB_WORKSPACE/control/.github/qa/unpublished-gangdong"
          for attempt in first second; do
            npm run build 2>&1 | tee "$EVIDENCE_ROOT/logs/native-build-$attempt.log"
            npm test 2>&1 | tee "$EVIDENCE_ROOT/logs/native-tests-$attempt.log"
            npm run qa 2>&1 | tee "$EVIDENCE_ROOT/logs/native-qa-$attempt.log"
            python3 "$controls/adapter.py" manifest "$EVIDENCE_ROOT/logs/$attempt.manifest.json"
          done
          cmp "$EVIDENCE_ROOT/logs/first.manifest.json" "$EVIDENCE_ROOT/logs/second.manifest.json"
          cp -a dist "$EVIDENCE_ROOT/dist"
      - name: Install official pinned browser tooling on runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' | tee "$EVIDENCE_ROOT/logs/font-match.txt"
      - name: Capture only runner loopback and fail on missing evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/qa/unpublished-gangdong/run_capture.py --allow-loopback-runner 2>&1 | tee "$EVIDENCE_ROOT/logs/browser-capture.log"
      - name: Seal source-bound report and screenshot bytes after logs close
        if: always()
        run: python3 control/.github/qa/unpublished-gangdong/adapter.py seal
      - name: Partition every evidence path into bounded download groups
        id: gangdong_groups
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/qa/unpublished-gangdong/prepare_artifacts.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/gangdong-grouping.log"
      - name: Retain bounded reports evidence
        id: upload_reports
        if: always() && steps.gangdong_groups.outputs.reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gangdong-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/gangdong-artifact-groups/reports/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded dist evidence
        id: upload_dist
        if: always() && steps.gangdong_groups.outputs.dist == 'true'
