              "screen_1280_regions": {"id": "${{ steps.upload_screen_1280_regions.outputs.artifact-id }}", "url": "${{ steps.upload_screen_1280_regions.outputs.artifact-url }}", "digest": "${{ steps.upload_screen_1280_regions.outputs.artifact-digest }}"},
              "screen_1280_404_html": {"id": "${{ steps.upload_screen_1280_404_html.outputs.artifact-id }}", "url": "${{ steps.upload_screen_1280_404_html.outputs.artifact-url }}", "digest": "${{ steps.upload_screen_1280_404_html.outputs.artifact-digest }}"}
            }
        run: python3 control/.github/qa/unpublished-gangdong/artifact_receipt.py
      - name: Keep bounded diagnostics even when grouping or upload fails
        if: always()
        env:
          GROUPING_OUTCOME: ${{ steps.gangdong_groups.outcome }}
        run: python3 control/.github/qa/unpublished-gangdong/write_diagnostics.py
      - name: Retain group index, upload receipts and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gangdong-loopback-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/gangdong-artifact-metadata/
          if-no-files-found: error
          retention-days: 7
