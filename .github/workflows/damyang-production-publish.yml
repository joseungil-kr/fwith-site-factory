          if-no-files-found: warn
      - name: Require upload success and independently recorded provider and public results
        if: always()
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERSION: ${{ steps.version.outcome }}
          BINDING: ${{ steps.binding.outcome }}
          HTTP: ${{ steps.http.outcome }}
        run: test "$DEPLOY" = success && test "$VERSION" = success && test "$BINDING" = success && test "$HTTP" = success

  recovery_finalize_indexnow:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.event.issue.title == '[DAMYANG-INDEXNOW-RECOVERY-FINALIZE] 20261016' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.user.login == 'joseungil-kr'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROL_DIR: control/scripts/direct-damyang-recovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Require reviewed actual identities before artifact retrieval
        id: selected
