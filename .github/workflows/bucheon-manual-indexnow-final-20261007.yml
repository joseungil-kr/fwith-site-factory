name: bucheon Manual IndexNow Final Once
on:
  push:
    branches: [manual-bucheon-indexnow-final-20261007]
permissions:
  contents: read
concurrency:
  group: manual-bucheon-indexnow-final-20261007
  cancel-in-progress: false
jobs:
  submit-once:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test helper without external actions
        working-directory: scripts/manual-indexnow-20261007
        run: python -m unittest -v test_manual_indexnow.py
      - name: Reverify exact public QA and prepare intent without POST
        id: prepare
        run: >-
          python scripts/manual-indexnow-20261007/manual_indexnow.py
          --plan scripts/manual-indexnow-20261007/plan.pending.json
          --site bucheon-flower-v2 --intent indexnow-intent.json --report indexnow-receipt.json
      - name: Preserve durable pre-POST intent
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.intent_name }}
          path: indexnow-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Download persisted intent for byte readback
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.intent_name }}
          path: downloaded-intent
      - name: Verify intent readback and submit exactly once
        run: >-
          python scripts/manual-indexnow-20261007/manual_indexnow.py
          --plan scripts/manual-indexnow-20261007/plan.pending.json
          --site bucheon-flower-v2 --intent downloaded-intent/indexnow-intent.json --report indexnow-receipt.json --submit
      - name: Retain receipt even for failed or uncertain response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucheon-manual-indexnow-receipt-${{ github.run_id }}
          path: |
            indexnow-intent.json
            indexnow-receipt.json
          if-no-files-found: error
          retention-days: 90
