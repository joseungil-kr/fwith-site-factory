name: SeoulSeocho exact provider read-only inspection
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: seoul-seocho-provider-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.event.issue.title == '[SEOCHO-PROVIDER-READONLY] 20261014' && github.actor == 'joseungil-kr' && github.event.issue.user.login == 'joseungil-kr'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify first attempt and exact read-only request
        run: python3 scripts/direct-seoul-seocho/provider_readonly.py authorize
      - name: Test the fixed read-only boundary without credentials
        run: python3 scripts/direct-seoul-seocho/test_provider_readonly.py
      - name: Read account and exact Worker/domain inventory without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/direct-seoul-seocho/provider_readonly.py inspect
      - name: Retain redacted read-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-seocho-provider-readonly-${{ github.run_id }}
          path: seoul-seocho-provider-readonly.json
          if-no-files-found: error
          retention-days: 14
