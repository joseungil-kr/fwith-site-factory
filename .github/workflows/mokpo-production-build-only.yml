name: Mokpo pinned production build and loopback QA
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mokpo-direct-public-release
  cancel-in-progress: false
jobs:
  production_build:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.title == '[MOKPO-PRODUCTION-BUILD] 20261015' && github.event.issue.user.login == 'joseungil-kr'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_RELEASE_MODE: production
      SITE_INDEXABLE: 'true'
      SITE_URL: https://mokpo.fwith.kr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Select exact authorized production build
        id: select
        run: python3 control/scripts/direct-mokpo/production_build.py select --report selected-source.json
      - name: Pin source and external control binding in build environment
        run: |
          echo 'SITE_FACTORY_REVISION=${{ steps.select.outputs.source_revision }}' >> "$GITHUB_ENV"
          echo "SITE_RELEASE_BINDING_PATH=$GITHUB_WORKSPACE/control/scripts/direct-mokpo/production-binding.json" >> "$GITHUB_ENV"
          echo 'SITE_RELEASE_BINDING_SHA256=${{ steps.select.outputs.binding_sha256 }}' >> "$GITHUB_ENV"
      - name: Recheck production source branch head
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref:'heads/source/mokpo-production-successor-20261015'});
            if (data.object.type !== 'commit' || data.object.sha !== process.env.SITE_FACTORY_REVISION) throw new Error('Pinned source branch moved');
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.source_revision }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all source files and binding
        run: python3 control/scripts/direct-mokpo/production_build.py prebuild --checkout target --report source-prebuild.json
      - name: Test all credential-free preview and production controls
        run: python3 -m unittest discover -s control/scripts/direct-mokpo -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve original preview build and historical regression gates
        working-directory: target/site-factory/mokpo-flower
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/logs"
          npm ci --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/npm-ci.log"
          export SITE_RELEASE_MODE=preview SITE_INDEXABLE=false SITE_URL= SITE_RELEASE_BINDING_PATH='' SITE_RELEASE_BINDING_SHA256=''
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/preview-build.log"
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/preview-native-tests.log"
      - name: Build production metadata and focus target with preserved customer text and assets
        working-directory: target/site-factory/mokpo-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/production-build.log"
          npm run test:production 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/production-mutations.log"
      - name: Verify and package exact 18-file production artifact
        env:
          NATIVE_GATES_PASSED: 'true'
        run: python3 control/scripts/direct-mokpo/production_build.py postbuild --package --checkout target --report production-output.json
      - name: Verify capture selectors and installed Astro CLI against actual production files
        env:
          MOKPO_CAPTURE_INSPECTION_ROOT: ${{ github.workspace }}/target/site-factory/mokpo-flower
        run: python3 control/scripts/direct-mokpo/test_capture_contract.py
      - name: Install existing pinned browser tooling and Korean fonts
        run: |
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' | tee evidence/logs/font-match.txt
      - name: Inspect production artifact on runner loopback only
        run: |
          set -euo pipefail
          python3 control/scripts/direct-mokpo/production_capture.py --checkout target --output evidence/browser 2>&1 | tee evidence/logs/capture.log
      - name: Seal retained screenshots and reports
        if: always()
        run: python3 control/scripts/direct-mokpo/production_capture.py --seal --output evidence/browser
      - name: Retain production bytes and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mokpo-production-build-${{ github.run_id }}-${{ github.sha }}
          path: |
            release/
            selected-source.json
            source-prebuild.json
            production-output.json
            evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
