name: Baekse live Worker HTTP diagnostics read only
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['.github/workflows/baekse-order-live-diag.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect exact active Worker revision and binding metadata
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a=os.environ['CF_ACCOUNT'];t=os.environ['CF_TOKEN'];name='funeralflower-home-preview'
          def get(p):
            r=urllib.request.Request('https://api.cloudflare.com/client/v4'+p,headers={'Authorization':'Bearer '+t})
            with urllib.request.urlopen(r,timeout=30) as h:
              return json.load(h)['result']
          scripts=get('/accounts/'+a+'/workers/scripts')
          s=next((x for x in scripts if x.get('id')==name),None)
          assert s
          d=get('/accounts/'+a+'/workers/scripts/'+name+'/deployments')
          bs=get('/accounts/'+a+'/workers/scripts/'+name+'/settings')
          maps=get('/accounts/'+a+'/workers/domains')
          print('SCRIPT_MODIFIED',s.get('modified_on'))
          print('LATEST_VERSIONS',d['deployments'][0]['versions'])
          print('BINDINGS',[(b.get('type'),b.get('name')) for b in bs.get('bindings') or []])
          print('CUSTOM_DOMAINS',[(x.get('hostname'),x.get('service')) for x in maps if x.get('service')==name])
          ws=get('/accounts/'+a+'/workers/workers?per_page=200')
          w=next((x for x in ws if x.get('name')==name),None)
          assert w
          detail=get('/accounts/'+a+'/workers/workers/'+w['id'])
          print('REFERENCES',detail.get('references'))
          PY
      - name: Read Worker hostname status and HTML hints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,socket
          host='funeralflower-home-preview.joseungil.workers.dev'
          try:print('IP_LOOKUP',host,[x[4][0] for x in socket.getaddrinfo(host,443)][:2])
          except Exception as e:print('DNS_ERROR',str(e)[:200])
          for urlpath in ('/','/app.js','/style.css','/serial-printer.js'):
            try:
              req=urllib.request.Request('https://order.baeksefood.com'+urlpath,headers={'User-Agent':'Mozilla/5.0 (compatible; deployment verifier)'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read().decode('utf-8','replace')
                checks={
                  '/':['id="serial-dots"','id="serial-font"','id="serial-cut"','80mm (현재 용지)','512도트','id="bill-delete"','name="company_name"','name="company_email"','관리자 설정','처음 한 번은'],
                  '/app.js':['metric-orange','cancelled-order-row','data-product-move','orders/reissue','orders/delete','movementLabel','company_name'],
                  '/style.css':['.metric.metric-orange','.bank-settings-grid','.cancelled-order-row','.order-move-buttons'],
                  '/serial-printer.js':['WIDTH_CHOICES','80: 512','buildRasterJob','0x56']
                }
                assert r.status==200 and all(marker in data for marker in checks[urlpath]),'Missing live admin/dashboard/thermal UI markers'
                if urlpath=='/':
                  assert 'id="serial-test"' not in data and 'id="serial-width-test"' not in data,'Obsolete printer buttons returned'
                if urlpath=='/app.js':
                  assert "serial-test" not in data,'Obsolete printer handlers returned'
                print('LIVE_UI_READBACK_PASS',urlpath,'HTTP',r.status,'MARKERS',len(checks[urlpath]),'NOINDEX',r.headers.get('X-Robots-Tag'))
            except Exception as e:
              print('LIVE_UI_READBACK_FAIL',urlpath,str(e)[:160])
              raise
          for label,ua in [('python-default','Python-urllib/3.12'),('browser-style','Mozilla/5.0 (compatible; deployment verifier)')]:
            try:
              req=urllib.request.Request('https://'+host+'/',headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=15) as r: print('UA_PROBE',label,r.status)
            except urllib.error.HTTPError as e: print('UA_PROBE',label,e.code)
          for label,ua in [('python-default','Python-urllib/3.12'),('browser-style','Mozilla/5.0 (compatible; deployment verifier)')]:
            try:
              req=urllib.request.Request('https://'+host+'/api/login',data=b'{"password":"invalid-smoke-test"}',headers={'Content-Type':'application/json','Origin':'https://'+host,'User-Agent':ua},method='POST')
              with urllib.request.urlopen(req,timeout=15) as r:print('LOGIN_POST_PROBE',label,r.status)
            except urllib.error.HTTPError as e:
              print('LOGIN_POST_PROBE',label,e.code,'BODY',e.read(120).decode('utf-8','replace'))
          for p in ('/','/index.html','/api/session','/api/state','/app.js','/serial-printer.js'):
            u='https://'+host+p
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; deployment verifier)'})
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(600)
                print('HTTP_READ',p,r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'NOINDEX',r.headers.get('X-Robots-Tag'),'LENGTH_FIRST',len(body),'HAS_BAEKSE',b'\xeb\xb0\xb1\xec\x84\xb8' in body,'PREFIX',body[:140].decode('utf-8','replace'))
            except urllib.error.HTTPError as e:
              print('HTTP_READ',p,'ERROR_STATUS',e.code,'BODY_PREFIX',e.read(180).decode('utf-8','replace'))
            except Exception as e: print('HTTP_READ',p,'NETWORK_ERROR',type(e).__name__,str(e)[:150])
          PY

