name: Baekse live Worker HTTP diagnostics read only
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['.github/workflows/baekse-order-live-diag.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect exact active Worker revision and binding metadata
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a=os.environ['CF_ACCOUNT'];t=os.environ['CF_TOKEN'];name='funeralflower-home-preview'
          def get(p):
            r=urllib.request.Request('https://api.cloudflare.com/client/v4'+p,headers={'Authorization':'Bearer '+t})
            with urllib.request.urlopen(r,timeout=30) as h:
              return json.load(h)['result']
          scripts=get('/accounts/'+a+'/workers/scripts')
          s=next((x for x in scripts if x.get('id')==name),None)
          assert s
          d=get('/accounts/'+a+'/workers/scripts/'+name+'/deployments')
          bs=get('/accounts/'+a+'/workers/scripts/'+name+'/settings')
          maps=get('/accounts/'+a+'/workers/domains')
          print('SCRIPT_MODIFIED',s.get('modified_on'))
          print('LATEST_VERSIONS',d['deployments'][0]['versions'])
          print('BINDINGS',[(b.get('type'),b.get('name')) for b in bs.get('bindings') or []])
          print('CUSTOM_DOMAINS',[(x.get('hostname'),x.get('service')) for x in maps if x.get('service')==name])
          ws=get('/accounts/'+a+'/workers/workers?per_page=200')
          w=next((x for x in ws if x.get('name')==name),None)
          assert w
          detail=get('/accounts/'+a+'/workers/workers/'+w['id'])
          print('REFERENCES',detail.get('references'))
          PY
      - name: Read Worker hostname status and HTML hints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,socket
          host='funeralflower-home-preview.joseungil.workers.dev'
          try:print('IP_LOOKUP',host,[x[4][0] for x in socket.getaddrinfo(host,443)][:2])
          except Exception as e:print('DNS_ERROR',str(e)[:200])
          for urlpath in ('/','/app.js','/style.css','/serial-printer.js','/request/','/buyer.js','/buyer.css'):
            try:
              req=urllib.request.Request('https://order.baeksefood.com'+urlpath,headers={'User-Agent':'Mozilla/5.0 (compatible; deployment verifier)'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read().decode('utf-8','replace')
                checks={
                  '/':['id="serial-dots"','id="serial-font"','id="serial-cut"','80mm (현재 용지)','512도트','id="bill-delete"','id="bill-delivery"','name="company_name"','name="company_email"','data-tab="settings"','처음 한 번은','data-tab="requests"','id="request-list"','id="buyer-home-summary"','data-tab="receivables"','id="ar-opening-form"','id="ar-payment-form"','id="ar-client-select"','id="ar-paid-amount"','id="ar-paid-date"','>거래처관리</button>','>제품관리</button>','>재고관리</button>','>미수금관리(입금관리)</button>','>설정</button>','<option value="none" selected>','id="nav-requests-pending"','발주요청(<span id="nav-requests-pending">0</span>)','id="mobile-menu-toggle"','aria-controls="nav"','id="mobile-requests"','id="mobile-requests-pending"','id="mobile-logout"','class="mobile-shortcuts"','OPERATIONS / DASHBOARD','OPERATIONS / ORDER REQUESTS','FINANCE / RECEIVABLES','id="home-request-preview"','id="home-shortages"','id="request-overview"','id="request-filters"','id="request-search"','id="receivables-overview"','class="receivables-layout"'],
                  '/app.js':['metric-orange','cancelled-order-row','data-product-move','orders/reissue','orders/delete','orders/delivery','deliveryLabel','movementLabel','company_name','requests/fulfill','requests/link/issue','buyer-home-summary','clientReceivable','syncOrderPreviousBalance','receivables/opening','receivables/payments','receivables/payments/void','renderRequestNavCount','state.buyer_dashboard?.pending_count','state.buyer_dashboard=result.summary','setMobileMenuOpen','closeMobileMenu','mobile-requests-pending','mobile-menu-toggle','mobile-expanded','renderBuyerRequestCards','requestNeedsRestock','renderHomeRequestPreview','requestFilter','request-search','receivables-overview'],
                  '/style.css':['.metric.metric-orange','.bank-settings-grid','.cancelled-order-row','.order-move-buttons','.ar-current-stats','.ar-form','@media screen and (max-width:768px)','.nav.mobile-expanded','.mobile-shortcuts','.mobile-header-actions','--bk-green:#0b7668','.dashboard-detail-grid{display:grid','.buyer-request-item{display:grid','.receivables-layout{display:grid'],
                  '/serial-printer.js':['WIDTH_CHOICES','80: 512','buildRasterJob','receiptShippingLabel','0x56'],
                  '/request/':['id="buyer-form"','id="buyer-products"','id="delivery-date"','noindex'],
                  '/buyer.js':['request_key','/api/buyer/','submit','overview'],
                  '/buyer.css':['buyer-product','buyer-submit']
                }
                assert r.status==200 and all(marker in data for marker in checks[urlpath]),'Missing live admin/dashboard/thermal UI markers'
                if urlpath=='/':
                  assert 'id="serial-test"' not in data and 'id="serial-width-test"' not in data,'Obsolete printer buttons returned'
                  nav=data.split('<nav class="nav" id="nav">',1)[1].split('</nav>',1)[0]
                  tabs=['data-tab="home"','data-tab="order"','data-tab="requests"','data-tab="bills"','data-tab="products"','data-tab="stock"','data-tab="clients"','data-tab="receivables"','data-tab="settings"']
                  assert nav.count('data-tab=')==len(tabs) and [nav.index(t) for t in tabs]==sorted(nav.index(t) for t in tabs),'Actual navigation order is wrong'
                  assert '<button data-tab="stock">재고관리</button>' in nav and 'data-go="stock"' in data and 'data-page="stock"' in data,'Inventory tab and cross-link must stay available'
                  assert '관리 시작 전 발행한 명세표는 기초 미수금에 이미 반영된 것으로 간주하며 다시 합산하지 않습니다.' not in data,'Removed AR hint returned'
                  assert '기존 명세표의 ‘전 잔고’는 중복 계산하지 않습니다.' not in data,'Removed AR hint returned'
                  assert '428,000원' not in data and '1,250,000원' not in data,'Static mockup financial values in production'
                if urlpath=='/app.js':
                  assert "serial-test" not in data,'Obsolete printer handlers returned'
                  assert "function show(tab){closeMobileMenu();$('[data-page]').forEach" in data, 'Mobile tab navigation regression'
                  preview=data.split('async function openBill(',1)[1].split('function printBill(',1)[0]
                  assert all(x not in preview for x in ('<b>이메일:</b>','<b>출고단가:</b>','<b>상태:</b>','<b>비고:</b>')),'Unnecessary printable invoice fields returned'
                  assert all(x in preview for x in ('<b>공급자:</b>','<b>거래처:</b>','공급가액','부가세','전 잔고','입금처:')),'Invoice financial fields incomplete'
                if urlpath=='/serial-printer.js':
                  receipt=data.split('export function makeReceiptRows(',1)[1].split('function fontFor(',1)[0]
                  assert all(x not in receipt for x in ('receiptShippingLabel(o)','company.company_email','o.memo','출고단가:')),'Unnecessary thermal receipt fields returned'
                  assert all(x in receipt for x in ("text:'공급자: '","text:'전표번호: '","text:'출고일: '","rows.push({line:true})")),'Thermal receipt headings or separators missing'
                if urlpath=='/style.css':
                  assert '.invoice .invoice-meta{padding-bottom:14px;border-bottom:1px solid #d9e3dc}' in data and '.invoice .invoice-meta>div+div{border-left:1px solid #d9e3dc;' in data,'A4 print dividers missing'
                print('LIVE_UI_READBACK_PASS',urlpath,'HTTP',r.status,'MARKERS',len(checks[urlpath]),'NOINDEX',r.headers.get('X-Robots-Tag'))
            except Exception as e:
              print('LIVE_UI_READBACK_FAIL',urlpath,str(e)[:160])
              raise
          for label,ua in [('python-default','Python-urllib/3.12'),('browser-style','Mozilla/5.0 (compatible; deployment verifier)')]:
            try:
              req=urllib.request.Request('https://'+host+'/',headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=15) as r: print('UA_PROBE',label,r.status)
            except urllib.error.HTTPError as e: print('UA_PROBE',label,e.code)
          for label,ua in [('python-default','Python-urllib/3.12'),('browser-style','Mozilla/5.0 (compatible; deployment verifier)')]:
            try:
              req=urllib.request.Request('https://'+host+'/api/login',data=b'{"password":"invalid-smoke-test"}',headers={'Content-Type':'application/json','Origin':'https://'+host,'User-Agent':ua},method='POST')
              with urllib.request.urlopen(req,timeout=15) as r:print('LOGIN_POST_PROBE',label,r.status)
            except urllib.error.HTTPError as e:
              print('LOGIN_POST_PROBE',label,e.code,'BODY',e.read(120).decode('utf-8','replace'))
          for p in ('/','/index.html','/api/session','/api/state','/app.js','/serial-printer.js'):
            u='https://'+host+p
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; deployment verifier)'})
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(600)
                print('HTTP_READ',p,r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'NOINDEX',r.headers.get('X-Robots-Tag'),'LENGTH_FIRST',len(body),'HAS_BAEKSE',b'\xeb\xb0\xb1\xec\x84\xb8' in body,'PREFIX',body[:140].decode('utf-8','replace'))
            except urllib.error.HTTPError as e:
              print('HTTP_READ',p,'ERROR_STATUS',e.code,'BODY_PREFIX',e.read(180).decode('utf-8','replace'))
            except Exception as e: print('HTTP_READ',p,'NETWORK_ERROR',type(e).__name__,str(e)[:150])
          PY

