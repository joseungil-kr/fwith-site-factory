name: Baekse inactive version read-only verification
on:
  push:
    branches: [review/baekse-order-telegram-20261113]
    paths: ['.github/workflows/baekse-telegram-diagnostic-only.yml']
permissions: {contents: read}
concurrency:
  group: baekse-order-existing-worker-updates
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'joseungil-kr/fwith-site-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.BAEKSE_ORDER_RELEASE_CF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read active and inactive immutable version metadata only
        run: python scripts/diagnostics/baekse/inactive_readonly_diagnostic.py
