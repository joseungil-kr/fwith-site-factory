name: Bucheon manual preview evidence

on:
  push:
    branches: [manual-bucheon-qa-20261007]
    paths:
      - 'site-factory/bucheon-flower/**'
      - '.github/workflows/bucheon-manual-preview-qa.yml'
      - '.github/scripts/bucheon-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-bucheon-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_LOCAL_PREVIEW: 'true'
      SITE_URL: https://localhost:8934
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert fixed preview boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/bucheon-manual-playwright" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-bucheon-qa-20261007'
          test "$SITE_URL" = 'https://localhost:8934'
          test "$SITE_INDEXABLE" = 'false'
          test "$MANUAL_LOCAL_PREVIEW" = 'true'
          mkdir -p bucheon-preview-evidence
          node -e 'const fs=require("fs"),crypto=require("crypto");const h=crypto.createHash("sha256").update(fs.readFileSync("site-factory/bucheon-flower/src/data/manual-pages.json")).digest("hex");if(h!=="fc747c9e6360557adcc1ccfa1c9ac018910b64bea71c2c6731aee1d3fd525a2b")throw Error("Unexpected content digest"); const p=JSON.parse(fs.readFileSync("site-factory/bucheon-flower/src/data/manual-provenance.json"));if(p.dependencyHash!=="f34756bce92764bf7c5315274b1e79e07bdd26b6d682939e94ec7d72a9da954d"||p.independentReview.status!=="pending")throw Error("Unexpected candidate state");' 
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("site-factory/bucheon-flower/src/data/manual-provenance.json")); fs.writeFileSync("bucheon-preview-evidence/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,provenance:p},null,2));'
      - name: Install native site dependencies
        working-directory: site-factory/bucheon-flower
        run: npm install --no-package-lock
      - name: Native gated localhost noindex build
        shell: bash
        working-directory: site-factory/bucheon-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/bucheon-preview-evidence/native-build.log"
      - name: Native regression tests
        shell: bash
        working-directory: site-factory/bucheon-flower
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/bucheon-preview-evidence/native-tests.log"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > bucheon-preview-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > bucheon-preview-evidence/playwright-dependencies.json
      - name: Capture localhost desktop and mobile evidence
        run: node .github/scripts/bucheon-manual-preview.mjs
      - name: Retain evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucheon-manual-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            bucheon-preview-evidence/revision.json
            bucheon-preview-evidence/native-build.log
            bucheon-preview-evidence/native-tests.log
            bucheon-preview-evidence/font-match.txt
            bucheon-preview-evidence/playwright-dependencies.json
            bucheon-preview-evidence/capture-results.json
            bucheon-preview-evidence/browser-console.json
            bucheon-preview-evidence/page-errors.json
            bucheon-preview-evidence/network.json
            bucheon-preview-evidence/screenshots/*.jpg
          if-no-files-found: error
          retention-days: 7

