name: Boseong reviewed fixed production publish
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.event.issue.title == '[BOSEONG-PRODUCTION-PUBLISH] 20261017' && github.event.issue.user.login == 'joseungil-kr' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && 'boseong-direct-public-release' || format('boseong-irrelevant-run-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  publish:
    # Activated only after the exact authorization record was saved and read back on main.
    # Its saved commit revision is pinned in authorization-binding.json.
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.event.issue.title == '[BOSEONG-PRODUCTION-PUBLISH] 20261017' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.user.login == 'joseungil-kr'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REGION: boseong
      CONTROL_DIR: control/scripts/direct-boseong
      BOSEONG_SOURCE_CHECKOUT: ${{ github.workspace }}/source
      REVISION: ${{ fromJSON(github.event.issue.body).source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize exact owner, main, first attempt, binding and source
        id: source
        run: |
          python3 "$CONTROL_DIR/publish.py" authorize --report selected-source.json
      - name: Require sealed all-route output and independent mobile and desktop review
        id: release
        run: python3 "$CONTROL_DIR/publish.py" select --report selected-release.json
      - name: Verify actual successful build and exact retained artifact metadata
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ steps.release.outputs.build_run_id }}
          BUILD_ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
        with:
          script: |
            const fs = require('fs');
            const desc = JSON.parse(fs.readFileSync(process.env.CONTROL_DIR + '/production-release-review-binding.json'));
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.BUILD_RUN_ID)});
            if (run.id !== Number(desc.buildRunId) || run.run_attempt !== 1 || run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'issues' || run.head_branch !== 'main' || run.head_sha !== desc.buildControlSha || run.path !== '.github/workflows/boseong-production-build-only.yml' || run.repository.full_name !== 'joseungil-kr/fwith-site-factory' || run.actor?.login !== 'joseungil-kr' || run.triggering_actor?.login !== 'joseungil-kr') throw new Error('Build identity mismatch');
            const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: Number(process.env.BUILD_ARTIFACT_ID)});
            if (artifact.id !== Number(desc.artifactId) || artifact.expired || artifact.name !== process.env.REGION + '-production-build-' + desc.buildRunId + ('-' + desc.buildControlSha) || artifact.workflow_run.id !== run.id || artifact.workflow_run.head_sha !== run.head_sha || artifact.workflow_run.head_branch !== 'main') throw new Error('Artifact identity mismatch');
            if (process.env.REGION === 'boseong' && artifact.digest !== desc.artifactDigest) throw new Error('Boseong archive digest mismatch');
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          run-id: ${{ steps.release.outputs.build_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: boseong-retained
      - name: Stage only the retained Boseong static release package
        if: env.REGION == 'boseong'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('boseong-retained/release')
          assert root.is_dir() and not root.is_symlink()
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert not Path('release').exists()
          shutil.copytree(root, 'release', symlinks=True)
          PY
      - name: Restore exact ignored private11 inputs from the reviewed artifact without source execution
        run: python3 "$CONTROL_DIR/publish.py" restore-input --report private-input-check.json
      - name: Rehash exact reviewed static output and generate fixed route-less configuration
        run: python3 "$CONTROL_DIR/publish.py" artifact --report artifact-check.json
      - name: Run fixed control safety tests without provider credentials
        env:
          BOSEONG_TEST_DIST: ${{ github.workspace }}/release/dist
          BOSEONG_ACCEPTED_SOURCE_DIR: ${{ github.workspace }}/source/site-factory/boseong-flower
        run: |
          python3 -m unittest discover -s "$CONTROL_DIR" -p 'test_*.py' -v
          python3 "$CONTROL_DIR/production-release/test_production_adapter.py"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck fixed source branch before mutation
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        with:
          script: |
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('Reruns forbidden');
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/' + process.env.SOURCE_BRANCH});
            if (data.object.type !== 'commit' || data.object.sha !== process.env.REVISION) throw new Error('Source branch moved');
      - name: GET-only exact account, Worker and hostname collision preflight
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$CONTROL_DIR/publish.py" preflight --report binding-before.json
      - name: Deploy fixed route-less static assets once
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_SANITIZE: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          wrangler_workdir="$(mktemp -d "$RUNNER_TEMP/regional-wrangler.XXXXXX")"
          cd "$wrangler_workdir"
          if ! npx --yes wrangler@4.148.0 deploy --config "$GITHUB_WORKSPACE/release/wrangler.publish.json" > "$RUNNER_TEMP/regional-production-upload.log" 2>&1; then
            echo 'Upload failed or uncertain. Inspect GET and HTTP evidence before recovery.'
            exit 1
          fi
      - name: Attach only approved fixed hostname with every override false
        id: attach
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$CONTROL_DIR/publish.py" attach --report domain-attach.json
      - name: GET-only binding readback, including after an uncertain upload
        id: binding
        if: ${{ always() && steps.preflight.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$CONTROL_DIR/publish.py" readback --report binding-after.json
      - name: Verify every public output byte, region-specific robots and real 404
        id: http
        if: ${{ always() && steps.binding.outcome == 'success' }}
        continue-on-error: true
        run: python3 "$CONTROL_DIR/publish.py" http --report public-http.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REGION }}-production-result-${{ github.run_id }}
          path: |
            selected-source.json
            selected-release.json
            private-input-check.json
            artifact-check.json
            http-contract.json
            binding-before.json
            domain-attach.json
            binding-after.json
            public-http.json
            public-robots.txt
            public-robots-headers.json
            release/release.json
            release/wrangler.publish.json
          if-no-files-found: warn
      - name: Require verified deployment, attachment and public bytes; submission remains deferred
        if: always()
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          ATTACH: ${{ steps.attach.outcome }}
          BINDING: ${{ steps.binding.outcome }}
          HTTP: ${{ steps.http.outcome }}
        run: test "$DEPLOY" = success && test "$ATTACH" = success && test "$BINDING" = success && test "$HTTP" = success

