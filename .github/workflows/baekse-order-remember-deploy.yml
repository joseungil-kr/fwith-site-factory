name: Baekse order update remember-me and admin Secret on existing Worker
# Release is retriggered after operator rotates the protected admin Secret; no secret values are logged.
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths:
      - '.github/workflows/baekse-order-remember-deploy.yml'
      - 'apps/baekse-order/src.js'
      - 'apps/baekse-order/logic.js'
      - 'apps/baekse-order/public/**'
      - 'apps/baekse-order/wrangler.reused.jsonc'
permissions:
  contents: read
concurrency:
  group: baekse-order-existing-worker-updates
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BAEKSE_ORDER_ADMIN_PASSWORD: ${{ secrets.BAEKSE_ORDER_ADMIN_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/baekse-order-deploy-20261103
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify code, tests and admin credential presence
        working-directory: apps/baekse-order
        run: |
          node --check src.js
          node --check requests.js
          node --check public/app.js
          node --check public/buyer.js
          node --check public/serial-printer.js
          npm test
          test "${#BAEKSE_ORDER_ADMIN_PASSWORD}" -ge 12 || { echo 'GitHub secret BAEKSE_ORDER_ADMIN_PASSWORD is missing or too short'; exit 3; }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node -e 'const j=JSON.parse(require("fs").readFileSync("wrangler.reused.jsonc","utf8")); if(j.name!=="funeralflower-home-preview"||j.keep_vars!==true||j.durable_objects.bindings[0].class_name!=="OrderDatabase")process.exit(1);'
          echo "SOURCE_AND_SECRET_GATE_PASS"
      - name: Check existing order domain / Worker identity and capture rollback version
        id: guard
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          root='https://api.cloudflare.com/client/v4';worker='funeralflower-home-preview';hostname='order.baeksefood.com'
          def get(p):
            req=urllib.request.Request(root+p,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:
              x=json.load(r)
              assert x.get('success'), 'Cloudflare read failed'
              return x['result']
          domains=get('/accounts/'+a+'/workers/domains')
          linked=[x for x in domains if x.get('service')==worker]
          assert len(linked)==1 and linked[0].get('hostname')==hostname, 'Worker is linked to an unexpected domain'
          zones=get('/zones?name=baeksefood.com')
          assert len(zones)==1 and zones[0].get('status')=='active' and zones[0].get('account',{}).get('id')==a,'Zone identity mismatch'
          scripts=get('/accounts/'+a+'/workers/scripts')
          assert any(x.get('id')==worker for x in scripts),'Must reuse the existing script, never create a new one'
          pages=get('/accounts/'+a+'/workers/workers?per_page=200')
          info=next((x for x in pages if x.get('name')==worker),None)
          assert info,'Existing Worker missing'
          obj=get('/accounts/'+a+'/workers/workers/'+info['id'])
          refs=obj.get('references') or {}
          assert not (refs.get('workers') or refs.get('dispatch_namespace_outbounds') or refs.get('queues')),'External Worker references detected'
          assert all(x.get('worker_name')==worker for x in (refs.get('durable_objects') or [])),'DO is referenced by another Worker'
          schedules=get('/accounts/'+a+'/workers/scripts/'+worker+'/schedules').get('schedules') or []
          assert not schedules,'Unexpected scheduled jobs'
          settings=get('/accounts/'+a+'/workers/scripts/'+worker+'/settings')
          bindings={(x.get('type'),x.get('name')) for x in settings.get('bindings') or []}
          required={('assets','ASSETS'),('durable_object_namespace','ORDER_DB')}
          assert required.issubset(bindings) and bindings.issubset(required | {('secret_text','ADMIN_PASSWORD')}), 'Unexpected Worker binding'
          deployments=get('/accounts/'+a+'/workers/scripts/'+worker+'/deployments')['deployments']
          assert len(deployments)>0 and len(deployments[0].get('versions') or [])==1,'No stable rollback version'
          version=deployments[0]['versions'][0]
          assert version.get('percentage')==100,'Previous version is not deployed at 100%'
          previous=version['version_id']
          assert previous=='e13fad76-da5b-4a70-acd9-837219f7898b','Worker version changed since last verified release'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
            f.write('previous_version='+previous+'\n')
          print('SAFE_ORDER_APP_UPDATE_PASS',hostname,'existingWorker',worker,'rollbackPinned',previous)
          PY
      - name: Update existing Worker code and static assets (do not replace routes)
        id: update
        working-directory: apps/baekse-order
        run: npx --yes wrangler@4.156.2 deploy --config wrangler.reused.jsonc
      - name: Set administrator password from existing GitHub Secret
        id: secret
        working-directory: apps/baekse-order
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BAEKSE_ORDER_ADMIN_PASSWORD" | npx --yes wrangler@4.156.2 secret put ADMIN_PASSWORD --config wrangler.reused.jsonc
          echo 'ADMIN_SECRET_DEPLOYED_WITHOUT_LOGGING_VALUE'
      - name: Check live UI, cookie duration, password login and logout on actual domain
        id: smoke
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,time,http.cookiejar,urllib.request,urllib.error
          base='https://order.baeksefood.com';password=os.environ['BAEKSE_ORDER_ADMIN_PASSWORD']
          ua='Mozilla/5.0 (compatible; deployment verifier)'
          def opener(jar=None):
            op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar)) if jar is not None else urllib.request.build_opener()
            op.addheaders=[('User-Agent',ua)]
            return op
          unauthed=opener()
          for i in range(12):
            try:
              with unauthed.open(base+'/',timeout=25) as r:
                html=r.read().decode('utf-8')
                assert r.status==200 and 'id="login-remember"' in html and '로그인 기억하기' in html
                assert all(mark in html for mark in ['id="serial-slot"','id="serial-baud"','id="serial-print"','id="serial-dots"','id="serial-font"','id="serial-cut"']), 'Web Serial toolbar missing'
                assert 'id="serial-test"' not in html and 'id="serial-width-test"' not in html,'Obsolete printer test buttons must be hidden'
                assert all(mark in html for mark in ['id="previous-balance"','id="payment-form"','name="company_name"','name="company_business_no"','name="company_address"','name="company_phone"','name="company_email"','name="bank_name"','name="account_number"','name="account_holder"','id="bill-delete"','id="bill-delivery"']), 'Admin fields or delivery button missing'
                assert '>관리자 설정</button>' in html and '처음 한 번은' in html,'Renamed admin tab or simplified help missing'
                assert all(x in html for x in ['data-tab="requests"','id="buyer-home-summary"','id="request-shortages"','id="request-list"','id="link-result"']),'Buyer request manager UI missing'
                assert 'COM4 (현재 사용)' in html and '9600bps' in html and 'COM6' in html, 'COM range/default missing'
                assert 'noindex' in r.headers.get('X-Robots-Tag','').lower()
                assert 'script-src' in r.headers.get('Content-Security-Policy','')
              break
            except Exception as e:
              if i==11:raise
              print('WAITING_FOR_UI_PROPAGATION',i,type(e).__name__)
              time.sleep(8)
          with unauthed.open(base+'/serial-printer.js',timeout=25) as r:
            module=r.read().decode('utf-8')
            assert r.status==200 and 'SerialReceiptPrinter' in module and 'requestPort()' in module and 'rasterBand' in module and 'buildRasterJob' in module and 'testWidth' in module and '0x56' in module and 'receiptShippingLabel' in module and '전 잔고' in module and '입금처' in module
            assert 'noindex' in r.headers.get('X-Robots-Tag','').lower()
          print('SERIAL_MODULE_PUBLIC_200: COM1-6 labels, 9600bps default, ESC/POS bitmap, noindex')
          for path,markers in [
            ('/request/',['id="buyer-form"','id="buyer-products"','id="delivery-date"','noindex']),
            ('/buyer.js',['/api/buyer/','request_key','overview','submit']),
            ('/buyer.css',['buyer-product','buyer-submit'])
          ]:
            with unauthed.open(base+path,timeout=25) as r:
              page=r.read().decode('utf-8')
              assert r.status==200 and all(m in page for m in markers),'Buyer portal asset missing '+path
              assert 'noindex' in r.headers.get('X-Robots-Tag','').lower()
          print('BUYER_PORTAL_PUBLIC_ASSETS_PASS: mobile buyer entry, JS and CSS HTTPS200 noindex')
          for path in ['/api/requests/list','/api/state']:
            try:unauthed.open(base+path,timeout=20)
            except urllib.error.HTTPError as e:assert e.code==401,'Authenticated API should deny anonymous reads'
            else:raise AssertionError('Anonymous admin data exposure at '+path)
          try:unauthed.open(base+'/api/state',timeout=20)
          except urllib.error.HTTPError as e:assert e.code==401,'Anonymous API must reject'
          else:raise AssertionError('Anonymous access to inventory')
          jar=http.cookiejar.CookieJar();op=opener(jar)
          def login(remember,seconds):
            data=json.dumps({'password':password,'remember':remember}).encode('utf-8')
            req=urllib.request.Request(base+'/api/login',data=data,method='POST',headers={'Content-Type':'application/json','Origin':base})
            with op.open(req,timeout=30) as r:
              payload=json.load(r);cookie=r.headers.get('Set-Cookie','')
              assert payload['ok'] and payload.get('remembered') is remember
              assert f'Max-Age={seconds}' in cookie, 'Cookie lifetime mismatch'
              assert 'HttpOnly' in cookie and 'Secure' in cookie and 'SameSite=Strict' in cookie
              return cookie.split(';')[0]
          def logout(cookie):
            req=urllib.request.Request(base+'/api/logout',method='POST',data=b'{}',headers={'Content-Type':'application/json','Origin':base})
            with op.open(req,timeout=20) as r:assert r.status==200
            try:unauthed.open(urllib.request.Request(base+'/api/session',headers={'Cookie':cookie}),timeout=20)
            except urllib.error.HTTPError as e:assert e.code==401,'Logout did not revoke token'
            else:raise AssertionError('Revoked token was accepted')
          short=login(False,28800)
          with op.open(base+'/api/session',timeout=20) as r:assert json.load(r)['authenticated'] is True
          logout(short)
          long=login(True,2592000)
          with op.open(base+'/api/state',timeout=25) as r:
            payload=json.load(r)
            assert len(payload['products'])>=6,'Seed catalog not available'
            assert any(p['name']=='잉어반죽' and p['price']==11000 for p in payload['products'])
            receipt_settings=payload.get('receipt_settings')
            assert isinstance(receipt_settings,dict) and all(k in receipt_settings for k in ('bank_name','account_number','account_holder','company_name','company_business_no','company_address','company_phone','company_email')),'Admin settings schema was not created safely'
            assert set(('today_count','today_amount','month_count','month_amount','cumulative_amount')).issubset(payload.get('metrics',{})),'Six KPI aggregation fields missing'
            assert all('sort_order' in product for product in payload.get('products',[])),'Product order migration missing'
            assert payload['products']==sorted(payload['products'],key=lambda p:(p['sort_order'],p['id'])),'Product sort order inconsistent'
            assert all('delivery_status' in x and 'delivered_at' in x for x in payload.get('orders',[])),'Delivery-state database migration missing'
            summary=payload.get('buyer_dashboard',{})
            assert all(k in summary for k in ('pending_count','shortage_count','shortages','products')),'Pending and shortage state missing'
            assert isinstance(payload.get('buyer_links'),list),'Buyer link metadata missing'
            assert all('token_hash' not in obj and 'token' not in obj for obj in payload['buyer_links']),'Secret tokens exposed to admin state'
            print('BUYER_PORTAL_DATABASE_PASS: secure link metadata, request tables and aggregated stock shortages')
            for item in payload.get('orders',[])[:1]:
              req=urllib.request.Request(base+'/api/orders/detail?id='+str(item['id']))
              with op.open(req,timeout=25) as d:
                invoice=json.load(d)
                order=invoice['order']
                assert isinstance(order.get('bank'),dict)
                assert order.get('previous_balance',0)>=0
                assert order.get('amount_due')==order['total']+order['previous_balance'],'Old and new invoice totals mismatch'
          with unauthed.open(base+'/app.js',timeout=25) as r:
            ui=r.read().decode('utf-8')
            assert all(k in ui for k in ['metric-orange','cancelled-order-row','data-product-move','orders/reissue','orders/delete','orders/delivery','deliveryLabel','movementLabel']), 'Front-end behaviors missing'
            assert all(k in ui for k in ['data-client-link','requests/link/issue','requests/link/revoke','requests/fulfill','loadBuyerRequests','buyer-home-summary']),'Buyer admin actions missing'
            assert 'serial-width-test' not in ui and 'serial-test' not in ui,'Old printer test handlers remain'
          print('ADMIN_DASHBOARD_LIVE_PASS: six KPIs, company settings, product sorting, invoice restore/delete, localized stock movements')
          print('SHIPPING_LIVE_READBACK_PASS: delivery button, state schema, invoice JS, thermal labels and no unauthenticated inventory access')
          print('PAYMENT_FIELDS_LIVE_PASS: configurable bank persisted, legacy invoices readable, previous balance column available')
          logout(long)
          print('PRODUCTION_REMEMBER_30D_PASS: UI200, API401, short8h, long30d, secureCookie, logoutRevocation, seededProducts')
          for u in ['https://baeksefood.com','https://interpiad.com']:
            with unauthed.open(u,timeout=25) as r:assert r.status==200
          print('OTHER_SITES_UNCHANGED_HTTP200')
          PY
      - name: Roll back previous code version if production validation fails
        if: ${{ failure() && steps.update.outcome == 'success' && steps.smoke.outcome != 'success' && steps.guard.outputs.previous_version != '' }}
        working-directory: apps/baekse-order
        run: npx --yes wrangler@4.156.2 versions deploy "${{ steps.guard.outputs.previous_version }}@100%" --yes --config wrangler.reused.jsonc
      - name: Report live outcome
        if: always()
        run: |
          echo '## Baekse secure remember-login production release' >> "$GITHUB_STEP_SUMMARY"
          echo '- URL: https://order.baeksefood.com' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reused existing Worker: funeralflower-home-preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Durable Object inventory data retained; no DNS/route changes.' >> "$GITHUB_STEP_SUMMARY"
          echo '- See smoke step for authentication and 8-hour/30-day cookie evidence.' >> "$GITHUB_STEP_SUMMARY"
