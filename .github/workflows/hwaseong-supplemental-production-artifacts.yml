      - name: Retain original screenshots 06
        if: always() && hashFiles('hwaseong-source-c-evidence/parts/screens-06/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-production-pixels-${{ github.sha }}-${{ github.run_attempt }}-screens-06
          path: hwaseong-source-c-evidence/parts/screens-06/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain original screenshots 07
        if: always() && hashFiles('hwaseong-source-c-evidence/parts/screens-07/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-production-pixels-${{ github.sha }}-${{ github.run_attempt }}-screens-07
          path: hwaseong-source-c-evidence/parts/screens-07/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain original screenshots 08
        if: always() && hashFiles('hwaseong-source-c-evidence/parts/screens-08/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-production-pixels-${{ github.sha }}-${{ github.run_attempt }}-screens-08
          path: hwaseong-source-c-evidence/parts/screens-08/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain exact production artifact bytes
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-production-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: site-factory/hwaseong-flower/dist/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

