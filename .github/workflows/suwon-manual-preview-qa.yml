name: Suwon manual preview evidence

on:
  push:
    branches: [manual-suwon-reconciled-qa-20261007]
    paths:
      - 'site-factory/suwon-flower/**'
      - '.github/workflows/suwon-manual-preview-qa.yml'
      - '.github/scripts/suwon-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-suwon-reconciled-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_LOCAL_PREVIEW: 'true'
      SITE_URL: https://localhost:8934
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert fixed preview boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/suwon-manual-playwright" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-suwon-reconciled-qa-20261007'
          test "$SITE_URL" = 'https://localhost:8934'
          test "$SITE_INDEXABLE" = 'false'
          test "$MANUAL_LOCAL_PREVIEW" = 'true'
          mkdir -p suwon-preview-evidence
          git merge-base --is-ancestor 2c1ad43190fc60af235d11e6e63ae79975bc271b "$GITHUB_SHA"
          test "$(git branch --show-current)" = "manual-suwon-reconciled-qa-20261007"
          node -e 'const fs=require("fs"),crypto=require("crypto");const h=crypto.createHash("sha256").update(fs.readFileSync("site-factory/suwon-flower/src/data/manual-pages.json")).digest("hex");if(h!=="8c489b18891a34968146f659ab67c94a378ecd3591db5d69dc61bc5b493269cf")throw Error("Unexpected content digest"); const p=JSON.parse(fs.readFileSync("site-factory/suwon-flower/src/data/manual-provenance.json"));if(p.scopeDigest!=="798f04994e7901737a9a91939bf1490aefd03ffe8720d65e58e451ed843e6eb9"||p.independentReview.status!=="pending"||p.manualRevisionsSha256!=="ffdf11206d6e93c741cd04294a53dfa244e256d8b583b5b2fc93524687aa319b"||p.expectedReviewerId!=="independent-suwon-hwaseong-review-20261007"||p.independentReview.evidencePath!==null)throw Error("Unexpected candidate state");' 
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("site-factory/suwon-flower/src/data/manual-provenance.json")); fs.writeFileSync("suwon-preview-evidence/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,provenance:p},null,2));'
      - name: Install native site dependencies
        working-directory: site-factory/suwon-flower
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native gated localhost noindex build
        shell: bash
        working-directory: site-factory/suwon-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/suwon-preview-evidence/native-build.log"
      - name: Native regression tests
        shell: bash
        working-directory: site-factory/suwon-flower
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/suwon-preview-evidence/native-tests.log"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > suwon-preview-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > suwon-preview-evidence/playwright-dependencies.json
      - name: Capture localhost desktop and mobile evidence
        run: node .github/scripts/suwon-manual-preview.mjs
      - name: Group unchanged screenshots into bounded evidence parts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil, json, hashlib
          root = Path('suwon-preview-evidence')
          manifest = []
          for viewport in ['desktop', 'mobile']:
              files = sorted((root / 'screenshots').glob('*-' + viewport + '.jpg'))
              for index in range(4):
                  group = files[index * 16:(index + 1) * 16]
                  if not group:
                      continue
                  destination = root / 'upload-parts' / (viewport + '-part-' + str(index + 1))
                  destination.mkdir(parents=True, exist_ok=True)
                  total = sum(file.stat().st_size for file in group)
                  if total > 30 * 1024 * 1024:
                      raise SystemExit('Screenshot part exceeds safe download size; preserve quality and split further')
                  for source in group:
                      shutil.copyfile(source, destination / source.name)
                      manifest.append({'viewport': viewport, 'part': index + 1, 'file': source.name, 'bytes': source.stat().st_size, 'sha256': hashlib.sha256(source.read_bytes()).hexdigest()})
          (root / 'split-artifact-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYCODE
      - name: Retain logs and capture manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            suwon-preview-evidence/revision.json
            suwon-preview-evidence/native-build.log
            suwon-preview-evidence/native-tests.log
            suwon-preview-evidence/font-match.txt
            suwon-preview-evidence/playwright-dependencies.json
            suwon-preview-evidence/capture-results.json
            suwon-preview-evidence/browser-console.json
            suwon-preview-evidence/page-errors.json
            suwon-preview-evidence/network.json
            suwon-preview-evidence/split-artifact-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain desktop screenshot part 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-desktop-1-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/desktop-part-1/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain desktop screenshot part 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-desktop-2-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/desktop-part-2/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain desktop screenshot part 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-desktop-3-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/desktop-part-3/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain desktop screenshot part 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-desktop-4-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/desktop-part-4/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain mobile screenshot part 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-mobile-1-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/mobile-part-1/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain mobile screenshot part 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-mobile-2-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/mobile-part-2/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain mobile screenshot part 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-mobile-3-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/mobile-part-3/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Retain mobile screenshot part 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-manual-preview-mobile-4-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-preview-evidence/upload-parts/mobile-part-4/*.jpg
          if-no-files-found: error
          retention-days: 7
