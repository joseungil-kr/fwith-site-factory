name: Suwon exact manual artifacts and pixel evidence
on:
  push:
    branches: [manual-suwon-three-facility-preview-20261007]
    paths:
      - 'site-factory/suwon-flower/**'
      - '.github/workflows/suwon-manual-preview-qa.yml'
      - '.github/scripts/suwon-manual-preview.mjs'
permissions:
  contents: read
jobs:
  exact-evidence:
    if: github.ref == 'refs/heads/manual-suwon-three-facility-preview-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: [preview]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_QA_PHASE: ${{ matrix.phase }}
      SITE_URL: http://127.0.0.1:8934
      SITE_ORIGIN: http://127.0.0.1:8934
      SITE_INDEXABLE: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      SHARED_BANNER_REFERENCE_DIST: ${{ github.workspace }}/shared-banner-production-reference/site-factory/suwon-flower/dist
      SHARED_BANNER_REFERENCE_MANIFEST: ${{ github.workspace }}/.github/shared-banner-reference/suwon-production.json
      SHARED_BANNER_REFERENCE_MANIFEST_SHA256: '3122b21e327d3571781999eb8ca15fd58a1ef39c5926e9f81ca4445e9590b6d0'
      SHARED_BANNER_REFERENCE_ARTIFACT_SHA256: '1daeb81be244989e41d25501813c2d16381ac778f55e806be79e7aed405ceb60'
      SHARED_BANNER_REFERENCE_REVISION: '962a279cfb7e3787a02d89c17847bf5f908b7b70'
      SHARED_BANNER_REFERENCE_ORIGIN: 'https://suwon.fwith.kr'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check out immutable previously reviewed production source
        uses: actions/checkout@v4
        with:
          ref: 962a279cfb7e3787a02d89c17847bf5f908b7b70
          path: shared-banner-production-reference
          persist-credentials: false
      - name: Rebuild and authenticate the production route and indexability reference
        working-directory: shared-banner-production-reference/site-factory/suwon-flower
        env:
          SITE_FACTORY_REVISION: '962a279cfb7e3787a02d89c17847bf5f908b7b70'
          SITE_URL: 'https://suwon.fwith.kr'
          SITE_ORIGIN: 'https://suwon.fwith.kr'
          SITE_INDEXABLE: 'true'
          MANUAL_QA_PHASE: production
          MANUAL_PREVIEW: 'false'
          MANUAL_LOCAL_PREVIEW: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '962a279cfb7e3787a02d89c17847bf5f908b7b70'
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p ../evidence
          npm run build
          python3 - <<'PYREFERENCE'
          import os,pathlib,json,hashlib
          def digest(b):return hashlib.sha256(b).hexdigest()
          def compact(x):return json.dumps(x,sort_keys=True,separators=(',',':')).encode()
          raw=pathlib.Path(os.environ['SHARED_BANNER_REFERENCE_MANIFEST']).read_bytes()
          assert digest(raw)==os.environ['SHARED_BANNER_REFERENCE_MANIFEST_SHA256'],'Reference metadata changed'
          ref=json.loads(raw)
          assert ref['baselineRevision']==os.environ['SHARED_BANNER_REFERENCE_REVISION']
          assert ref['productionOrigin']==os.environ['SHARED_BANNER_REFERENCE_ORIGIN']
          root=pathlib.Path('dist');assert root.is_dir() and not root.is_symlink()
          files={}
          for f in sorted(root.rglob('*')):
              assert not f.is_symlink(),'Artifact symlink forbidden'
              if f.is_dir():continue
              assert f.is_file(),'Nonregular artifact'
              files[f.relative_to(root).as_posix()]=digest(f.read_bytes())
          assert files==ref['files'],'Rebuilt original artifact differs from reviewed full manifest'
          assert digest(compact(files))==ref['artifactManifestSha256']==os.environ['SHARED_BANNER_REFERENCE_ARTIFACT_SHA256']
          print('Previously reviewed production reference rebuilt and exact full artifact verified:',len(files))
          PYREFERENCE
      - name: Assert exact content and reviewed native boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/manual-suwon-three-facility-preview-20261007'
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/suwon-manual-playwright" >> "$GITHUB_ENV"
          mkdir -p "suwon-$MANUAL_QA_PHASE-evidence/logs"
          node -e 'const fs=require("fs"),crypto=require("crypto");const h=crypto.createHash("sha256").update(fs.readFileSync("site-factory/suwon-flower/src/data/manual-pages.json")).digest("hex");if(h!=="6bac9e54f6110a2ceaa39ff4ec6754917815221ecc6001dc221b26efa8e9c77a")throw Error("Unexpected content digest");const p=JSON.parse(fs.readFileSync("site-factory/suwon-flower/src/data/manual-provenance.json"));if(p.scopeDigest!=="348e1c5cec3c74e5071d6a7a5cd0c2e97e1c569f0b071229b556a584e330fc1e"||p.independentReview.status!=="pending")throw Error("Unexpected pending candidate state");'
          node -e 'const fs=require("fs");fs.writeFileSync("suwon-"+process.env.MANUAL_QA_PHASE+"-evidence/logs/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,phase:process.env.MANUAL_QA_PHASE,siteUrl:process.env.SITE_URL,siteIndexable:process.env.SITE_INDEXABLE},null,2));'
      - name: Install exact native dependency lock
        working-directory: site-factory/suwon-flower
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build twice and prove exact deterministic artifacts
        shell: bash
        working-directory: site-factory/suwon-flower
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/suwon-$MANUAL_QA_PHASE-evidence"
          for attempt in first second; do
            npm run build 2>&1 | tee "$evidence/logs/native-build-$attempt.log"
            npm test 2>&1 | tee "$evidence/logs/native-tests-$attempt.log"
            python3 -B scripts/test_shared_banners.py 2>&1 | tee "$evidence/logs/shared-banner-tests-$attempt.log"
            python3 scripts/qa_static.py 2>&1 | tee "$evidence/logs/static-$attempt.log"
            node scripts/qa_graph.mjs 2>&1 | tee "$evidence/logs/graph-$attempt.log"
            python3 -c 'import hashlib,json,pathlib,sys; d=pathlib.Path("dist"); m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob("*")) if f.is_file()}; assert len(m)==79,len(m);pathlib.Path(sys.argv[1]).write_text(json.dumps(m,sort_keys=True,separators=(",",":")))' "$evidence/logs/$attempt.manifest.json"
          done
          cmp "$evidence/logs/first.manifest.json" "$evidence/logs/second.manifest.json"
          cp -a dist "$evidence/dist"
          sha256sum "$evidence/logs/second.manifest.json" > "$evidence/logs/artifact-manifest.sha256"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > "suwon-$MANUAL_QA_PHASE-evidence/logs/font-match.txt"
      - name: Capture both viewports of every exact rendered route
        run: node .github/scripts/suwon-manual-preview.mjs
      - name: Enforce independently retrievable evidence chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path('suwon-'+os.environ['MANUAL_QA_PHASE']+'-evidence')
          for viewport in ['desktop','mobile']:
            files=sorted((root/'screenshots'/viewport).glob('*.jpg'))
            assert len(files)==55,viewport
            for i,f in enumerate(files):
              dest=root/'screenshots'/(viewport+'-'+str(i//16+1))
              dest.mkdir(parents=True,exist_ok=True)
              (dest/f.name).write_bytes(f.read_bytes())
          for part in [v+'-'+str(i) for v in ['desktop','mobile'] for i in range(1,5)]:
            assert sum(f.stat().st_size for f in (root/'screenshots'/part).glob('*.jpg'))<24*1024*1024,part
          for part in ['logs','dist']:
            files=[f for f in (root/part).rglob('*') if f.is_file()]
            assert files,part
            assert sum(f.stat().st_size for f in files)<24*1024*1024,part
          PY
      - name: Retain machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            suwon-${{ matrix.phase }}-evidence/*.json
            suwon-${{ matrix.phase }}-evidence/logs/
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact dist
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Retain ${{ matrix.phase }} desktop pixels 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-desktop-1-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/desktop-1/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} desktop pixels 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-desktop-2-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/desktop-2/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} desktop pixels 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-desktop-3-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/desktop-3/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} desktop pixels 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-desktop-4-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/desktop-4/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} mobile pixels 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-mobile-1-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/mobile-1/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} mobile pixels 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-mobile-2-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/mobile-2/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} mobile pixels 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-mobile-3-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/mobile-3/
          if-no-files-found: error
          retention-days: 7
      - name: Retain ${{ matrix.phase }} mobile pixels 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-${{ matrix.phase }}-mobile-4-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-${{ matrix.phase }}-evidence/screenshots/mobile-4/
          if-no-files-found: error
          retention-days: 7

