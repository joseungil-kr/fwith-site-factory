name: Hwaseong manual preview evidence

on:
  push:
    branches: [manual-hwaseong-qa-20261007]
    paths:
      - 'site-factory/hwaseong-flower/**'
      - '.github/workflows/hwaseong-manual-preview-qa.yml'
      - '.github/scripts/hwaseong-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-hwaseong-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_PREVIEW: 'true'
      SITE_URL: http://127.0.0.1:8935
      SITE_INDEXABLE: 'false'
      EXPECTED_QA_RELEASE_HASH: '2ae49be18b883569414f3d729542ba4a47f70e3e330a48c88fb7551d8739886c'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert fixed source and read-only preview boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/hwaseong-manual-playwright" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/hwaseong-qa-config" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-hwaseong-qa-20261007'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2aa6703b81e25dbc3ec1a7def16799a02e4b34be HEAD
          test "$SITE_URL" = 'http://127.0.0.1:8935'
          test "$SITE_INDEXABLE" = 'false'
          test "$MANUAL_PREVIEW" = 'true'
          mkdir -p hwaseong-preview-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const dir='site-factory/hwaseong-flower/';
          const p=JSON.parse(fs.readFileSync(dir+'src/data/manual-provenance.json'));
          assert.equal(p.releaseHash,process.env.EXPECTED_QA_RELEASE_HASH);
          assert.equal(p.independentReview.status,'pending');
          const file='public/images/hwaseong/hero-B-original.png';const b=fs.readFileSync(dir+file);
          const sha256=crypto.createHash('sha256').update(b).digest('hex');const gitBlob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');
          assert.equal(sha256,'3d0653ae4b8dd41864ccb88b08b8de12e606e97936d0f5768d1cc966b6fae09d');assert.equal(gitBlob,'a6183db9cfe59f6db028332c029e52f518cf2062');assert.equal(p.bindings[file],sha256);assert.equal(b.length,1939436);
          fs.writeFileSync('hwaseong-preview-evidence/revision.json',JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,releaseHash:p.releaseHash,provenance:p,asset:{file,sha256,gitBlob,bytes:b.length},productionApproval:'not-issued'},null,2)+'\n');
          JS
      - name: Install native site dependencies without changing source manifests
        working-directory: site-factory/hwaseong-flower
        run: npm install --no-package-lock
      - name: Native gated localhost noindex build and static QA
        shell: bash
        working-directory: site-factory/hwaseong-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/hwaseong-preview-evidence/native-build.log"
          python3 scripts/qa_static.py 2>&1 | tee "$GITHUB_WORKSPACE/hwaseong-preview-evidence/static-qa.log"
          npm list --json > "$GITHUB_WORKSPACE/hwaseong-preview-evidence/site-dependencies.json"
      - name: Native regression and approval-boundary tests
        shell: bash
        working-directory: site-factory/hwaseong-flower
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs tests/*.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/hwaseong-preview-evidence/native-tests.log"
          node scripts/validate_manual.mjs
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > hwaseong-preview-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > hwaseong-preview-evidence/playwright-dependencies.json
      - name: Capture all 58 articles and 7 hubs at desktop and mobile widths
        run: node .github/scripts/hwaseong-manual-preview.mjs
      - name: Partition unchanged screenshots into bounded artifact batches
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const root='hwaseong-preview-evidence';const source=path.join(root,'screenshots');const output='hwaseong-preview-batches';
          const maxFiles=20,maxBytes=24*1024*1024;const index={maxFilesPerArtifact:maxFiles,maxUncompressedBytesPerArtifact:maxBytes,downloadLimitBytes:32*1024*1024,imageBytesChanged:false,batches:[]};
          const capture=fs.existsSync(path.join(root,'capture-results.json'))?JSON.parse(fs.readFileSync(path.join(root,'capture-results.json'))):null;
          const expected=new Map((capture?.results||[]).filter(r=>r.screenshot&&r.screenshotSha256).map(r=>[path.basename(r.screenshot),r.screenshotSha256]));
          for(const viewport of ['desktop','mobile']){
            const names=fs.existsSync(source)?fs.readdirSync(source).filter(n=>n.endsWith('-'+viewport+'.jpg')).sort():[];
            assert(names.length<=65,'Unexpected screenshot scope');
            if(capture?.machineChecksPassed)assert.equal(names.length,65,'Complete capture must have65 images per viewport');
            for(let start=0;start<names.length;start+=maxFiles){
              const files=names.slice(start,start+maxFiles);const batch=String(Math.floor(start/maxFiles)+1).padStart(2,'0');const id=viewport+'-'+batch;
              const size=files.reduce((sum,n)=>sum+fs.statSync(path.join(source,n)).size,0);
              // A24MiB uncompressed cap leaves ample ZIP/container overhead below the32MiB download limit.
              assert(size<=maxBytes,'Screenshot artifact raw-byte budget exceeded: '+id+'; do not upload an oversized archive');
              const entries=[];fs.mkdirSync(path.join(output,id),{recursive:true});
              for(const name of files){const b=fs.readFileSync(path.join(source,name));const sha256=crypto.createHash('sha256').update(b).digest('hex');assert.equal(sha256,expected.get(name),'Capture receipt hash mismatch');fs.copyFileSync(path.join(source,name),path.join(output,id,name));entries.push({name,bytes:b.length,sha256});}
              index.batches.push({id,viewport,fileCount:files.length,uncompressedBytes:size,files:entries});
            }
          }
          fs.mkdirSync(root,{recursive:true});fs.writeFileSync(path.join(root,'screenshot-batch-index.json'),JSON.stringify(index,null,2)+'\n');const metadataBytes=fs.readdirSync(root).filter(n=>/\.(json|log|txt)$/.test(n)).reduce((sum,n)=>sum+fs.statSync(path.join(root,n)).size,0);assert(metadataBytes<=maxBytes,'Metadata artifact exceeds bounded raw-byte budget');console.log(JSON.stringify({batches:index.batches.map(({id,fileCount,uncompressedBytes})=>({id,fileCount,uncompressedBytes})),metadataBytes}));
          JS
      - name: Retain machine results and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            hwaseong-preview-evidence/*.json
            hwaseong-preview-evidence/*.log
            hwaseong-preview-evidence/font-match.txt
          if-no-files-found: error
          retention-days: 7
      - name: Retain desktop screenshot batch 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-desktop-01-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/desktop-01/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain desktop screenshot batch 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-desktop-02-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/desktop-02/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain desktop screenshot batch 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-desktop-03-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/desktop-03/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain desktop screenshot batch 04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-desktop-04-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/desktop-04/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain mobile screenshot batch 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-mobile-01-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/mobile-01/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain mobile screenshot batch 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-mobile-02-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/mobile-02/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain mobile screenshot batch 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-mobile-03-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/mobile-03/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Retain mobile screenshot batch 04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-preview-mobile-04-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-preview-batches/mobile-04/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
