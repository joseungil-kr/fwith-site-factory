name: Baekse order runtime integration tests
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['apps/baekse-order/**', '.github/workflows/baekse-order-integration.yml']
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/baekse-order-deploy-20261103}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Start local-only Worker with local-only test password
        working-directory: apps/baekse-order
        shell: bash
        run: |
          node --check src.js
          npm test
          npx --yes wrangler@4.156.2 dev --local --port 8787 --var ADMIN_PASSWORD:ci-only-strong-example-password-2026 >/tmp/baekse-order-wrangler.log 2>&1 &
          echo $! >/tmp/baekse-order-wrangler.pid
      - name: End to end API simulation, atomic stock and printed invoice source
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,time
          base='http://127.0.0.1:8787';last=None
          for _ in range(50):
            try:
              with urllib.request.urlopen(base,timeout=3) as r:
                h=r.read().decode();assert r.status==200 and '백세푸드' in h
              break
            except Exception as e:last=e;time.sleep(1)
          else:raise AssertionError('Worker local boot failed: '+str(last))
          jar=http.cookiejar.CookieJar(); session_cookie=''
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def api(path,data=None):
  global session_cookie
            b=json.dumps(data).encode() if data is not None else None
            headers={'Origin':base,'Content-Type':'application/json'} if data is not None else {}
  if session_cookie:headers['Cookie']=session_cookie
            req=urllib.request.Request(base+'/api/'+path,data=b,headers=headers)
            with opener.open(req,timeout=25) as r:
    if path=='login':session_cookie=r.headers.get('Set-Cookie','').split(';')[0]
    return r.status,json.load(r)
          try: api('state')
          except urllib.error.HTTPError as e:assert e.code==401
          else:raise AssertionError('No authentication bypass permitted')
          _,login=api('login',{'password':'ci-only-strong-example-password-2026'});assert login['ok']
          _,state=api('state');assert len(state['products'])==6
          p=state['products'][0]
          c=state['clients'][0]
          assert c['business']=='안산 중앙점'
          api('clients',{'id':c['id'],'business':'안산 중앙점','person':'테스트담당','phone':'010-1111-2222','business_no':'','address':''})
          api('stock',{'product_id':p['id'],'quantity':10,'type':'in','cost':6850,'note':'테스트입고'})
          _,s=api('state');assert s['products'][0]['stock']==10
          _,new=api('orders',{'client_id':c['id'],'order_date':'2026-11-03','vat':'tax','items':[{'product_id':p['id'],'qty':3},{'name':'기타배송','qty':2,'unit_price':1000}],'memo':'테스트'})
          assert new['supply']==35000 and new['tax']==3500 and new['total']==38500
          _,s=api('state');assert s['products'][0]['stock']==7
          _,detail=api('orders/detail?id='+str(new['id']))
          assert len(detail['items'])==2 and detail['items'][0]['unit_price']==11000
          api('orders/cancel',{'id':new['id']})
          _,s=api('state');assert s['products'][0]['stock']==10
          _,export=api('export');assert len(export['audit'])>0 and len(export['orders'])==1
          print('LOCAL_API_INTEGRATION_PASS: initial catalog, login, required client, stock in/out, VAT extra, other manual item, cancellation, snapshot, export')
          PY
      - name: Print local Worker startup log on failure
        if: failure()
        run: tail -120 /tmp/baekse-order-wrangler.log || true
