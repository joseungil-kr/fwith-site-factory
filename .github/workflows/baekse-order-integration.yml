name: Baekse order runtime integration tests
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['apps/baekse-order/**', '.github/workflows/baekse-order-integration.yml']
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/baekse-order-deploy-20261103}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Start local-only Worker with local-only test password
        working-directory: apps/baekse-order
        shell: bash
        run: |
          node --check src.js
          npm test
          npx --yes wrangler@4.156.2 dev --local --port 8787 --var ADMIN_PASSWORD:ci-only-strong-example-password-2026 >/tmp/baekse-order-wrangler.log 2>&1 &
          echo $! >/tmp/baekse-order-wrangler.pid
      - name: End to end API simulation, atomic stock and printed invoice source
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,time
          base='http://127.0.0.1:8787';last=None
          for _ in range(50):
            try:
              with urllib.request.urlopen(base,timeout=3) as r:
                h=r.read().decode();assert r.status==200 and '백세푸드' in h
              break
            except Exception as e:last=e;time.sleep(1)
          else:raise AssertionError('Worker local boot failed: '+str(last))
          jar=http.cookiejar.CookieJar(); session_cookie=''
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def api(path,data=None):
            global session_cookie
            b=json.dumps(data).encode() if data is not None else None
            headers={'Origin':base,'Content-Type':'application/json'} if data is not None else {}
            if session_cookie:headers['Cookie']=session_cookie
            req=urllib.request.Request(base+'/api/'+path,data=b,headers=headers)
            with opener.open(req,timeout=25) as r:
              if path=='login':session_cookie=r.headers.get('Set-Cookie','').split(';')[0]
              return r.status,json.load(r)
          try: api('state')
          except urllib.error.HTTPError as e:assert e.code==401
          else:raise AssertionError('No authentication bypass permitted')
          _,login=api('login',{'password':'ci-only-strong-example-password-2026'});assert login['ok']
          _,state=api('state');assert len(state['products'])==6
          assert all(state['receipt_settings'][k]=='' for k in ('bank_name','account_number','account_holder')) and state['receipt_settings']['company_name']=='백세푸드','Bank details must not be hardcoded; company has safe default'
          p=state['products'][0]
          c=state['clients'][0]
          assert c['business']=='안산 중앙점'
          api('clients',{'id':c['id'],'business':'안산 중앙점','person':'테스트담당','phone':'010-1111-2222','business_no':'','address':''})
          api('stock',{'product_id':p['id'],'quantity':10,'type':'in','cost':6850,'note':'테스트입고'})
          _,s=api('state');assert s['products'][0]['stock']==10
          _,new=api('orders',{'client_id':c['id'],'order_date':'2026-11-03','vat':'tax','items':[{'product_id':p['id'],'qty':3},{'name':'기타배송','qty':2,'unit_price':1000}],'memo':'테스트'})
          assert new['supply']==35000 and new['tax']==3500 and new['total']==38500
          _,s=api('state');assert s['products'][0]['stock']==7
          _,detail=api('orders/detail?id='+str(new['id']))
          assert len(detail['items'])==2 and detail['items'][0]['unit_price']==11000
          api('orders/cancel',{'id':new['id']})
          _,s=api('state');assert s['products'][0]['stock']==10
          _,new_settings=api('receipt-settings',{'bank_name':'검증은행','account_number':'987-654-321','account_holder':'검증예금주'})
          assert new_settings['ok']
          _,s=api('state')
          assert all(s['receipt_settings'][k]==v for k,v in {'bank_name':'검증은행','account_number':'987-654-321','account_holder':'검증예금주'}.items())
          _,bill=api('orders',{'client_id':c['id'],'order_date':'2026-11-03','vat':'none',
            'previous_balance':100000,'items':[{'name':'직접입력 상품','qty':1,'unit_price':93000}],'memo':'입금처 QA'})
          assert bill['supply']==93000 and bill['tax']==0 and bill['total']==93000
          assert bill['previous_balance']==100000 and bill['amount_due']==193000
          _,s=api('state')
          record=next(x for x in s['orders'] if x['id']==bill['id'])
          assert record['total']==93000 and record['amount_due']==193000 and record['previous_balance']==100000
          _,saved=api('orders/detail?id='+str(bill['id']))
          assert all(saved['order']['bank'][k]==v for k,v in {'bank_name':'검증은행','account_number':'987-654-321','account_holder':'검증예금주'}.items())
          api('receipt-settings',{'bank_name':'변경은행','account_number':'123-111','account_holder':'변경예금주'})
          _,saved_again=api('orders/detail?id='+str(bill['id']))
          assert saved_again['order']['bank']==saved['order']['bank'],'Historical invoice account must be snapshotted'
          _,s=api('state')
          assert s['receipt_settings']['account_number']=='123-111','New global settings should be editable'
          _,export=api('export')
          assert len(export['audit'])>0 and len(export['orders'])==2
          assert any(x['id']==bill['id'] and x['previous_balance']==100000 for x in export['orders'])

          # Product up/down elevators, and invoice ordering independent of products.
          _,s=api('state')
          assert [x['id'] for x in s['products']][:2]==[1,2]
          api('products/move',{'id':2,'direction':'up'})
          _,s=api('state')
          assert [x['id'] for x in s['products']][:2]==[2,1]
          api('products/move',{'id':2,'direction':'down'})
          _,s=api('state')
          assert [x['id'] for x in s['products']][:2]==[1,2]
          # Editable company information and bank trio.
          _,updated=api('receipt-settings',{
            'company_name':'QA 주문회사','company_business_no':'123-45-67890',
            'company_address':'경기도 QA 주소','company_phone':'010-3333-4444',
            'company_email':'order@example.org',
            'bank_name':'변경은행','account_number':'123-111','account_holder':'변경예금주'})
          assert updated['ok']
          _,s=api('state')
          assert s['receipt_settings']['company_name']=='QA 주문회사'
          assert s['receipt_settings']['company_email']=='order@example.org'
          assert set(('today_count','today_amount','month_count','month_amount','cumulative_amount')).issubset(s['metrics'])
          assert s['metrics']['cumulative_amount']==93000, 'Cancelled orders and prior balance must not inflate revenue'
          assert s['metrics']['cumulative_count']==1
          # Historical invoice supplier and bank are snapshots, not overwritten by editing settings.
          _,unchanged=api('orders/detail?id='+str(bill['id']))
          assert unchanged['order']['bank']['bank_name']=='검증은행'
          assert unchanged['order']['bank']['company_name']=='백세푸드'
          # Reissue cancelled invoice; original products and prices retained and stock deducted again.
          api('orders/reissue',{'id':new['id']})
          _,s=api('state')
          assert next(o for o in s['orders'] if o['id']==new['id'])['status']=='issued'
          assert s['products'][0]['stock']==7
          assert s['metrics']['cumulative_amount']==131500
          api('orders/cancel',{'id':new['id']})
          _,s=api('state')
          assert s['products'][0]['stock']==10
          # Reissue blocked on insufficient stock: no partial order status changes.
          api('stock',{'product_id':p['id'],'quantity':0,'adjustment':1,'type':'adjust','note':'test low stock'})
          try: api('orders/reissue',{'id':new['id']})
          except urllib.error.HTTPError as e:assert e.code==400
          else:raise AssertionError('Reissue incorrectly allowed insufficient stock')
          _,s=api('state')
          assert next(o for o in s['orders'] if o['id']==new['id'])['status']=='cancelled'
          api('stock',{'product_id':p['id'],'quantity':0,'adjustment':10,'type':'adjust','note':'restore for delete tests'})
          # Permanent deletion of cancelled record must not alter inventory.
          api('orders/delete',{'id':new['id'],'confirm':'DELETE'})
          _,s=api('state')
          assert s['products'][0]['stock']==10
          assert not any(o['id']==new['id'] for o in s['orders'])
          try: api('orders/detail?id='+str(new['id']))
          except urllib.error.HTTPError as e:assert e.code==404
          else:raise AssertionError('Deleted invoice is still accessible')
          # Permanent deletion of issued record restores its stock.
          _,other=api('orders',{'client_id':c['id'],'order_date':'2026-11-03','vat':'none','items':[{'product_id':p['id'],'qty':2}]})
          _,detail=api('orders/detail?id='+str(other['id']))
          assert detail['order']['bank']['company_name']=='QA 주문회사'
          _,s=api('state');assert s['products'][0]['stock']==8
          api('orders/delete',{'id':other['id'],'confirm':'DELETE'})
          _,s=api('state')
          assert s['products'][0]['stock']==10
          assert s['metrics']['cumulative_amount']==93000
          _,backup=api('export')
          assert len(backup['orders'])==1
          assert any(a['action']=='order_delete' for a in backup['audit'])
          # Public buyer screen is a static noindex page; API cannot expose admin state.
          for asset,markers in [
            ('/request/',['id="buyer-form"','id="buyer-products"','noindex','/buyer.js']),
            ('/buyer.js',['request_key','api/buyer/','overview','submit']),
            ('/buyer.css',['buyer-product','buyer-submit'])
          ]:
            with urllib.request.urlopen(base+asset,timeout=20) as r:
              body=r.read().decode('utf-8')
              assert r.status==200 and all(mark in body for mark in markers),('Missing buyer asset',asset)
          try: urllib.request.urlopen(base+'/api/requests/list',timeout=15)
          except urllib.error.HTTPError as e:assert e.code==401
          else:raise AssertionError('Admin buyer list was anonymously accessible')
          # Trade-client link is scoped to the client and does not require administrator login.
          _,initial=api('state')
          assert initial['buyer_dashboard']['pending_count']==0
          assert initial['buyer_links']==[]
          _,link=api('requests/link/issue',{'client_id':c['id']})
          assert link['url'].startswith(base+'/request/#')
          token=link['url'].split('#',1)[1]
          assert len(token)==64 and all(ch in '0123456789abcdef' for ch in token)
          def public(path,payload):
            req=urllib.request.Request(base+'/api/buyer/'+path,data=json.dumps(payload).encode(),
              headers={'Content-Type':'application/json','Origin':base},method='POST')
            with urllib.request.urlopen(req,timeout=25) as response:return json.load(response)
          def public_fails(path,payload,code):
            try: public(path,payload)
            except urllib.error.HTTPError as e:assert e.code==code,(e.code,code)
            else:raise AssertionError('Expected forbidden buyer endpoint: '+path)
          public_fails('overview',{'token':'bad'},403)
          overview=public('overview',{'token':token})
          assert overview['client']['business']=='안산 중앙점'
          assert len(overview['products'])==6 and not any('stock' in p for p in overview['products'])
          assert overview['history']==[]
          assert not any('clients' in k for k in overview)
          request_key='37960518-397c-4ace-80f6-61e498600421'
          local_today=time.strftime('%Y-%m-%d',time.gmtime(time.time()+9*3600))
          orderData={'token':token,'request_key':request_key,'requested_delivery':local_today,
            'note':'테스트 입고 요청','items':[{'product_id':p['id'],'qty':15},
              {'product_id':s['products'][1]['id'],'qty':1}]}
          placed=public('submit',orderData)
          assert placed['status']=='pending'
          repeated=public('submit',orderData)
          assert repeated['id']==placed['id'] and repeated['duplicate']
          _,state=api('state')
          assert state['products'][0]['stock']==10 and state['products'][1]['stock']==0
          assert state['metrics']['cumulative_amount']==93000,'Request may not increase sales'
          assert state['buyer_dashboard']['pending_count']==1
          assert state['buyer_dashboard']['shortage_count']==2
          by_id={z['product_id']:z for z in state['buyer_dashboard']['shortages']}
          assert by_id[p['id']]['shortage']==5
          assert by_id[state['products'][1]['id']]['shortage']==1
          _,queue=api('requests/list')
          assert queue['requests'][0]['id']==placed['id'] and len(queue['requests'][0]['items'])==2
          try: api('requests/fulfill',{'id':placed['id'],'vat':'none'})
          except urllib.error.HTTPError as e:assert e.code==400
          else:raise AssertionError('Fulfillment should fail closed on insufficient inventory')
          _,state=api('state')
          assert state['buyer_dashboard']['pending_count']==1 and state['products'][0]['stock']==10
          # Rotate token; the original capability is invalidated without losing pending orders.
          _,newLink=api('requests/link/issue',{'client_id':c['id']})
          newToken=newLink['url'].split('#')[1]
          assert newToken!=token
          public_fails('overview',{'token':token},403)
          newOverview=public('overview',{'token':newToken})
          assert newOverview['history'][0]['id']==placed['id']
          # Add enough stock then issue using the existing invoice and movement tables.
          api('stock',{'product_id':p['id'],'quantity':5,'type':'in','cost':6850,'note':'발주부족 입고'})
          p2=state['products'][1]
          api('stock',{'product_id':p2['id'],'quantity':1,'type':'in','cost':p2['cost'],'note':'발주부족 입고'})
          _,state=api('state')
          assert state['buyer_dashboard']['shortage_count']==0
          _,confirmed=api('requests/fulfill',{'id':placed['id'],'vat':'none','previous_balance':0})
          assert confirmed['status']=='fulfilled' and confirmed['supply']==174000 and confirmed['total']==174000
          _,state=api('state')
          assert state['buyer_dashboard']['pending_count']==0
          assert state['metrics']['cumulative_amount']==267000
          assert state['products'][0]['stock']==0 and state['products'][1]['stock']==0
          _,issued=api('orders/detail?id='+str(confirmed['issued_order_id']))
          assert issued['order']['memo'].startswith('발주요청 #')
          assert len(issued['items'])==2
          try: api('requests/fulfill',{'id':placed['id'],'vat':'none'})
          except urllib.error.HTTPError as e:assert e.code==400
          else:raise AssertionError('Repeated approval duplicated invoice')
          # Different clients cannot see each other's orders; per-client link can be revoked.
          _,secondClient=api('clients',{'business':'QA 외부지점','person':'담당','phone':'010-9999-4444','business_no':'','address':''})
          _,state=api('state')
          another=next(z for z in state['clients'] if z['business']=='QA 외부지점')
          _,otherLink=api('requests/link/issue',{'client_id':another['id']})
          otherToken=otherLink['url'].split('#')[1]
          assert public('overview',{'token':otherToken})['history']==[]
          otherData={'token':otherToken,'request_key':'8d363496-66e5-4e2c-9131-1da202400340',
            'requested_delivery':local_today,'items':[{'product_id':p['id'],'qty':1}]}
          secondRequest=public('submit',otherData)
          _,state=api('state')
          assert state['buyer_dashboard']['pending_count']==1
          assert state['buyer_dashboard']['shortage_count']==1
          # Two different clients request the same stockless item: aggregate outstanding demand.
          firstAgain=public('submit',{'token':newToken,
            'request_key':'7c39bc37-52ca-4dbd-9186-41987308a10c',
            'requested_delivery':local_today,
            'items':[{'product_id':p['id'],'qty':2}]})
          _,state=api('state')
          assert state['buyer_dashboard']['pending_count']==2
          aggregate=next(z for z in state['buyer_dashboard']['shortages'] if z['product_id']==p['id'])
          assert aggregate['requested']==3 and aggregate['stock']==0 and aggregate['shortage']==3
          assert public('overview',{'token':newToken})['history'][0]['id']==firstAgain['id']
          assert public('overview',{'token':newToken})['history'][1]['id']==placed['id']
          assert not any(z['id']==secondRequest['id'] for z in public('overview',{'token':newToken})['history'])
          api('requests/cancel',{'id':secondRequest['id']})
          _,state=api('state')
          assert state['buyer_dashboard']['shortage_count']==1
          api('requests/cancel',{'id':firstAgain['id']})
          _,state=api('state')
          assert state['buyer_dashboard']['shortage_count']==0
          api('requests/link/revoke',{'client_id':another['id']})
          public_fails('overview',{'token':otherToken},403)
          _,export=api('export')
          assert len(export['buyer_requests'])==3 and len(export['buyer_lines'])==4
          assert not any('token_hash' in x for x in export['buyer_links'])
          print('BUYER_PORTAL_PASS: anonymous scoped links, rotation/revocation, oversized requests, consolidated shortage, stock-independent queue, atomic approval, unique issue, existing invoice and sales')
          print('NEW_FEATURES_API_PASS: monthly/all-time full DB KPI, editable company, product sort, reissue, stock guard, invoice deletion')
          print('BILLING_QA_PASS: editable bank, historical snapshot, previous balance 100000, due 193000, actual sale remains 93000')
          print('LOCAL_API_INTEGRATION_PASS: initial catalog, login, required client, stock in/out, VAT extra, other manual item, cancellation, snapshot, export')
          PY
      - name: Print local Worker startup log on failure
        if: failure()
        run: tail -120 /tmp/baekse-order-wrangler.log || true
