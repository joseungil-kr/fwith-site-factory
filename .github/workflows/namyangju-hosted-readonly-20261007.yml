name: Namyangju C2 deployed source read-only verification
on:
  push:
    branches: [manual-namyangju-hosted-check-20261007]
    paths:
      - '.github/workflows/namyangju-hosted-readonly-20261007.yml'
      - '.github/scripts/namyangju-hosted-readonly-20261007.mjs'
      - '.github/scripts/namyangju-hosted-receipts-20261007.py'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/manual-namyangju-hosted-check-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_FACTORY_REVISION: d02e86ed7fc39131431a0332a84002906be2f88b
      SITE_URL: https://namyangju-flower-guide-qa.joseungil.workers.dev
      SITE_ORIGIN: https://namyangju-flower-guide-qa.joseungil.workers.dev
      SITE_INDEXABLE: 'false'
      MANUAL_QA_PHASE: preview
      MANUAL_HOSTED_PREVIEW: 'true'
    steps:
      - name: Check out actual read-only execution revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable deployed source
        uses: actions/checkout@v4
        with:
          ref: d02e86ed7fc39131431a0332a84002906be2f88b
          path: target
          persist-credentials: false
      - name: Check out immutable read-only M2 verifier
        uses: actions/checkout@v4
        with:
          ref: 657b9ce62b1a519ba606f9fb0110aa3679d0931c
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact expected deployed artifact
        shell: bash
        working-directory: target/site-factory/namyangju-flower
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd02e86ed7fc39131431a0332a84002906be2f88b'
          npm ci --no-audit --no-fund
          npm test
          npm run build
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('dist');m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob('*')) if f.is_file()}
          assert len(m)==58
          assert hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest()=='a90ee0776719d41839dff9abb0a05777f9ae9bcea25bae0bf7c4dbb5109d4a90'
          PY
      - name: Verify every live byte with unchanged M2 application client
        run: python3 control/scripts/manual-release-20261007/verify_http.py control/.github/manual-release-20261007/namyangju.policy.json preview target/site-factory/namyangju-flower/dist d02e86ed7fc39131431a0332a84002906be2f88b
      - name: Retain every verified live response without identity fallback
        run: python3 .github/scripts/namyangju-hosted-receipts-20261007.py
      - name: Install pinned capture client and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/namyangju-readonly-playwright" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/namyangju-readonly-playwright" --no-save --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/namyangju-readonly-playwright/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual hosted pixels with separate execution and deployed revisions
        run: node .github/scripts/namyangju-hosted-readonly-20261007.mjs
      - name: Enforce retrievable evidence chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('target/namyangju-preview-evidence')
          for part in ['desktop','mobile']:
            files=list((root/'screenshots'/part).glob('*.jpg'));assert len(files)==37
            assert sum(f.stat().st_size for f in files)<24*1024*1024
          assert sum(f.stat().st_size for f in root.glob('*.json'))<24*1024*1024
          assert sum(f.stat().st_size for f in pathlib.Path('namyangju-hosted-http').rglob('*') if f.is_file())<24*1024*1024
          PY
      - name: Retain live HTTP response bodies and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-c2-hosted-http-${{ github.sha }}-${{ github.run_attempt }}
          path: namyangju-hosted-http/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted capture facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-c2-hosted-facts-${{ github.sha }}-${{ github.run_attempt }}
          path: target/namyangju-preview-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-c2-hosted-desktop-${{ github.sha }}-${{ github.run_attempt }}
          path: target/namyangju-preview-evidence/screenshots/desktop/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namyangju-c2-hosted-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: target/namyangju-preview-evidence/screenshots/mobile/
          if-no-files-found: error
          retention-days: 7
