# Read-only actual public verification; no deploy, POST, secrets or permissions mutation.
name: Hwaseong supplemental actual public read-only verification
on:
  push:
    branches: [manual-hwaseong-supplemental-public-check-20261008]
    paths:
      - '.github/workflows/hwaseong-hosted-readonly-20261007.yml'
      - '.github/scripts/hwaseong-hosted-readonly-20261007.mjs'
      - '.github/scripts/hwaseong-hosted-receipts-20261007.py'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/manual-hwaseong-supplemental-public-check-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_FACTORY_REVISION: 4cd31bb5a55574ab6419c0291bb8a70d70ab9d0a
      SITE_URL: https://hwaseong.fwith.kr
      SITE_ORIGIN: https://hwaseong.fwith.kr
      SITE_INDEXABLE: 'true'
      MANUAL_PREVIEW: 'false'
      MANUAL_QA_PHASE: production
      MANUAL_HOSTED_PREVIEW: 'true'
    steps:
      - name: Check out actual read-only execution revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable deployed source
        uses: actions/checkout@v4
        with:
          ref: 4cd31bb5a55574ab6419c0291bb8a70d70ab9d0a
          path: target
          persist-credentials: false
      - name: Check out immutable reviewed read-only M4 verifier
        uses: actions/checkout@v4
        with:
          ref: 69a7fee6a64a21443be19eca50d734d9652a968c
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact expected deployed artifact
        shell: bash
        working-directory: target/site-factory/hwaseong-flower
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4cd31bb5a55574ab6419c0291bb8a70d70ab9d0a'
          python3 - <<'PYSOURCE'
          import hashlib,json,pathlib,subprocess
          prefix='site-factory/hwaseong-flower/';manifest={}
          for entry in subprocess.check_output(['git','ls-tree','-rz','HEAD','--', '.']).split(b'\0'):
            if not entry:continue
            meta,name=entry.split(b'\t');mode,kind,blob=meta.split();assert kind==b'blob' and mode in (b'100644',b'100755')
            relative=name.decode();file=pathlib.Path(relative);assert file.is_file() and not file.is_symlink()
            blob_bytes=subprocess.check_output(['git','cat-file','blob',blob.decode()]);assert file.read_bytes()==blob_bytes
            manifest[prefix+relative]=hashlib.sha256(blob_bytes).hexdigest()
          assert len(manifest)==148
          assert hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()=='be8d123d92a1f22ff52fe5aad9949fd3882041d23600bf7a891ed5b2fe59ee44'
          destination=pathlib.Path('../../../hwaseong-hosted-http');destination.mkdir(exist_ok=True)
          (destination/'exact-source-manifest.json').write_text(json.dumps(manifest,sort_keys=True,separators=(',',':')))
          PYSOURCE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test scripts/*.test.mjs tests/*.test.mjs
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('dist');m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob('*')) if f.is_file()}
          assert len(m)==87
          assert hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest()=='f51af8135ee0440f3ee50ef285edb5c23cfdf161e4cf54dd47ba38e5218a6c95'
          PY
      - name: Verify every live byte with reviewed M4 verifier and fixed application client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,json,pathlib,subprocess
          out=pathlib.Path('hwaseong-hosted-http');out.mkdir(exist_ok=True)
          result=subprocess.run(['python3','control/scripts/manual-release-20261007/verify_http.py','control/.github/manual-release-20261007/hwaseong.policy.json','production','target/site-factory/hwaseong-flower/dist','4cd31bb5a55574ab6419c0291bb8a70d70ab9d0a'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          private=result.stdout+result.stderr;(out/'m4-private-output.txt').write_bytes(private)
          report={'passed':result.returncode==0,'exitCode':result.returncode,'privateDiagnosticSha256':hashlib.sha256(private).hexdigest(),'exceptionClass':None,'routeSha256':None}
          if result.returncode:
            last=result.stderr.decode(errors='replace').splitlines()[-1] if result.stderr else ''
            kind,_,value=last.partition(':')
            if kind.isidentifier():report['exceptionClass']=kind
            try:
              values=ast.literal_eval(value.strip())
              route=next((v for v in values if isinstance(v,str) and v.startswith('/')),None) if isinstance(values,tuple) else None
              if route is not None:report['routeSha256']=hashlib.sha256(route.encode()).hexdigest()
            except (ValueError,SyntaxError):pass
          (out/'m4-cli-status.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report));raise SystemExit(result.returncode)
          PY
      - name: Retain every verified live response without identity fallback
        run: python3 .github/scripts/hwaseong-hosted-receipts-20261007.py
      - name: Install pinned capture client and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/hwaseong-readonly-playwright" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hwaseong-readonly-playwright" --no-save --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/hwaseong-readonly-playwright/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual hosted pixels with separate execution and deployed revisions
        run: node .github/scripts/hwaseong-hosted-readonly-20261007.mjs
      - name: Enforce retrievable evidence chunks
        if: always() && hashFiles('target/hwaseong-production-evidence/screenshots/**/*.jpg') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNKS'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('target/hwaseong-production-evidence');chunks=pathlib.Path('hwaseong-hosted-pixels');parts=[]
          for viewport in ['desktop','mobile']:
            files=sorted((root/'screenshots'/viewport).glob('*.jpg'));assert len(files)<=65
            for start in range(0,len(files),16):
              selected=files[start:start+16];name=f'{viewport}-part-{start//16+1:02d}';dest=chunks/name;dest.mkdir(parents=True,exist_ok=True)
              assert sum(f.stat().st_size for f in selected)<24*1024*1024
              rows=[]
              for f in selected:
                shutil.copy2(f,dest/f.name);assert (dest/f.name).read_bytes()==f.read_bytes();rows.append({'file':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
              parts.append({'part':name,'count':len(rows),'files':rows})
          (root/'screenshot-chunks.json').write_text(json.dumps(parts,indent=2)+'\n')
          PYCHUNKS
      - name: Bound retained diagnostics even when HTTP or capture fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOUNDS'
          import pathlib
          root=pathlib.Path('target/hwaseong-production-evidence')
          assert sum(f.stat().st_size for f in root.glob('*.json'))<24*1024*1024
          assert sum(f.stat().st_size for part in ['browser-html','browser-input','browser-receipts','browser-private-failures'] for f in (root/part).rglob('*') if f.is_file())<24*1024*1024
          assert sum(f.stat().st_size for f in pathlib.Path('hwaseong-hosted-http').rglob('*') if f.is_file())<24*1024*1024
          PYBOUNDS
      - name: Retain live HTTP response bodies and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-http-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-http/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted capture facts
        if: always() && hashFiles('target/hwaseong-production-evidence/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-facts-${{ github.sha }}-${{ github.run_attempt }}
          path: target/hwaseong-production-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-01 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/desktop-part-01/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-desktop-part-01-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/desktop-part-01/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-02 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/desktop-part-02/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-desktop-part-02-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/desktop-part-02/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-03 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/desktop-part-03/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-desktop-part-03-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/desktop-part-03/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-04 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/desktop-part-04/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-desktop-part-04-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/desktop-part-04/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-01 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/mobile-part-01/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-mobile-part-01-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/mobile-part-01/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-02 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/mobile-part-02/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-mobile-part-02-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/mobile-part-02/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-03 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/mobile-part-03/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-mobile-part-03-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/mobile-part-03/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-04 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/mobile-part-04/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-mobile-part-04-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/mobile-part-04/
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual browser HTML and immutable comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-browser-bodies-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/hwaseong-production-evidence/browser-html/
            target/hwaseong-production-evidence/browser-input/
            target/hwaseong-production-evidence/browser-receipts/
            target/hwaseong-production-evidence/browser-private-failures/
          if-no-files-found: error
          retention-days: 7

      - name: Retain public desktop-part-05 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/desktop-part-05/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-desktop-part-05-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/desktop-part-05/
          if-no-files-found: error
          retention-days: 7

      - name: Retain public mobile-part-05 pixels
        if: always() && hashFiles('hwaseong-hosted-pixels/mobile-part-05/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hwaseong-supplemental-public-mobile-part-05-${{ github.sha }}-${{ github.run_attempt }}
          path: hwaseong-hosted-pixels/mobile-part-05/
          if-no-files-found: error
          retention-days: 7
