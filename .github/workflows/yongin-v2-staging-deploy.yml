name: Yongin Flower v2 Staging Deploy

on:
  push:
    branches:
      - site-factory-yongin-v2
    paths:
      - 'site-factory/yongin-flower/**'
      - '.github/workflows/yongin-v2-staging-deploy.yml'
      - '.github/scripts/yongin-release-qa.py'
      - '.github/scripts/test-yongin-release-qa.py'
      - '.github/scripts/yongin-indexnow-once.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yongin-flower-v2-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-factory/yongin-flower
    env:
      SITE_URL: https://yongin.fwith.kr
      SITE_INDEXABLE: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9A-Fa-f]{32}$'
      - name: Install dependencies
        run: npm install
      - name: Release verification regression tests
        run: python3 ../../.github/scripts/test-yongin-release-qa.py
      - name: Build noindex staging
        run: npm run build
      - name: Deploy preview worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy 2>&1 | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
      - name: Verify preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 ../../.github/scripts/yongin-release-qa.py staging

      - name: Preserve staging live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yongin-staging-proof-${{ github.sha }}
          path: site-factory/yongin-flower/staging-live-qa.json
          if-no-files-found: warn
          retention-days: 14
