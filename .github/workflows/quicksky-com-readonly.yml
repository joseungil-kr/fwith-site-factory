name: Quicksky exact com zone credential alternate read only
on:
  push:
    branches: [ops/quicksky-com-zone-lookup-20261027]
    paths: ['.github/workflows/quicksky-com-readonly.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List exact nalmada.com zone without printing private IDs
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token:raise RuntimeError('This existing repository has no CF token')
          def get(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:d=json.load(res)
              except urllib.error.HTTPError as e:
                  raise RuntimeError('GET '+path.split('?')[0]+' returned HTTP '+str(e.code)) from None
              if not d.get('success'):raise RuntimeError('Cloudflare API read failed '+path.split('?')[0])
              if (d.get('result_info') or {}).get('total_pages',1)>1:raise RuntimeError('Unexpected pagination')
              return d['result']
          zones=get('/zones?name=nalmada.com&per_page=50')
          matching=[x for x in zones if x.get('name')=='nalmada.com']
          configured=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          possible=[z for z in matching if not configured or z.get('account',{}).get('id')==configured]
          result={'host':'quicksky.nalmada.com','visibleExactComZones':len(matching),
                  'zoneInConfiguredAccount':len(possible),'statuses':[z.get('status') for z in matching]}
          if len(possible)==1:
              zone=possible[0]
              aid=zone['account']['id'];zid=zone['id']
              try:
                  domains=get('/accounts/'+aid+'/workers/domains')
                  result['existingBindingServiceNames']=[x.get('service') for x in domains if x.get('hostname')=='quicksky.nalmada.com']
              except RuntimeError as e:result['bindingReadError']=str(e)
              try:
                  dns=get('/zones/'+zid+'/dns_records?name=quicksky.nalmada.com&per_page=100')
                  result['exactHostDnsRecordTypes']=[x.get('type') for x in dns]
              except RuntimeError as e:result['dnsReadError']=str(e)
          print('QUICKSKY_FWITH_ALTERNATE_CF_READ='+json.dumps(result))
          if len(possible)!=1:raise SystemExit('Exact com zone not available from existing fwith credentials')
          PY
