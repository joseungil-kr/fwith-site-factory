name: Site Factory Production Deploy
on:
  workflow_call:
    inputs:
      site_key: {required: true, type: string}
      launch_key: {required: false, type: string, default: ''}
      scope_key: {required: false, type: string, default: ''}
      expected_revision: {required: true, type: string}
      source_snapshot_issue: {required: false, type: string, default: ''}
    secrets:
      CLOUDFLARE_API_TOKEN: {required: true}
      CLOUDFLARE_ACCOUNT_ID: {required: true}
  workflow_dispatch:
    inputs:
      site_key: {description: Registered site key, required: true, type: string}
      launch_key: {description: Exact registered launch for scoped coverage, required: false, type: string}
      scope_key: {description: Exact registered scope for scoped coverage, required: false, type: string}
      expected_revision: {description: Full independently approved target commit SHA, required: true, type: string}
      source_snapshot_issue: {description: Existing request issue for durable production receipts, required: true, type: string}
      indexnow_only: {description: Verify and submit the already public revision without deploying, required: false, type: boolean, default: false}
  issues:
    types: [opened, reopened]
permissions: {}
concurrency:
  group: "${{ (inputs.site_key == 'goyang-flower-v2' || contains(github.event.issue.body, 'SITE_KEY: goyang-flower-v2')) && format('site-staging-{0}', github.repository) || format('site-production-{0}', github.repository) }}"
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    permissions: {contents: read, issues: write}
    if: ${{ inputs.indexnow_only != true && (inputs.site_key != '' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[SITE-PRODUCTION-DEPLOY]')) }}
    runs-on: ubuntu-latest
    env: {ASTRO_TELEMETRY_DISABLED: '1'}
    steps:
      - name: Authorize repository writer
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              let permission;
              try {
                const r = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username
                });
                permission = r.data.permission;
              } catch (error) {
                throw new Error(`Cannot authorize ${username}; no privileged processing allowed`);
              }
              if (!['admin', 'maintain', 'write'].includes(permission)) {
                throw new Error(`Untrusted actor/author: ${username}`);
              }
            }
      - name: Validate existing receipt destination before work
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          printf '%s' "$RECEIPT_ISSUE" | grep -Eq '^[1-9][0-9]*$'
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/$RECEIPT_ISSUE" --jq .number)" = "$RECEIPT_ISSUE"
      - uses: actions/checkout@v4
        with: {ref: main, path: control}
      - name: Resolve approved production target
        id: target
        env:
          SITE_KEY: ${{ inputs.site_key }}
          REVISION: ${{ inputs.expected_revision }}
          LAUNCH_KEY: ${{ inputs.launch_key }}
          SCOPE_KEY: ${{ inputs.scope_key }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          values = {}
          for line in os.environ.get('ISSUE_BODY','').split('---BEGIN-',1)[0].splitlines():
              if ': ' in line:
                  k,v=line.split(': ',1)
                  if k in values: raise SystemExit('Duplicate issue header')
                  values[k]=v.strip()
          key=os.environ.get('SITE_KEY') or values.get('SITE_KEY','')
          site=json.load(open('control/.github/site-factory-sites.json'))['sites'].get(key)
          if not site or site['repo']!=os.environ['GITHUB_REPOSITORY']: raise SystemExit('Unregistered target')
          import sys
          sys.path.insert(0, 'control/site-factory/engine')
          if key == 'namyangju-flower-v2':
              if 'SITE_KEY: goyang-flower-v2' in os.environ.get('ISSUE_BODY', ''):
                  raise SystemExit('Initial issue body must not select another site deployment lock')
              from whole_initial import resolve
              resolved=resolve(site,os.environ['GITHUB_REPOSITORY'],
                  os.environ.get('REVISION') or values.get('EXPECTED_REVISION',''),
                  os.environ.get('LAUNCH_KEY') or values.get('LAUNCH_KEY',''),
                  os.environ.get('SCOPE_KEY') or values.get('SCOPE_KEY',''))
              if resolved['site_key'] != key: raise SystemExit('Initial request identity mismatch')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for k,v in resolved.items():out.write(f'{k}={v}\n')
              raise SystemExit(0)
          requested_revision = os.environ.get('REVISION') or values.get('EXPECTED_REVISION', '')
          ownership_only = site.get('indexnowOwnership', {}).get('revision') == requested_revision
          if ownership_only:
              import sys
              sys.path.insert(0, 'control/site-factory/engine')
              from indexnow_ownership import amendment
              ownership = amendment(site, requested_revision)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('ownership_only=true\nprevious_revision=' + ownership['previousRevision'] + '\n')
          if key == 'goyang-flower-v2':
              if not os.environ.get('SITE_KEY') and 'SITE_KEY: goyang-flower-v2' not in os.environ.get('ISSUE_BODY','').split('---BEGIN-',1)[0].splitlines():
                  raise SystemExit('Goyang issue SITE_KEY must use its exact canonical header for the shared deployment lock')
              import sys
              sys.path.insert(0,'control/site-factory/engine')
              from verify_live import resolve_goyang_coverage_target
              resolved=resolve_goyang_coverage_target(site,os.environ['GITHUB_REPOSITORY'],
                  os.environ.get('REVISION') or values.get('EXPECTED_REVISION',''),
                  os.environ.get('LAUNCH_KEY') or values.get('LAUNCH_KEY',''),
                  os.environ.get('SCOPE_KEY') or values.get('SCOPE_KEY',''),'production')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for k,v in resolved.items():out.write(f'{k}={v}\n')
              raise SystemExit(0)
          if key == 'bucheon-flower-v2':
              import sys
              sys.path.insert(0,'control/site-factory/engine')
              from bucheon_production import resolve
              resolved=resolve(site,os.environ['GITHUB_REPOSITORY'],
                  os.environ.get('REVISION') or values.get('EXPECTED_REVISION',''),
                  os.environ.get('LAUNCH_KEY') or values.get('LAUNCH_KEY',''),
                  os.environ.get('SCOPE_KEY') or values.get('SCOPE_KEY',''))
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for k,v in resolved.items():out.write(f'{k}={v}\n')
              raise SystemExit(0)
          if key == 'seongnam-flower-v2':
              expected = {'siteUrl':'https://seongnam.fwith.kr','worker':'seongnam-flower-prod-disabled',
                          'root':'site-factory/seongnam-flower','branch':'site-factory-seongnam-v2'}
              if (any(site.get(k)!=v for k,v in expected.items()) or site.get('wranglerConfig','wrangler.jsonc')!='wrangler.jsonc'
                  or site.get('requireRevisionApproval') is not True):
                  raise SystemExit('Seongnam production identity/approval policy mismatch')
          if not site.get('productionEnabled') or site.get('launchMode')!='live': raise SystemExit('Production Launch Gate is closed')
          revision=os.environ.get('REVISION') or values.get('EXPECTED_REVISION','')
          if not re.fullmatch('[0-9a-f]{40}',revision): raise SystemExit('A full pinned EXPECTED_REVISION is required')
          if site.get('requireRevisionApproval'):
              if site.get('approvedRevision')!=revision or not site.get('approvalEvidenceUrl','').startswith('https://github.com/'):
                  raise SystemExit('Exact revision lacks independent QA clearance in trusted registry')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for k,v in {'site_key':key,'branch':site['branch'],'root':site['root'],'site_url':site['siteUrl'],'worker':site.get('worker',''),'revision':revision,'wrangler':site.get('wranglerConfig','wrangler.jsonc'),'build_root':'release-build' if ownership_only else 'target/'+site['root'],'graph':site.get('graphScript','scripts/qa_site_graph.mjs'),'naver':site.get('naverVerification',''),'indexnow':site.get('indexnowKey','')}.items():out.write(f'{k}={v}\n')
          PYTHON
      - name: Checkout pinned approved revision
        uses: actions/checkout@v4
        with: {ref: "${{ steps.target.outputs.revision }}", path: target, fetch-depth: 0}
      - name: Check revision belongs to production branch
        working-directory: target
        env: {BRANCH: "${{ steps.target.outputs.branch }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: |
          git fetch origin "$BRANCH"
          git merge-base --is-ancestor "$REVISION" "origin/$BRANCH"
          test "$(git rev-parse HEAD)" = "$REVISION"
      - name: Isolate exact coverage release tree
        if: steps.target.outputs.goyang_coverage == 'true' || steps.target.outputs.bucheon_coverage == 'true' || steps.target.outputs.initial_coverage == 'true' || steps.target.outputs.ownership_only == 'true'
        env: {ROOT: "${{ steps.target.outputs.root }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: |
          set -euo pipefail
          mkdir release-build
          git -C target archive "$REVISION:$ROOT" | tar -xf - -C release-build
      - name: Verify exact ownership-only source amendment
        if: steps.target.outputs.ownership_only == 'true'
        run: python3 control/site-factory/engine/indexnow_ownership.py source --registry control/.github/site-factory-sites.json --site-key "${{ steps.target.outputs.site_key }}" --workspace target --report ownership-source.json
      - name: Extract original approved ownership baseline
        if: steps.target.outputs.ownership_only == 'true'
        env: {ROOT: "${{ steps.target.outputs.root }}", PREVIOUS: "${{ steps.target.outputs.previous_revision }}"}
        run: |
          mkdir ownership-baseline
          git -C target archive "$PREVIOUS:$ROOT" | tar -xf - -C ownership-baseline
      - name: Extract unchanged fixed Goyang canary baseline
        if: steps.target.outputs.goyang_coverage == 'true'
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower)" = 27a45b8e99151c34b966f0a59a96110b91395fad
          mkdir canary-baseline
          git -C target archive e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower | tar -xf - -C canary-baseline
      - name: Extract unchanged Bucheon historical facility baseline
        if: steps.target.outputs.bucheon_coverage == 'true'
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse ed5d30763d38ae1580974b1d377c07d4927dcdeb:site-factory/bucheon-flower)" = b92e058b30e9331baee1006f6c0d9c8a8e3775ec
          mkdir bucheon-baseline
          git -C target archive ed5d30763d38ae1580974b1d377c07d4927dcdeb:site-factory/bucheon-flower | tar -xf - -C bucheon-baseline
      - name: Fetch exact reviewed initial template source object
        if: steps.target.outputs.initial_coverage == 'true'
        env: {TEMPLATE_REVISION: "${{ steps.target.outputs.template_revision }}"}
        run: git -C target fetch --no-tags origin "$TEMPLATE_REVISION"
      - name: Validate exact initial whole-batch and independent hosted evidence
        if: steps.target.outputs.initial_coverage == 'true'
        env: {SITE_KEY: "${{ steps.target.outputs.site_key }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: python3 control/site-factory/engine/whole_initial.py --registry control/.github/site-factory-sites.json --site-key "$SITE_KEY" --revision "$REVISION" --root release-build --control control --workspace target --report initial-source.json
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build approved indexable artifact and rerun gates
        working-directory: ${{ steps.target.outputs.build_root }}
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          SITE_INDEXABLE: 'true'
          SITE_FACTORY_REVISION: ${{ steps.target.outputs.revision }}
          GRAPH_SCRIPT: ${{ steps.target.outputs.graph }}
          GOYANG_COVERAGE: ${{ steps.target.outputs.goyang_coverage }}
          BUCHEON_COVERAGE: ${{ steps.target.outputs.bucheon_coverage }}
          INITIAL_COVERAGE: ${{ steps.target.outputs.initial_coverage }}
        run: |
          test -f production-indexing.enabled
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if [ "$GOYANG_COVERAGE" = true ] || [ "$BUCHEON_COVERAGE" = true ] || [ "$INITIAL_COVERAGE" = true ]; then npm test; fi
          npm run build
          python3 scripts/qa_static.py
          node "$GRAPH_SCRIPT"
      - name: Build original approved ownership baseline with its unchanged lockfile
        if: steps.target.outputs.ownership_only == 'true'
        working-directory: ownership-baseline
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          SITE_INDEXABLE: 'true'
          SITE_FACTORY_REVISION: ${{ steps.target.outputs.previous_revision }}
        run: |
          test -f package-lock.json
          npm ci
          npm run build
      - name: Verify ownership-only rendered delta and current public source
        if: steps.target.outputs.ownership_only == 'true'
        run: |
          python3 control/site-factory/engine/indexnow_ownership.py artifacts --registry control/.github/site-factory-sites.json --site-key "${{ steps.target.outputs.site_key }}" --old-root ownership-baseline --root "${{ steps.target.outputs.build_root }}" --report ownership-artifacts.json
          python3 control/site-factory/engine/indexnow_ownership.py old-live --registry control/.github/site-factory-sites.json --site-key "${{ steps.target.outputs.site_key }}" --old-root ownership-baseline --report ownership-old-live.json
      - name: Verify existing ownership target binding before deploy
        if: steps.target.outputs.ownership_only == 'true'
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: python3 control/site-factory/engine/indexnow_ownership.py binding --registry control/.github/site-factory-sites.json --site-key "${{ steps.target.outputs.site_key }}" --report ownership-binding-before.json
      - name: Record build provenance
        run: python3 control/site-factory/engine/write_qa_provenance.py --root "${{ steps.target.outputs.build_root }}" --revision "${{ steps.target.outputs.revision }}" --output production-qa-provenance.json
      - name: Validate exact Goyang coverage artifact and frozen source
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {ROOT: "${{ steps.target.outputs.build_root }}", REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}"}
        run: python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root "$ROOT" --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase production --validate-only --report goyang-coverage-source.json
      - name: Validate Bucheon approved whole-batch evidence and exact frozen source
        if: steps.target.outputs.bucheon_coverage == 'true'
        env: {REVISION: "${{ steps.target.outputs.revision }}"}
        run: python3 control/site-factory/engine/bucheon_production.py --registry control/.github/site-factory-sites.json --root release-build --baseline-root bucheon-baseline --control control --workspace target --revision "$REVISION" --report bucheon-coverage-source.json
      - name: Verify initial production Worker and hostname are unassigned
        if: steps.target.outputs.initial_coverage == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_KEY: ${{ steps.target.outputs.site_key }}
        run: python3 control/site-factory/engine/initial_domain.py --site-key "$SITE_KEY" --report initial-domain-before.json
      - name: Verify existing Goyang binding before asset deployment
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: python3 control/site-factory/engine/verify_goyang_canonical.py binding --report goyang-binding-before.json
      - name: Verify initial Bucheon Worker and hostname are unassigned before asset deployment
        if: steps.target.outputs.bucheon_coverage == 'true' && steps.target.outputs.ownership_only != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 control/site-factory/engine/bucheon_domain_attach.py --preflight --report bucheon-domain-before.json
      - name: Deploy approved artifact
        id: deploy
        working-directory: ${{ steps.target.outputs.build_root }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ steps.target.outputs.wrangler }}
          GOYANG_COVERAGE: ${{ steps.target.outputs.goyang_coverage }}
          BUCHEON_COVERAGE: ${{ steps.target.outputs.bucheon_coverage }}
          INITIAL_COVERAGE: ${{ steps.target.outputs.initial_coverage }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9A-Fa-f]{32}$'
          if [ "$GOYANG_COVERAGE" = true ]; then
            npx --yes wrangler@4.146.0 deploy -c "$WRANGLER_CONFIG"
          elif [ "$BUCHEON_COVERAGE" = true ] || [ "$INITIAL_COVERAGE" = true ]; then
            npx --yes wrangler@4.147.0 deploy -c "$WRANGLER_CONFIG"
          else
            npx --yes wrangler@latest deploy -c "$WRANGLER_CONFIG"
          fi
      - name: Verify ownership target binding preservation after deploy attempt
        if: ${{ always() && steps.target.outputs.ownership_only == 'true' && steps.deploy.outcome != 'skipped' }}
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: |
          python3 control/site-factory/engine/indexnow_ownership.py binding --registry control/.github/site-factory-sites.json --site-key "${{ steps.target.outputs.site_key }}" --report ownership-binding-after.json
          cmp ownership-binding-before.json ownership-binding-after.json
      - name: Verify Goyang binding preservation after deployment attempt
        if: ${{ always() && steps.target.outputs.goyang_coverage == 'true' && steps.deploy.outcome != 'skipped' }}
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: python3 control/site-factory/engine/verify_goyang_canonical.py binding --report goyang-binding-after.json
      - name: Bind exact approved Seongnam hostname
        if: steps.target.outputs.site_key == 'seongnam-flower-v2' && steps.target.outputs.ownership_only != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 control/site-factory/engine/seongnam_domain_attach.py
      - name: Record one exact Bucheon domain request before mutation
        if: steps.target.outputs.bucheon_coverage == 'true' && steps.target.outputs.ownership_only != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect any earlier Bucheon domain outcome before retrying');
            if (context.payload.issue) {
              const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: context.issue.number});
              if (comments.some(c => c.body.includes('BUCHEON_DOMAIN_REQUEST_STARTED:'))) throw new Error('This request already attempted attachment; inspect its result before a fresh request');
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number,
                body: `BUCHEON_DOMAIN_REQUEST_STARTED: run=${context.runId}. Exact bucheon.fwith.kr attachment without overrides; an unknown outcome requires inspection before another request.`});
            }
      - name: Bind exact approved Bucheon hostname without overrides
        if: steps.target.outputs.bucheon_coverage == 'true' && steps.target.outputs.ownership_only != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 control/site-factory/engine/bucheon_domain_attach.py
      - name: Record one exact initial domain request before mutation
        if: steps.target.outputs.initial_coverage == 'true'
        uses: actions/github-script@v7
        env: {SITE_KEY: "${{ steps.target.outputs.site_key }}", RECEIPT_ISSUE: "${{ inputs.source_snapshot_issue || github.event.issue.number }}"}
        with:
          script: |
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect earlier initial-domain outcome before retrying');
            const issue_number=Number(process.env.RECEIPT_ISSUE);
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number});
            const marker=`INITIAL_DOMAIN_REQUEST_STARTED: site=${process.env.SITE_KEY}`;
            if(comments.some(c=>c.body.includes(marker)))throw new Error('Initial domain request already attempted; inspect its result');
            await github.rest.issues.createComment({...context.repo,issue_number,body:`${marker}; run=${context.runId}. No overrides; uncertain outcome requires inspection.`});
      - name: Bind exact reviewed initial hostname without overrides
        if: steps.target.outputs.initial_coverage == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_KEY: ${{ steps.target.outputs.site_key }}
          REVISION: ${{ steps.target.outputs.revision }}
        run: python3 control/site-factory/engine/initial_domain.py --site-key "$SITE_KEY" --attach --registry control/.github/site-factory-sites.json --revision "$REVISION" --report initial-domain-after.json
      - name: Verify complete Goyang coverage HTTP artifact
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {ROOT: "${{ steps.target.outputs.build_root }}", REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}"}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root "$ROOT" --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase production --report live-qa-report.json; then break; fi
            if grep -q '"pipelineState": "verification_blocked"' live-qa-report.json; then exit 1; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
      - name: Verify exact live revision and every published route
        if: steps.target.outputs.goyang_coverage != 'true' && steps.target.outputs.initial_coverage != 'true'
        run: python3 control/site-factory/engine/verify_live.py --site-key "${{ steps.target.outputs.site_key }}" --root "${{ steps.target.outputs.build_root }}" --origin "${{ steps.target.outputs.site_url }}" --revision "${{ steps.target.outputs.revision }}" --report live-qa-report.json --naver-verification "${{ steps.target.outputs.naver }}" --indexnow-key "${{ steps.target.outputs.indexnow }}"
      - name: Verify every initial public HTML route and static artifact byte
        if: steps.target.outputs.initial_coverage == 'true'
        env: {SITE_KEY: "${{ steps.target.outputs.site_key }}", ORIGIN: "${{ steps.target.outputs.site_url }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: python3 control/site-factory/engine/verify_initial.py --root release-build --site-key "$SITE_KEY" --origin "$ORIGIN" --revision "$REVISION" --phase production --report live-qa-report.json
      - name: Submit verified URLs to IndexNow
        id: indexnow
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          python3 control/site-factory/engine/indexnow_finalize.py \
            --registry control/.github/site-factory-sites.json \
            --site-key "${{ steps.target.outputs.site_key }}" \
            --revision "${{ steps.target.outputs.revision }}" \
            --root "${{ steps.target.outputs.build_root }}" \
            --receipt-issue "$RECEIPT_ISSUE" --report indexnow-receipt.json \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Save exact-revision QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-${{ steps.target.outputs.site_key }}-${{ github.run_id }}
          path: |
            indexnow-receipt.json
            initial-source.json
            initial-domain-before.json
            initial-domain-after.json
            ownership-*.json
            production-qa-provenance.json
            live-qa-report.json
            goyang-coverage-source.json
            bucheon-coverage-source.json
            bucheon-domain-before.json
            goyang-binding-before.json
            goyang-binding-after.json
          if-no-files-found: ignore
      - name: Report live verification
        if: github.event_name == 'issues' || inputs.source_snapshot_issue != ''
        env: {GH_TOKEN: "${{ github.token }}", REVISION: "${{ steps.target.outputs.revision }}", ISSUE_NUMBER: "${{ inputs.source_snapshot_issue || github.event.issue.number }}"}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "PIPELINE_STATE: live_verified_indexnow_received. Exact production revision=$REVISION, every registered route and public sitemap verified, and IndexNow receipt saved. HTTP 202 indicates receipt with ownership validation pending. Search indexing/ranking is not verified. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close -R "$GITHUB_REPOSITORY" "$ISSUE_NUMBER"
      - name: Report failed or blocked verification
        if: failure() && (github.event_name == 'issues' || inputs.source_snapshot_issue != '')
        env: {GH_TOKEN: "${{ github.token }}", ISSUE_NUMBER: "${{ inputs.source_snapshot_issue || github.event.issue.number }}"}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "PIPELINE_STATE: failed_or_verification_blocked. Deployment or IndexNow finalization is incomplete; not marked live_verified_indexnow_received. The issue remains open for diagnosis and exact-revision retry. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  finalize-existing-public:
    permissions: {contents: read, issues: write}
    if: inputs.indexnow_only == true || startsWith(github.event.issue.title, '[SITE-INDEXNOW]')
    runs-on: ubuntu-latest
    env: {ASTRO_TELEMETRY_DISABLED: '1'}
    steps:
      - name: Authorize repository writer
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (!['admin', 'maintain', 'write'].includes(data.permission)) throw new Error('Untrusted request');
            }
      - name: Validate existing receipt destination before work
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          printf '%s' "$RECEIPT_ISSUE" | grep -Eq '^[1-9][0-9]*$'
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/$RECEIPT_ISSUE" --jq .number)" = "$RECEIPT_ISSUE"
      - uses: actions/checkout@v4
        with: {ref: main, path: control}
      - name: Resolve existing public target without deployment
        id: target
        env:
          SITE_KEY: ${{ inputs.site_key }}
          REVISION: ${{ inputs.expected_revision }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          values = {}
          for line in os.environ.get('ISSUE_BODY', '').split('---BEGIN-', 1)[0].splitlines():
              if ': ' in line:
                  key, value = line.split(': ', 1)
                  if key in values: raise SystemExit('Duplicate issue header')
                  values[key] = value.strip()
          key = os.environ.get('SITE_KEY') or values.get('SITE_KEY', '')
          revision = os.environ.get('REVISION') or values.get('EXPECTED_REVISION', '')
          site = json.load(open('control/.github/site-factory-sites.json'))['sites'].get(key)
          if not site or site['repo'] != os.environ['GITHUB_REPOSITORY']: raise SystemExit('Unregistered site')
          if key == 'namyangju-flower-v2':
              if 'SITE_KEY: goyang-flower-v2' in os.environ.get('ISSUE_BODY', ''):
                  raise SystemExit('Initial issue body must not select another site deployment lock')
              import sys
              sys.path.insert(0, 'control/site-factory/engine')
              from whole_initial import resolve
              binding=site['initialDeployment']
              resolved=resolve(site,os.environ['GITHUB_REPOSITORY'],revision,binding['launchKey'],binding['scopeKey'])
              if resolved['site_key'] != key: raise SystemExit('Initial finalization identity mismatch')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for name,value in resolved.items():out.write(f'{name}={value}\n')
              raise SystemExit(0)
          if key == 'goyang-flower-v2' and not os.environ.get('SITE_KEY') and 'SITE_KEY: goyang-flower-v2' not in os.environ.get('ISSUE_BODY', '').split('---BEGIN-', 1)[0].splitlines():
              raise SystemExit('Goyang requires exact canonical SITE_KEY header for its shared lock')
          if key == 'blog-fwith':
              import sys
              from pathlib import Path
              sys.path.insert(0, 'control/site-factory/engine')
              from blog_indexnow_finalize import resolved_target
              resolved = resolved_target(Path('control/.github/site-factory-sites.json'), revision)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  for name, value in resolved.items(): out.write(f'{name}={value}\n')
              raise SystemExit(0)
          if site.get('productionEnabled') is not True or site.get('launchMode') != 'live': raise SystemExit('Production gate closed')
          if not re.fullmatch('[0-9a-f]{40}', revision): raise SystemExit('Full source SHA required')
          if site.get('requireRevisionApproval') and site.get('approvedRevision') != revision:
              raise SystemExit('Source does not match approved production revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in {'site_key': key, 'revision': revision, 'branch': site['branch'],
                                 'root': site['root'], 'site_url': site['siteUrl'],
                                 'launch_key': site.get('coverageDeployment', {}).get('launchKey', ''),
                                 'scope_key': site.get('coverageDeployment', {}).get('scopeKey', ''),
                                 'naver': site.get('naverVerification', ''), 'indexnow': site.get('indexnowKey', '')}.items():
                  out.write(f'{key}={value}\n')
          PYTHON
      - uses: actions/checkout@v4
        with: {ref: "${{ steps.target.outputs.revision }}", path: target, fetch-depth: 0}
      - name: Verify source branch ancestry
        working-directory: target
        env: {BRANCH: "${{ steps.target.outputs.branch }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: |
          git fetch origin "$BRANCH"
          git merge-base --is-ancestor "$REVISION" "origin/$BRANCH"
          test "$(git rev-parse HEAD)" = "$REVISION"
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Isolate exact public source for finalization
        env: {ROOT: "${{ steps.target.outputs.root }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: |
          mkdir finalization-build
          git -C target archive "$REVISION:$ROOT" | tar -xf - -C finalization-build
      - name: Fetch exact initial renderer source before receipt recovery
        if: steps.target.outputs.initial_coverage == 'true'
        env: {TEMPLATE_REVISION: "${{ steps.target.outputs.template_revision }}"}
        run: git -C target fetch --no-tags origin "$TEMPLATE_REVISION"
      - name: Validate unchanged initial source before read-only recovery build
        if: steps.target.outputs.initial_coverage == 'true'
        env: {SITE_KEY: "${{ steps.target.outputs.site_key }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: python3 control/site-factory/engine/whole_initial.py --registry control/.github/site-factory-sites.json --site-key "$SITE_KEY" --revision "$REVISION" --root finalization-build --control control --workspace target --report initial-source.json
      - name: Build exact public source for read-only sitemap comparison
        working-directory: finalization-build
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          SITE_INDEXABLE: 'true'
          SITE_FACTORY_REVISION: ${{ steps.target.outputs.revision }}
          SITE_KEY: ${{ steps.target.outputs.site_key }}
        run: |
          if [ "$SITE_KEY" != blog-fwith ]; then test -f production-indexing.enabled; fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Extract fixed Goyang baseline for exact live recovery QA
        if: steps.target.outputs.site_key == 'goyang-flower-v2'
        run: |
          test "$(git -C target rev-parse e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower)" = 27a45b8e99151c34b966f0a59a96110b91395fad
          mkdir canary-baseline
          git -C target archive e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower | tar -xf - -C canary-baseline
      - name: Reverify exact public artifact without redeploying
        env:
          SITE_KEY: ${{ steps.target.outputs.site_key }}
          ORIGIN: ${{ steps.target.outputs.site_url }}
          REVISION: ${{ steps.target.outputs.revision }}
          LAUNCH_KEY: ${{ steps.target.outputs.launch_key }}
          SCOPE_KEY: ${{ steps.target.outputs.scope_key }}
          NAVER: ${{ steps.target.outputs.naver }}
          INDEXNOW: ${{ steps.target.outputs.indexnow }}
        run: |
          if [ "$SITE_KEY" = blog-fwith ]; then
            python3 control/site-factory/engine/blog_indexnow_finalize.py verify --registry control/.github/site-factory-sites.json --revision "$REVISION" --root finalization-build --report recovery-live-qa.json
          elif [ "$SITE_KEY" = goyang-flower-v2 ]; then
            for attempt in 1 2 3 4 5 6; do
              if python3 control/site-factory/engine/verify_live.py --site-key "$SITE_KEY" --root finalization-build --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin "$ORIGIN" --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase production --report recovery-live-qa.json; then break; fi
              if grep -q '"pipelineState": "verification_blocked"' recovery-live-qa.json; then exit 1; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 10
            done
          elif [ "$SITE_KEY" = namyangju-flower-v2 ]; then
            python3 control/site-factory/engine/verify_initial.py --root finalization-build --site-key "$SITE_KEY" --origin "$ORIGIN" --revision "$REVISION" --phase production --report recovery-live-qa.json
          else
            python3 control/site-factory/engine/verify_live.py --site-key "$SITE_KEY" --root finalization-build --origin "$ORIGIN" --revision "$REVISION" --naver-verification "$NAVER" --indexnow-key "$INDEXNOW" --report recovery-live-qa.json
          fi
      - name: Submit verified existing public URLs without deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          if [ "${{ steps.target.outputs.site_key }}" = blog-fwith ]; then
            python3 control/site-factory/engine/blog_indexnow_finalize.py submit \
              --registry control/.github/site-factory-sites.json \
              --revision "${{ steps.target.outputs.revision }}" \
              --root finalization-build \
              --receipt-issue "$RECEIPT_ISSUE" --report indexnow-receipt.json \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            python3 control/site-factory/engine/indexnow_finalize.py \
              --registry control/.github/site-factory-sites.json \
              --site-key "${{ steps.target.outputs.site_key }}" \
              --revision "${{ steps.target.outputs.revision }}" \
              --root finalization-build \
              --receipt-issue "$RECEIPT_ISSUE" --report indexnow-receipt.json \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Save IndexNow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt-${{ github.run_id }}
          path: |
            indexnow-receipt.json
            initial-source.json
            initial-domain-before.json
            initial-domain-after.json
            recovery-live-qa.json
          if-no-files-found: ignore
      - name: Report accepted IndexNow receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "$RECEIPT_ISSUE" --body "PIPELINE_STATE: live_verified_indexnow_received. Current exact public source and complete indexable sitemap received by IndexNow. See receipt for HTTP 200 or HTTP 202 key-validation-pending. Search indexing/ranking is not verified. No deployment was performed. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report blocked IndexNow receipt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ inputs.source_snapshot_issue || github.event.issue.number }}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "$RECEIPT_ISSUE" --body "PIPELINE_STATE: indexnow_blocked_or_failed. This is incomplete, not skipped success. Inspect the exact receipt before retrying. An uncertain POST is never automatically repeated. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

