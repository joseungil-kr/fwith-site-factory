name: Ansan supplemental production artifacts, no deployment

on:
  push:
    branches: [manual-ansan-supplemental-artifacts-20261007]
    paths:
      - 'site-factory/ansan-flower/**'
      - '.github/workflows/ansan-cloudflare-production-deploy.yml'
      - '.github/workflows/ansan-indexnow-production.yml'
      - '.github/workflows/ansan-live-qa.yml'
      - '.github/workflows/ansan-manual-preview-qa.yml'
      - '.github/workflows/ansan-site-build-test.yml'
      - '.github/workflows/sync-flower-product-images.yml'
      - '.github/scripts/ansan-supplemental-gate.py'
      - '.github/workflows/ansan-supplemental-production-artifacts.yml'
      - '.github/scripts/ansan-supplemental-production-capture.mjs'
      - '.github/scripts/ansan-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-ansan-supplemental-artifacts-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://ansan.fwith.kr
      SITE_ORIGIN: https://ansan.fwith.kr
      EXPECTED_SOURCE_BUNDLE: '39582656da702e5485ec22e2a60bd517ce07e6513de947b3ad41675d17f27f34'
      SITE_INDEXABLE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert fixed branch and reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/ansan-manual-playwright" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-ansan-supplemental-artifacts-20261007'
          git merge-base --is-ancestor aeb04a9ed1f9f36692fd3e679e6e71c5c065224d HEAD
          test "$SITE_URL" = 'https://ansan.fwith.kr'
          test "$SITE_INDEXABLE" = 'true'
          mkdir -p ansan-production-artifact-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {validateManual} from './site-factory/ansan-flower/src/lib/manual-contract.mjs';
          const reviewed=validateManual('site-factory/ansan-flower',process.env);
          const expected=process.env.EXPECTED_SOURCE_BUNDLE;
          assert.match(expected??'',/^[a-f0-9]{64}$/);
          assert.equal(reviewed.hashes.bundleHash,expected,'Reviewed source bundle changed');
          assert.equal(reviewed.production,true);assert.equal(reviewed.pages.length,24);
          fs.writeFileSync('ansan-production-artifact-evidence/revision.json',JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,sourceBase:'aeb04a9ed1f9f36692fd3e679e6e71c5c065224d',reviewedArtifactDigest:expected,productionApproval:'pending'},null,2));
          fs.writeFileSync('ansan-production-artifact-evidence/source-inventory.json',JSON.stringify(reviewed.hashes,null,2));
          JS
      - name: Retain full exact tracked source and execution binding
        run: |
          python3 - <<'PYTHON'
          import hashlib,importlib.util,json,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('gate','.github/scripts/ansan-supplemental-gate.py');g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          git=lambda *a:subprocess.check_output(['git',*a]);digest=lambda b:hashlib.sha256(b).hexdigest()
          revision=git('rev-parse','HEAD').decode().strip();files={}
          for row in git('ls-tree','-rz',revision,'--',g.ROOT).split(b'\0'):
            if not row:continue
            meta,p=row.split(b'\t');mode,kind,blob=meta.split();assert kind==b'blob' and mode in (b'100644',b'100755')
            files[p.decode()]=digest(git('cat-file','blob',blob.decode()))
          execution={p:digest(git('show',revision+':'+p)) for p in g.FILES}
          delta=git('diff','--binary','--full-index',g.BASELINE,revision,'--',g.ROOT,*g.FILES)
          out=pathlib.Path('ansan-production-artifact-evidence');out.joinpath('baseline-delta.patch').write_bytes(delta)
          out.joinpath('source-binding.json').write_text(json.dumps({'revision':revision,'baselineRevision':g.BASELINE,'sourceFiles':files,'executionFiles':execution,'sourceManifestSha256':digest(json.dumps(files,sort_keys=True,separators=(',',':')).encode()),'deltaSha256':digest(delta)},indent=2)+'\n')
          PYTHON
      - name: Install native site dependencies
        working-directory: site-factory/ansan-flower
        run: npm install --no-package-lock
      - name: Native gated production-origin indexable build
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/ansan-production-artifact-evidence/native-build.log"
          python3 scripts/qa_static.py 2>&1 | tee "$GITHUB_WORKSPACE/ansan-production-artifact-evidence/native-static-qa.log"
      - name: Record exact production artifact manifest
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,pathlib
          d=pathlib.Path('site-factory/ansan-flower/dist')
          m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob('*')) if f.is_file()}
          assert m and not any(f.is_symlink() for f in d.rglob('*'))
          pathlib.Path('ansan-production-artifact-evidence/dist-manifest.json').write_text(json.dumps({'files':m,'fileCount':len(m),'artifactManifestSha256':hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest()},indent=2)+'\n')
          PYTHON
      - name: Rebuild and require identical production bytes
        working-directory: site-factory/ansan-flower
        run: |
          npm run build
          python3 - <<'PYTHON'
          import hashlib,json,pathlib
          d=pathlib.Path('dist');m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob('*')) if f.is_file()}
          before=json.loads(pathlib.Path('../../ansan-production-artifact-evidence/dist-manifest.json').read_text())
          assert m==before['files'], 'Production artifact not reproducible'
          PYTHON
      - name: Native regression tests
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs tests/*.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/ansan-production-artifact-evidence/native-tests.log"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > ansan-production-artifact-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > ansan-production-artifact-evidence/playwright-dependencies.json
      - name: Capture loopback desktop and mobile evidence
        run: node .github/scripts/ansan-supplemental-production-capture.mjs
      - name: Partition original pixels without recompression
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('ansan-production-artifact-evidence');files=sorted((root/'screenshots').glob('*.jpg'))
          assert len(files)==56
          for n in range(0,len(files),20):
              batch=files[n:n+20];assert sum(f.stat().st_size for f in batch)<24*1024*1024
              dest=root/'parts'/('screens-'+str(n//20+1));dest.mkdir(parents=True,exist_ok=True)
              for f in batch:shutil.copyfile(f,dest/f.name)
          assert sum(f.stat().st_size for f in root.glob('*.json'))+sum(f.stat().st_size for f in (root/'html').glob('*'))<24*1024*1024
          PY
      - name: Retain evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansan-supplemental-production-artifacts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ansan-production-artifact-evidence/*.json
            ansan-production-artifact-evidence/*.log
            ansan-production-artifact-evidence/*.patch
            ansan-production-artifact-evidence/html/
            ansan-production-artifact-evidence/font-match.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact production dist for independent review
        uses: actions/upload-artifact@v4
        with:
          name: ansan-supplemental-production-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: site-factory/ansan-flower/dist/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ansan-production-artifact-evidence/parts/screens-1/**') != ''
        with:
          name: ansan-supplemental-artifact-screens-1-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-production-artifact-evidence/parts/screens-1/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ansan-production-artifact-evidence/parts/screens-2/**') != ''
        with:
          name: ansan-supplemental-artifact-screens-2-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-production-artifact-evidence/parts/screens-2/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ansan-production-artifact-evidence/parts/screens-3/**') != ''
        with:
          name: ansan-supplemental-artifact-screens-3-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-production-artifact-evidence/parts/screens-3/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ansan-production-artifact-evidence/parts/screens-4/**') != ''
        with:
          name: ansan-supplemental-artifact-screens-4-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-production-artifact-evidence/parts/screens-4/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ansan-production-artifact-evidence/parts/screens-5/**') != ''
        with:
          name: ansan-supplemental-artifact-screens-5-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-production-artifact-evidence/parts/screens-5/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
