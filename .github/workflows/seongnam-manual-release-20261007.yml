name: Seongnam reviewed assets-only manual release
on:
  push:
    branches: [manual-preview-seongnam-20261007, site-factory-seongnam-v2]
permissions:
  contents: read
concurrency:
  group: seongnam-reviewed-manual-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/manual-preview-seongnam-20261007' || github.ref == 'refs/heads/site-factory-seongnam-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PHASE: ${{ github.ref_name == 'manual-preview-seongnam-20261007' && 'preview' || 'production' }}
      SITE_URL: ${{ github.ref_name == 'manual-preview-seongnam-20261007' && 'https://seongnam-flower-guide-qa.joseungil.workers.dev' || 'https://seongnam.fwith.kr' }}
      SITE_ORIGIN: ${{ github.ref_name == 'manual-preview-seongnam-20261007' && 'https://seongnam-flower-guide-qa.joseungil.workers.dev' || 'https://seongnam.fwith.kr' }}
      SITE_INDEXABLE: ${{ github.ref_name == 'manual-preview-seongnam-20261007' && 'false' || 'true' }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Check out trusted current approval authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: authority
          persist-credentials: false
      - name: Check out independently reviewed immutable control
        uses: actions/checkout@v4
        with:
          ref: 9c3cebea6e4ba2c00055f74bc77a28f0f72af4e8
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require independent exact-source authority before building
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/manual-release-20261007/gate.py authority/.github/manual-release-20261007/seongnam.policy.json authority/.github/manual-release-20261007/seongnam.approval.json target "$PHASE"
      - name: Install exact native dependencies
        working-directory: target/site-factory/seongnam-flower
        run: npm ci --no-audit --no-fund
      - name: Native regression, source and rendered-output gates
        shell: bash
        working-directory: target/site-factory/seongnam-flower
        run: |
          set -euo pipefail
          if [ "$PHASE" = production ]; then test -f production-indexing.enabled; fi
          npm test
          python3 -m unittest discover -s tests -p '*_test.py'
          npm run build
          python3 scripts/qa_static.py
          node scripts/qa_graph.mjs
      - name: Require independently reviewed artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/manual-release-20261007/gate.py authority/.github/manual-release-20261007/seongnam.policy.json authority/.github/manual-release-20261007/seongnam.approval.json target "$PHASE" artifact
      - name: Install pinned official upload client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/seongnam-manual-wrangler" --no-save --no-package-lock wrangler@4.147.0
          test "$(node -p 'require(process.env.RUNNER_TEMP+"/seongnam-manual-wrangler/node_modules/wrangler/package.json").version')" = '4.147.0'
      - name: Upload reviewed static assets while preserving existing provider state
        shell: bash
        working-directory: target/site-factory/seongnam-flower
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/control/scripts/manual-release-20261007"
          policy="$GITHUB_WORKSPACE/authority/.github/manual-release-20261007/seongnam.policy.json"
          if [ "$PHASE" = production ]; then test -f production-indexing.enabled; fi
          python3 "$helper/gate.py" "$policy" "$GITHUB_WORKSPACE/authority/.github/manual-release-20261007/seongnam.approval.json" "$GITHUB_WORKSPACE/target" "$PHASE" artifact
          python3 "$helper/provider_check.py" "$policy" "$PHASE" before
          python3 "$helper/write_assets_only_config.py" "$policy" "$PHASE"
          trap 'original=$?; trap - EXIT; python3 "$helper/provider_check.py" "$policy" "$PHASE" after; checked=$?; if [ "$original" -ne 0 ]; then exit "$original"; fi; exit "$checked"' EXIT
          "$RUNNER_TEMP/seongnam-manual-wrangler/node_modules/.bin/wrangler" deploy --config .manual-assets-only-20261007.jsonc
      - name: Verify every live byte, response header and real 404
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/manual-release-20261007/verify_http.py authority/.github/manual-release-20261007/seongnam.policy.json "$PHASE" target/site-factory/seongnam-flower/dist "$GITHUB_SHA"
      - name: Install hosted preview capture dependencies
        if: env.PHASE == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/seongnam-manual-playwright" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/seongnam-manual-playwright" --no-save --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/seongnam-manual-playwright/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture exact isolated hosted preview
        if: env.PHASE == 'preview'
        working-directory: target
        env:
          MANUAL_QA_PHASE: preview
          MANUAL_HOSTED_PREVIEW: 'true'
        run: node .github/scripts/seongnam-manual-preview.mjs
      - name: Enforce retrievable hosted evidence chunks
        if: env.PHASE == 'preview'
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import pathlib
          root=pathlib.Path('seongnam-preview-evidence')
          for part,expected in [('screens-01',18),('screens-02',18),('screens-03',18),('screens-04',16)]:
            files=list((root/part).glob('*.jpg'))
            assert len(files)==expected,part
            assert sum(f.stat().st_size for f in files)<24*1024*1024,part
          assert sum(f.stat().st_size for f in (root/'metadata').glob('*'))<24*1024*1024
          PYTHON
      - name: Retain hosted machine evidence
        if: always() && env.PHASE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: seongnam-hosted-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: target/seongnam-preview-evidence/metadata/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted pixels 01
        if: always() && env.PHASE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: seongnam-hosted-screens-01-${{ github.sha }}-${{ github.run_attempt }}
          path: target/seongnam-preview-evidence/screens-01/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted pixels 02
        if: always() && env.PHASE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: seongnam-hosted-screens-02-${{ github.sha }}-${{ github.run_attempt }}
          path: target/seongnam-preview-evidence/screens-02/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted pixels 03
        if: always() && env.PHASE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: seongnam-hosted-screens-03-${{ github.sha }}-${{ github.run_attempt }}
          path: target/seongnam-preview-evidence/screens-03/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted pixels 04
        if: always() && env.PHASE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: seongnam-hosted-screens-04-${{ github.sha }}-${{ github.run_attempt }}
          path: target/seongnam-preview-evidence/screens-04/
          if-no-files-found: error
          retention-days: 7
