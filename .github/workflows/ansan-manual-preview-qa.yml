name: Ansan manual preview evidence

on:
  push:
    branches: [manual-ansan-regional-qa-20261007]
    paths:
      - 'site-factory/ansan-flower/**'
      - '.github/workflows/ansan-manual-preview-qa.yml'
      - '.github/scripts/ansan-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-ansan-regional-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_PREVIEW: '1'
      SITE_URL: http://127.0.0.1:8934
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert fixed preview boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/ansan-manual-playwright" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-ansan-regional-qa-20261007'
          test "$SITE_URL" = 'http://127.0.0.1:8934'
          test "$SITE_INDEXABLE" = 'false'
          mkdir -p ansan-preview-evidence
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("site-factory/ansan-flower/src/data/manual-provenance.json")); fs.writeFileSync("ansan-preview-evidence/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,provenance:p},null,2));'
      - name: Install native site dependencies
        working-directory: site-factory/ansan-flower
        run: npm install --no-package-lock
      - name: Native gated localhost noindex build
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/ansan-preview-evidence/native-build.log"
      - name: Native regression tests
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs tests/*.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/ansan-preview-evidence/native-tests.log"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > ansan-preview-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > ansan-preview-evidence/playwright-dependencies.json
      - name: Capture localhost desktop and mobile evidence
        run: node .github/scripts/ansan-manual-preview.mjs
      - name: Retain evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansan-manual-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-preview-evidence/
          if-no-files-found: error
          retention-days: 7

