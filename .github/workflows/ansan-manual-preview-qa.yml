name: Ansan manual preview evidence

on:
  push:
    branches: [manual-ansan-regional-qa-20261007]
    paths:
      - 'site-factory/ansan-flower/**'
      - '.github/workflows/ansan-manual-preview-qa.yml'
      - '.github/scripts/ansan-manual-preview.mjs'

permissions:
  contents: read

jobs:
  preview-evidence:
    if: github.ref == 'refs/heads/manual-ansan-regional-qa-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      MANUAL_PREVIEW: '1'
      SITE_URL: http://127.0.0.1:8934
      SITE_INDEXABLE: 'false'
      PYTHONDONTWRITEBYTECODE: "1"
      SHARED_BANNER_REFERENCE_DIST: "${{ github.workspace }}/shared-banner-production-dist"
      SHARED_BANNER_REFERENCE_MANIFEST: "${{ github.workspace }}/.github/shared-banner-reference/ansan-production.json"
      SHARED_BANNER_REFERENCE_MANIFEST_SHA256: "aab6e93563679f85953c471e815c272a0983b84ef9454cb4df4cdbd6097309bc"
      SHARED_BANNER_REFERENCE_ARTIFACT_SHA256: "c3acc22df8270cbde058c6c1fcf1edae99eb76d557c03f6032cbbd5086d95523"
      SHARED_BANNER_REFERENCE_REVISION: "a8116e0991c9a009ab1bfa085510fb1066cced9e"
      SHARED_BANNER_REFERENCE_ORIGIN: "https://ansan.fwith.kr"
      SHARED_BANNER_PREVIEW_REFERENCE_DIST: "${{ github.workspace }}/shared-banner-original-reference/site-factory/ansan-flower/dist"
      SHARED_BANNER_PREVIEW_REFERENCE_MANIFEST: "${{ github.workspace }}/.github/shared-banner-reference/ansan-preview.json"
      SHARED_BANNER_PREVIEW_REFERENCE_MANIFEST_SHA256: "fadafc0318f367be4368cb2bf4ea5a954fe648e4937235e2b78f9f482a9a0a80"
      SHARED_BANNER_PREVIEW_REFERENCE_ARTIFACT_SHA256: "b9c9368c6ff2793486c1820f19bf030d1aa478a7ed925f1345f8be09dc811ecb"
      SHARED_BANNER_PREVIEW_REFERENCE_ORIGIN: "http://127.0.0.1:8934"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out immutable original source for both bound phases
        uses: actions/checkout@v4
        with:
          ref: a8116e0991c9a009ab1bfa085510fb1066cced9e
          path: shared-banner-original-reference
          persist-credentials: false
      - name: Rebuild and authenticate immutable original production full artifact
        working-directory: shared-banner-original-reference/site-factory/ansan-flower
        env:
          SITE_URL: 'https://ansan.fwith.kr'
          SITE_ORIGIN: 'https://ansan.fwith.kr'
          SITE_INDEXABLE: 'true'
          MANUAL_PREVIEW: 'false'
          MANUAL_QA_PHASE: 'production'
          GITHUB_SHA: 'a8116e0991c9a009ab1bfa085510fb1066cced9e'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a8116e0991c9a009ab1bfa085510fb1066cced9e'
          npm install --no-package-lock
          npm run build
          python3 - <<'PYREFERENCE'
          import os,pathlib,json,hashlib
          raw=pathlib.Path(os.environ['SHARED_BANNER_REFERENCE_MANIFEST']).read_bytes()
          h=lambda b:hashlib.sha256(b).hexdigest()
          assert h(raw)==os.environ['SHARED_BANNER_REFERENCE_MANIFEST_SHA256'],'Original reference metadata changed'
          ref=json.loads(raw)
          assert ref['baselineRevision']==os.environ['SHARED_BANNER_REFERENCE_REVISION']
          assert ref['productionOrigin']==os.environ['SHARED_BANNER_REFERENCE_ORIGIN']
          root=pathlib.Path('dist');assert root.is_dir() and not root.is_symlink()
          files={}
          for p in sorted(root.rglob('*')):
              assert not p.is_symlink(),'Artifact symlink forbidden'
              if p.is_dir():continue
              assert p.is_file(),'Nonregular artifact'
              files[p.relative_to(root).as_posix()]=h(p.read_bytes())
          assert files==ref['files'],'Original full artifact bytes changed'
          assert h(json.dumps(files,sort_keys=True,separators=(',',':')).encode())==ref['artifactManifestSha256']==os.environ['SHARED_BANNER_REFERENCE_ARTIFACT_SHA256']
          
          print('Original production full artifact authenticated:',len(files))
          PYREFERENCE
          test ! -e "$SHARED_BANNER_REFERENCE_DIST"
          cp -a dist "$SHARED_BANNER_REFERENCE_DIST"
      - name: Rebuild and authenticate immutable original preview full artifact
        working-directory: shared-banner-original-reference/site-factory/ansan-flower
        env:
          SITE_URL: 'http://127.0.0.1:8934'
          SITE_ORIGIN: 'http://127.0.0.1:8934'
          SITE_INDEXABLE: 'false'
          MANUAL_PREVIEW: '1'
          MANUAL_QA_PHASE: 'preview'
          GITHUB_SHA: 'a8116e0991c9a009ab1bfa085510fb1066cced9e'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a8116e0991c9a009ab1bfa085510fb1066cced9e'
          npm run build
          python3 - <<'PYREFERENCE'
          import os,pathlib,json,hashlib
          raw=pathlib.Path(os.environ['SHARED_BANNER_PREVIEW_REFERENCE_MANIFEST']).read_bytes()
          h=lambda b:hashlib.sha256(b).hexdigest()
          assert h(raw)==os.environ['SHARED_BANNER_PREVIEW_REFERENCE_MANIFEST_SHA256'],'Original reference metadata changed'
          ref=json.loads(raw)
          assert ref['baselineRevision']==os.environ['SHARED_BANNER_REFERENCE_REVISION']
          assert ref['previewOrigin']==os.environ['SHARED_BANNER_PREVIEW_REFERENCE_ORIGIN']
          root=pathlib.Path('dist');assert root.is_dir() and not root.is_symlink()
          files={}
          for p in sorted(root.rglob('*')):
              assert not p.is_symlink(),'Artifact symlink forbidden'
              if p.is_dir():continue
              assert p.is_file(),'Nonregular artifact'
              files[p.relative_to(root).as_posix()]=h(p.read_bytes())
          assert files==ref['files'],'Original full artifact bytes changed'
          assert h(json.dumps(files,sort_keys=True,separators=(',',':')).encode())==ref['artifactManifestSha256']==os.environ['SHARED_BANNER_PREVIEW_REFERENCE_ARTIFACT_SHA256']
          assert ref['productionArtifactManifestSha256']==os.environ['SHARED_BANNER_REFERENCE_ARTIFACT_SHA256']
          print('Original preview full artifact authenticated:',len(files))
          PYREFERENCE
      - name: Assert fixed preview boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/ansan-manual-playwright" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = 'refs/heads/manual-ansan-regional-qa-20261007'
          test "$SITE_URL" = 'http://127.0.0.1:8934'
          test "$SITE_INDEXABLE" = 'false'
          mkdir -p ansan-preview-evidence
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("site-factory/ansan-flower/src/data/manual-provenance.json")); fs.writeFileSync("ansan-preview-evidence/revision.json",JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,provenance:p},null,2));'
      - name: Install native site dependencies
        working-directory: site-factory/ansan-flower
        run: npm install --no-package-lock
      - name: Native gated localhost noindex build
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/ansan-preview-evidence/native-build.log"
          test -f shared-banner-qa.json
          mv shared-banner-qa.json "$GITHUB_WORKSPACE/ansan-preview-evidence/shared-banner-qa.json"
      - name: Native regression tests
        shell: bash
        working-directory: site-factory/ansan-flower
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs tests/*.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/ansan-preview-evidence/native-tests.log"
          python3 -B scripts/test_shared_banners.py 2>&1 | tee "$GITHUB_WORKSPACE/ansan-preview-evidence/shared-banner-tests.log"
      - name: Install pinned official Playwright and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_INSTALL_ROOT" --no-save --no-package-lock playwright@1.63.0
          "$PLAYWRIGHT_INSTALL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' > ansan-preview-evidence/font-match.txt
          npm list --prefix "$PLAYWRIGHT_INSTALL_ROOT" --json > ansan-preview-evidence/playwright-dependencies.json
      - name: Capture localhost desktop and mobile evidence
        run: node .github/scripts/ansan-manual-preview.mjs
      - name: Retain evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansan-manual-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ansan-preview-evidence/
          if-no-files-found: error
          retention-days: 7

