name: Baekse order hostname Pages and Worker diagnostic
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['apps/baekse-order/**', '.github/workflows/baekse-order-preflight.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check whether Interpiad is Pages rather than Worker
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,socket
          t=os.getenv('CF_TOKEN',''); a=os.getenv('CF_ACCOUNT','')
          assert t and a,'Existing credentials missing'
          def call(p):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+p,headers={'Authorization':'Bearer '+t})
            try:
              with urllib.request.urlopen(req,timeout=25) as h:
                r=json.load(h)
                print('HTTP',p.split('?')[0],h.status,'success',r.get('success'),'count',len(r.get('result') or []))
                return r
            except urllib.error.HTTPError as e:
              try: error=json.loads(e.read().decode()) 
              except: error={}
              print('HTTP',p.split('?')[0],e.code,'codes',[v.get('code') for v in error.get('errors',[])])
              return None
          for domain in ['interapid.com','interpiad.com','order.baeksefood.com']:
            try: print('DNS_RESOLVES',domain,bool(socket.getaddrinfo(domain,443)))
            except: print('DNS_RESOLVES',domain,False)
          for uri in ['/accounts/'+a+'/pages/projects','/accounts/'+a+'/pages/projects?page=1&per_page=5']:
            r=call(uri)
            if r and isinstance(r.get('result'),list):
              for p in r['result']:
                ds=p.get('domains') or []
                if any('interpiad' in str(d) or 'interapid' in str(d) or 'baeksefood' in str(d) for d in ds) or any(x in p.get('name','').lower() for x in ['interpiad','interapid','baekse']):
                  source=(p.get('source') or {}).get('config') or {}
                  print('PAGES_MATCH',p.get('name'),'DOMAINS',ds,'PRODUCTION_BRANCH',p.get('production_branch'),'REPO_NAME',source.get('repo_name'))
          r=call('/accounts/'+a+'/workers/domains')
          if r and isinstance(r.get('result'),list):
            for v in r['result']:
              if 'inter' in str(v.get('hostname','')).lower() or 'baeksefood' in str(v.get('hostname','')).lower():
                print('WORKERS_CUSTOM_DOMAIN_MATCH',v.get('hostname'),v.get('service'))
          r=call('/accounts/'+a+'/workers/scripts')
          if r and isinstance(r.get('result'),list):
            for v in r['result']:
              n=v.get('id','')
              if any(s in n.lower() for s in ['inter','homepage','baekse','order','website']):
                print('SCRIPT_CANDIDATE',n)
          print('DONE_WITHOUT_CHANGES')
          PY
