name: Baekse order existing Cloudflare deployment preflight
on:
  push:
    branches: [feature/baekse-order-deploy-20261103]
    paths: ['apps/baekse-order/**', '.github/workflows/baekse-order-preflight.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate existing secrets and domain visibility without mutation
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok=os.environ.get('CF_TOKEN'); account=os.environ.get('CF_ACCOUNT')
          print('TOKEN_EXISTS',bool(tok),'ACCOUNT_EXISTS',bool(account))
          if not tok or not account: raise SystemExit('Repo secrets absent; no Cloudflare calls')
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+tok})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                d=json.load(r);print('API',path.split('?')[0],r.status,'success',d.get('success'))
                return d.get('result')
            except urllib.error.HTTPError as e:
              print('API',path.split('?')[0],e.code,'not available')
              return None
          get('/user/tokens/verify')
          zones=get('/zones?name=baeksefood.com')
          print('ZONE_MATCHES',None if zones is None else len(zones))
          if zones:
            for z in zones: print('ZONE_NAME',z.get('name'),'ZONE_ACTIVE',z.get('status')=='active','MATCH_ACCOUNT',z.get('account',{}).get('id')==account)
          get('/accounts/'+account+'/d1/database?per_page=1')
          get('/accounts/'+account+'/workers/subdomain')
          PY
