name: Yeosu policy correction readonly build and loopback QA
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: yeosu-policy-correction-readonly-qa-${{ github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.title == '[YEOSU-POLICY-CORRECTION-QA] 20261017' && github.event.issue.user.login == 'joseungil-kr' && 'requested' || github.run_id }}
  cancel-in-progress: false
jobs:
  production_build:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.title == '[YEOSU-POLICY-CORRECTION-QA] 20261017' && github.event.issue.user.login == 'joseungil-kr'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AZURE_EXTENSION_DIR: ''
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_RELEASE_MODE: production
      SITE_INDEXABLE: 'true'
      SITE_URL: https://yeosu.fwith.kr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Select exact owner-requested read-only correction QA
        id: select
        run: python3 control/scripts/direct-yeosu-correction/production_build.py select --report selected-source.json
      - name: Pin source and external control binding in build environment
        run: |
          echo 'SITE_FACTORY_REVISION=${{ steps.select.outputs.source_revision }}' >> "$GITHUB_ENV"
          echo "SITE_RELEASE_BINDING_PATH=$GITHUB_WORKSPACE/control/scripts/direct-yeosu-correction/production-binding.json" >> "$GITHUB_ENV"
          echo 'SITE_RELEASE_BINDING_SHA256=${{ steps.select.outputs.binding_sha256 }}' >> "$GITHUB_ENV"
      - name: Recheck production source branch head
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref:'heads/source/yeosu-product-policy-correction-20261017'});
            if (data.object.type !== 'commit' || data.object.sha !== process.env.SITE_FACTORY_REVISION) throw new Error('Pinned source branch moved');
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.source_revision }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all source files and binding
        run: python3 control/scripts/direct-yeosu-correction/production_build.py prebuild --checkout target --report source-prebuild.json
      - name: Test separate credential-free correction controls
        run: python3 control/scripts/direct-yeosu-correction/run_control_tests.py
      - name: Preserve historical control regression tests unchanged
        run: python3 -m unittest discover -s control/scripts/direct-yeosu -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve original preview build and historical regression gates
        working-directory: target/site-factory/yeosu-flower/portable/yeosu-portable-build-inputs-20261015/yeosu-local-implementation-20261015/candidate
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/logs"
          npm ci --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/npm-ci.log"
          export SITE_RELEASE_MODE=preview SITE_INDEXABLE=false SITE_URL= SITE_RELEASE_BINDING_PATH='' SITE_RELEASE_BINDING_SHA256=''
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/preview-build.log"
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/preview-native-tests.log"
      - name: Build frozen baseline then mandatory reviewed correction
        working-directory: target/site-factory/yeosu-flower/portable/yeosu-portable-build-inputs-20261015/yeosu-local-implementation-20261015/candidate
        run: |
          set -euo pipefail
          # Exercise unchanged legacy output mutation tests on the actual legacy baseline first.
          node "$GITHUB_WORKSPACE/target/site-factory/yeosu-flower/release-adapter/scripts/write_yeosu_release_files.mjs" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/baseline-production-transform.log"
          python3 "$GITHUB_WORKSPACE/target/site-factory/yeosu-flower/release-adapter/scripts/yeosu_release_output.py" --dist dist --revision "$SITE_FACTORY_REVISION" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/baseline-production-qa.log"
          node --test "$GITHUB_WORKSPACE/target/site-factory/yeosu-flower/release-adapter/release-tests/"*.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/production-native-tests.log"
          python3 "$GITHUB_WORKSPACE/target/site-factory/yeosu-flower/release-adapter/scripts/test_yeosu_release_output.py" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/baseline-production-mutations.log"
          # Full saved producer replays private build/baseline QA and mandatorily applies correction.
          node "$GITHUB_WORKSPACE/target/site-factory/yeosu-flower/release-adapter/scripts/build_yeosu_release.mjs" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/corrected-production-build.log"
          YEOSU_CORRECTION_DIST="$PWD/dist" python3 "$GITHUB_WORKSPACE/control/scripts/direct-yeosu-correction/test_production_build.py" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/correction-output-mutations.log"
      - name: Verify and package exact 18-file production artifact
        env:
          NATIVE_GATES_PASSED: 'true'
        run: python3 control/scripts/direct-yeosu-correction/production_build.py postbuild --package --checkout target --report production-output.json
      - name: Verify capture selectors and installed Astro CLI against actual production files
        env:
          YEOSU_CAPTURE_INSPECTION_ROOT: ${{ github.workspace }}/target/site-factory/yeosu-flower/portable/yeosu-portable-build-inputs-20261015/yeosu-local-implementation-20261015/candidate
        run: python3 control/scripts/direct-yeosu-correction/test_capture_contract.py
      - name: Install existing pinned browser tooling and Korean fonts
        run: |
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' | tee evidence/logs/font-match.txt
      - name: Inspect production artifact on runner loopback only
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 ASTRO_TELEMETRY_DISABLED=1 \
            SITE_RELEASE_MODE="$SITE_RELEASE_MODE" SITE_INDEXABLE="$SITE_INDEXABLE" SITE_URL="$SITE_URL" \
            SITE_FACTORY_REVISION="$SITE_FACTORY_REVISION" SITE_RELEASE_BINDING_PATH="$SITE_RELEASE_BINDING_PATH" \
            SITE_RELEASE_BINDING_SHA256="$SITE_RELEASE_BINDING_SHA256" \
            python3 control/scripts/direct-yeosu-correction/production_capture.py --checkout target --output evidence/browser 2>&1 | tee evidence/logs/capture.log
      - name: Recheck pinned source branch after capture
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref:'heads/source/yeosu-product-policy-correction-20261017'});
            if (data.object.type !== 'commit' || data.object.sha !== process.env.SITE_FACTORY_REVISION) throw new Error('Pinned correction source branch moved during QA');
      - name: Seal retained screenshots and reports
        if: always()
        run: python3 control/scripts/direct-yeosu-correction/production_capture.py --seal --output evidence/browser
      - name: Retain production bytes and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeosu-policy-correction-qa-${{ github.run_id }}-${{ github.sha }}
          path: |
            release/
            selected-source.json
            source-prebuild.json
            production-output.json
            control/scripts/direct-yeosu-correction/
            evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
