name: Baekse promote checked order detail version
on:
  push:
    branches: [review/baekse-order-telegram-20261113]
    paths: ['.github/workflows/baekse-telegram-review-release.yml']
permissions: {contents: read}
concurrency:
  group: baekse-order-existing-worker-updates
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'joseungil-kr/fwith-site-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Activate exact candidate and verify same public files
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.BAEKSE_ORDER_RELEASE_CF_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          from email.parser import BytesParser
          from email.policy import default
          import os
          import re
          from pathlib import Path
          import urllib.error
          import urllib.request
          import uuid
          import urllib.parse
          
          BASE = "8e38b102-c4a6-4321-befb-fae7b275c942"
          API = "https://api.cloudflare.com/client/v4"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          def main():
              account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
              if not re.fullmatch(r"[a-f0-9]{32}", account) or not token:
                  return {"status": "unavailable", "reason": "configuration"}
              prefix = "/accounts/" + account + "/workers/scripts/funeralflower-home-preview"
              opener = urllib.request.build_opener(NoRedirect)
              def get(suffix):
                  request = urllib.request.Request(API + prefix + suffix, method="GET",
                      headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
                  with opener.open(request, timeout=15) as response:
                      doc = json.load(response)
                  if doc.get("success") is not True:
                      raise ValueError("unavailable")
                  return doc["result"]
              def active():
                  live = get("/deployments")["deployments"][0]
                  allocation = live["versions"]
                  if len(allocation) != 1 or allocation[0]["percentage"] != 100:
                      raise ValueError("allocation")
                  vid = allocation[0]["version_id"]
                  if str(uuid.UUID(vid)) != vid:
                      raise ValueError("version")
                  return live["id"], vid
              def address_snapshot():
                  worker='funeralflower-home-preview'
                  root='/accounts/'+account
                  def get_fixed(path):
                      request=urllib.request.Request(API+path,method='GET',
                          headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                      with opener.open(request,timeout=15) as response:
                          data=json.load(response)
                      if data.get('success') is not True:
                          raise ValueError('worker_scope_unavailable')
                      return data['result']
                  ds=get_fixed(root+'/workers/domains')
                  matches=[d for d in ds if d.get('service')==worker]
                  if len(matches)!=1 or matches[0].get('hostname')!='order.baeksefood.com' or sum(d.get('hostname')=='order.baeksefood.com' for d in ds)!=1:
                      raise ValueError('worker_domain_unexpected')
                  zone=matches[0].get('zone_id','')
                  if not re.fullmatch(r'[0-9a-f]{32}',zone):
                      raise ValueError('worker_zone_unexpected')
                  if any(route.get('script')==worker for route in get_fixed('/zones/'+zone+'/workers/routes')):
                      raise ValueError('worker_routes_unexpected')
                  if get('/schedules').get('schedules'):
                      raise ValueError('worker_cron_unexpected')
                  sub=get('/subdomain')
                  if sub.get('enabled') is not True or sub.get('previews_enabled',False) is not False:
                      raise ValueError('worker_subdomain_unexpected')
                  return matches[0],sub
              OLD='96d28986-6d54-4cdf-a587-584072caba25'
              NEW='9a039178-4468-4d19-88cb-68c95f4c5652'
              TAG='aa40653898b52c9b36f2dd7d3a38baf358b5b025'
              HASH='333a47dfbb3b278710951624ab1d1b51f0af83720bc3734088c5c48cdbda3802'
              first=active()
              if first[1]!=OLD:
                  raise ValueError('unexpected_live_version')
              addr=address_snapshot()
              if (get('/versions?per_page=1').get('items') or [{}])[0].get('id')!=NEW:
                  raise ValueError('candidate_not_latest')
              old,new=[get('/versions/'+v) for v in (OLD,NEW)]
              orig=old['resources']; nxt=new['resources']
              def bindings(doc):
                  return sorted(doc['bindings'],key=lambda v:v['name'])
              tag=(new.get('annotations') or new.get('metadata',{}).get('annotations') or {}).get('workers/tag')
              if (old['id']!=OLD or new['id']!=NEW or tag!=TAG or
                  bindings(orig)!=bindings(nxt) or orig['script_runtime']!=nxt['script_runtime']):
                  raise ValueError('candidate_settings_not_identical')
              def page(p):
                  request=urllib.request.Request('https://order.baeksefood.com'+p,method='GET',
                      headers={'Accept-Encoding':'identity','Cache-Control':'no-cache'})
                  with opener.open(request,timeout=15) as response:
                      b=response.read(2*1024*1024+1)
                      if response.status!=200 or not b or len(b)>2*1024*1024:
                          raise ValueError('public_page_unavailable')
                      return response.headers.get_content_type(),hashlib.sha256(b).hexdigest()
              public_paths=('/request/','/buyer.js','/buyer.css')
              before_pages=[page(p) for p in public_paths]
              if not before_pages[0][0].startswith('text/html') or not before_pages[2][0].startswith('text/css'):
                  raise ValueError('public_page_type_mismatch')
              if first!=active() or addr!=address_snapshot() or (get('/versions?per_page=1').get('items') or [{}])[0].get('id')!=NEW:
                  raise ValueError('concurrent_changes')
              req=urllib.request.Request(API+prefix+'/deployments',method='POST',
                 headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},
                 data=json.dumps({'strategy':'percentage','versions':[{'version_id':NEW,'percentage':100}]}).encode())
              with opener.open(req,timeout=30) as response:
                  result=json.load(response)
              if result.get('success') is not True:
                  raise ValueError('activation_response_unavailable')
              print(json.dumps({'promotion_received':True,'candidate':NEW},sort_keys=True))
              deployed=active()
              if deployed[1]!=NEW or addr!=address_snapshot():
                  raise ValueError('post_activation_scope_unverified')
              content_req=urllib.request.Request(API+prefix+'/content/v2',method='GET',
                  headers={'Authorization':'Bearer '+token})
              with opener.open(content_req,timeout=15) as response:
                  raw=response.read(8*1024*1024+1)
                  media=response.headers.get('Content-Type','')
                  etag=response.headers.get('ETag','').strip('"')
              if not raw or len(raw)>8*1024*1024 or etag!=nxt.get('script',{}).get('etag','').strip('"'):
                  raise ValueError('post_activation_module_unlinked')
              if media.lower().startswith('multipart/') and '\n' not in media and '\r' not in media:
                  msg=BytesParser(policy=default).parsebytes(('Content-Type: '+media+'\r\nMIME-Version: 1.0\r\n\r\n').encode('ascii')+raw)
                  parts=[p.get_payload(decode=True) or b'' for p in msg.iter_parts()]
              else:
                  parts=[raw]
              if len(parts)!=1 or hashlib.sha256(parts[0]).hexdigest()!=HASH:
                  raise ValueError('post_activation_module_mismatch')
              after_pages=[page(p) for p in public_paths]
              if before_pages!=after_pages or active()!=deployed:
                  raise ValueError('post_activation_public_pages_or_active_changed')
              return {'status':'activated_verified','active_version':NEW,'old_version':OLD,'source_sha':TAG,
                      'public_assets_checked':len(after_pages),'live_orders':0}
          try:
              result = main()
          except urllib.error.HTTPError as e:
              result = {"status": "unavailable", "http_status": int(e.code)}
          except Exception:
              result = {"status": "unavailable", "reason": "read_failed"}
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["status"] in ("activated_verified",) else 1)
          PY
