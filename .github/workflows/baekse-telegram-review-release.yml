name: Baekse Telegram inactive upload only
on:
  push:
    branches: [review/baekse-order-telegram-20261113]
    paths: ['.github/workflows/baekse-telegram-review-release.yml']
permissions: {contents: read}
concurrency:
  group: baekse-order-existing-worker-updates
  cancel-in-progress: false
jobs:
  prepare_inactive:
    if: github.repository == 'joseungil-kr/fwith-site-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 49c9926ef6761442431ca15627ca2c560eacb3e5
      # Exact prior active version verified before this guarded release.
      EXPECTED_LIVE_VERSION: '54478f7d-8dd3-437b-9f0a-ad92864e9152'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.BAEKSE_ORDER_RELEASE_CF_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: release}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.SOURCE_SHA }}', path: source}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify immutable code, tests and config
        working-directory: source/apps/baekse-order
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check src.js
          node --check requests.js
          node --check telegram-orders.js
          npm test
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('wrangler.reused.jsonc'));if(c.name!=='funeralflower-home-preview'||c.keep_vars!==true||c.workers_dev!==true||c.preview_urls!==false||c.routes!==undefined||c.vars!==undefined||c.durable_objects.bindings.length!==1||c.durable_objects.bindings[0].name!=='ORDER_DB'||c.durable_objects.bindings[0].class_name!=='OrderDatabase'||JSON.stringify(c.migrations)!==JSON.stringify([{tag:'baekse-order-v1-20261103',new_sqlite_classes:['OrderDatabase']}]))process.exit(1)"
      - name: Read-only capture
        id: guard
        run: python release/scripts/diagnostics/baekse/enable_guard.py capture
      # Browser Integrity Check rejects the CI public HTTP client.
      # This job uses only the permitted control-plane API, never the public host.
      # It neither activates the uploaded version nor substitutes a smoke PASS.
      - name: Upload inactive immutable version only
        id: upload
        working-directory: source/apps/baekse-order
        run: |
          python "$GITHUB_WORKSPACE/release/scripts/diagnostics/baekse/enable_guard.py" predeploy
          set -o pipefail
          npx --yes wrangler@4.156.2 versions upload --config wrangler.reused.jsonc --keep-vars --var TELEGRAM_ORDER_ENABLED:true --tag "$SOURCE_SHA" --message 'Reviewed Baekse Telegram candidate with only enabled flag added' | tee "$RUNNER_TEMP/baekse-upload.log"
          python - <<'PYUPLOAD'
          import os,re,pathlib
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'baekse-upload.log').read_text()
          ids=re.findall(r'Worker Version ID:\s*([0-9a-f]{8}-[0-9a-f-]{27})',text)
          assert len(ids)==1,'Cannot uniquely identify uploaded version'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('uploaded_version='+ids[0]+'\n')
          PYUPLOAD
      - name: Verify inactive version metadata and unchanged production
        id: uploaded
        env:
          UPLOADED_VERSION: ${{ steps.upload.outputs.uploaded_version }}
        run: |
          python release/scripts/diagnostics/baekse/enable_guard.py uploaded
          python release/scripts/diagnostics/baekse/enable_guard.py predeploy
          echo "INACTIVE_ONLY_VERIFIED: version=${{ steps.upload.outputs.uploaded_version }}; previous=${{ steps.guard.outputs.previous_version }}; source=$SOURCE_SHA"
          echo "NOT_ACTIVATED: genuine operator browser verification is a separate required step"
