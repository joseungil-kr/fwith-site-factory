name: Suwon C2 deployed source read-only verification
on:
  push:
    branches: [manual-suwon-hosted-check-20261007]
    paths:
      - '.github/workflows/suwon-hosted-readonly-20261007.yml'
      - '.github/scripts/suwon-hosted-readonly-20261007.mjs'
      - '.github/scripts/suwon-hosted-receipts-20261007.py'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/manual-suwon-hosted-check-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_FACTORY_REVISION: e6e8248c44733583d2cbe08288db655fa9bc2302
      SITE_URL: https://suwon-flower-guide-qa.joseungil.workers.dev
      SITE_ORIGIN: https://suwon-flower-guide-qa.joseungil.workers.dev
      SITE_INDEXABLE: 'false'
      MANUAL_QA_PHASE: preview
      MANUAL_HOSTED_PREVIEW: 'true'
    steps:
      - name: Check out actual read-only execution revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable deployed source
        uses: actions/checkout@v4
        with:
          ref: e6e8248c44733583d2cbe08288db655fa9bc2302
          path: target
          persist-credentials: false
      - name: Check out immutable read-only M2 verifier
        uses: actions/checkout@v4
        with:
          ref: 657b9ce62b1a519ba606f9fb0110aa3679d0931c
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact expected deployed artifact
        shell: bash
        working-directory: target/site-factory/suwon-flower
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e6e8248c44733583d2cbe08288db655fa9bc2302'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('dist');m={str(f.relative_to(d)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(d.rglob('*')) if f.is_file()}
          assert len(m)==75
          assert hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest()=='35cc8b330ec3660bde2f69cd00b376a05b593d8c8941d0c1dffcdec96c00a659'
          PY
      - name: Verify every live byte with unchanged M2 application client
        run: python3 control/scripts/manual-release-20261007/verify_http.py control/.github/manual-release-20261007/suwon.policy.json preview target/site-factory/suwon-flower/dist e6e8248c44733583d2cbe08288db655fa9bc2302
      - name: Retain every verified live response without identity fallback
        run: python3 .github/scripts/suwon-hosted-receipts-20261007.py
      - name: Install pinned capture client and Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_INSTALL_ROOT=$RUNNER_TEMP/suwon-readonly-playwright" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/suwon-readonly-playwright" --no-save --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/suwon-readonly-playwright/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual hosted pixels with separate execution and deployed revisions
        run: node .github/scripts/suwon-hosted-readonly-20261007.mjs
      - name: Enforce retrievable evidence chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNKS'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('target/suwon-preview-evidence');chunks=pathlib.Path('suwon-hosted-pixels');parts=[]
          for viewport in ['desktop','mobile']:
            files=sorted((root/'screenshots'/viewport).glob('*.jpg'));assert len(files)==54
            for start in range(0,len(files),16):
              selected=files[start:start+16];name=f'{viewport}-part-{start//16+1:02d}';dest=chunks/name;dest.mkdir(parents=True,exist_ok=True)
              assert sum(f.stat().st_size for f in selected)<24*1024*1024
              rows=[]
              for f in selected:
                shutil.copy2(f,dest/f.name);rows.append({'file':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
              parts.append({'part':name,'count':len(rows),'files':rows})
          (root/'screenshot-chunks.json').write_text(json.dumps(parts,indent=2)+'\n')
          assert sum(f.stat().st_size for f in root.glob('*.json'))<24*1024*1024
          assert sum(f.stat().st_size for f in pathlib.Path('suwon-hosted-http').rglob('*') if f.is_file())<24*1024*1024
          PYCHUNKS
      - name: Retain live HTTP response bodies and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-http-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-http/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted capture facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-facts-${{ github.sha }}-${{ github.run_attempt }}
          path: target/suwon-preview-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-01 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-desktop-part-01-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/desktop-part-01/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-02 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-desktop-part-02-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/desktop-part-02/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-03 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-desktop-part-03-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/desktop-part-03/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted desktop-part-04 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-desktop-part-04-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/desktop-part-04/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-01 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-mobile-part-01-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/mobile-part-01/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-02 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-mobile-part-02-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/mobile-part-02/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-03 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-mobile-part-03-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/mobile-part-03/
          if-no-files-found: error
          retention-days: 7
      - name: Retain hosted mobile-part-04 pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwon-c2-hosted-mobile-part-04-${{ github.sha }}-${{ github.run_attempt }}
          path: suwon-hosted-pixels/mobile-part-04/
          if-no-files-found: error
          retention-days: 7
