name: Yongin Flower v2 Production Deploy

on:
  push:
    branches:
      - site-factory-yongin-v2
    paths:
      - "site-factory/yongin-flower/**"
      - ".github/workflows/yongin-v2-production-deploy.yml"
      - ".github/scripts/yongin-release-qa.py"
      - ".github/scripts/test-yongin-release-qa.py"
      - ".github/scripts/yongin-supplemental-gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yongin-v2-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-factory/yongin-flower
    env:
      SITE_URL: https://yongin.fwith.kr
      SITE_ORIGIN: https://yongin.fwith.kr
      SITE_INDEXABLE: "true"
      HERO_PATH: images/yongin/hero-B-original.png
      INDEXNOW_KEY: 92c88bd5983202f9f0f07ce422cfc19de89603d8bf1e14d3685724b3b5193c98
      INDEXNOW_ENDPOINT: https://searchadvisor.naver.com/indexnow
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current independent main authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: release-authority
          persist-credentials: false
      - name: Check out immutable M2 hashing helpers
        uses: actions/checkout@v4
        with:
          ref: 657b9ce62b1a519ba606f9fb0110aa3679d0931c
          path: release-control
          persist-credentials: false
      - name: Require exact independent supplemental source approval
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/yongin-supplemental-gate.py . release-authority release-control source

      - name: Require production indexing marker
        run: test -f production-indexing.enabled

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9A-Fa-f]{32}$'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Release verification regression tests
        run: python3 ../../.github/scripts/test-yongin-release-qa.py

      - name: Build indexable production site
        run: npm run build

      - name: Static SEO QA
        run: python3 scripts/qa_static.py

      - name: Site graph QA
        run: node scripts/qa_site_graph.mjs

      - name: Require exact independently reviewed artifact before upload
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/yongin-supplemental-gate.py . release-authority release-control artifact

      - name: Deploy production custom domain
        run: npx --yes wrangler@latest deploy -c wrangler.production.jsonc

      - name: Wait for exact production revision and validate all launch URLs
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 ../../.github/scripts/yongin-release-qa.py production

      - name: Preserve live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yongin-production-proof-${{ github.sha }}
          path: |
            site-factory/yongin-flower/production-live-qa.json
          if-no-files-found: warn
          retention-days: 14
