name: Nalmada Flower 1080 full-page custom-domain attach (NOINDEX)
on:
  push:
    branches: [feature/flower-1080-production-preflight-20261027]
    paths:
      - '.github/workflows/flower-full-release-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nalmada-flower-nalmada-net-custom-domain-release
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight, bind only free flower.nalmada.net, verify Worker version and readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error,time,re
          from datetime import datetime,timezone
          host='flower.nalmada.net'
          worker='sfv5-nalmada-flower-preview'
          expected='92ed9a9f-2179-44c4-a223-8ff7a51a506a'
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',account) or not token:
              raise RuntimeError('Cloudflare credentials missing/invalid')
          def call(method,path,body=None):
              data=json.dumps(body,separators=(',',':')).encode() if body is not None else None
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              if data:headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers=headers,data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:payload=json.load(response)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(method+' '+path.split('?')[0]+' rejected HTTP '+str(e.code)) from None
              if payload.get('success') is not True:
                  raise RuntimeError(method+' '+path.split('?')[0]+' rejected: '+str(payload.get('errors',[])))
              return payload['result']
          def domain_list():
              return call('GET','/accounts/'+account+'/workers/domains')
          domains=domain_list()
          known=[('flower-a.fwith.kr','flower-matrix-a-prod'),('flower-b.fwith.kr','flower-matrix-b-prod')]
          if not all(any(d.get('hostname')==h and d.get('service')==w for d in domains) for h,w in known):
              raise RuntimeError('Original V4 Cloudflare account proof mismatch')
          zones=call('GET','/zones?name=nalmada.net&per_page=50')
          active=[z for z in zones if z.get('name')=='nalmada.net' and z.get('account',{}).get('id')==account and z.get('status')=='active']
          if len(active)!=1:raise RuntimeError('No unique active nalmada.net zone')
          zone_id=active[0]['id']
          matches=[d for d in domains if d.get('hostname')==host]
          if len(matches)>1 or any(x.get('service')!=worker for x in matches):
              raise RuntimeError('Domain already bound to unexpected Worker; refuse')
          deployments=call('GET','/accounts/'+account+'/workers/scripts/'+worker+'/deployments')
          deployments=deployments.get('deployments',[])
          if not deployments:raise RuntimeError('No deployed Worker version')
          versions=deployments[0].get('versions',[])
          if len(versions)!=1 or versions[0].get('percentage')!=100:
              raise RuntimeError('Worker is in split deploy; refuse')
          active_version=versions[0].get('version_id')
          if active_version!=expected:
              raise RuntimeError('Worker version changed from audited 1080-asset version, refuse: '+str(active_version))
          if not matches:
              try:
                  records=call('GET','/zones/'+zone_id+'/dns_records?name='+host+'&per_page=100')
                  if records:raise RuntimeError('Existing DNS records; refuse to overwrite')
                  dns_method='Cloudflare DNS API empty'
              except RuntimeError as exc:
                  if 'rejected HTTP 403' not in str(exc):raise
                  dns_method='Public DNS fallback (DNS API read denied)'
                  for kind in ('A','AAAA','CNAME','TXT'):
                      url='https://cloudflare-dns.com/dns-query?'+urllib.parse.urlencode({'name':host,'type':kind})
                      request=urllib.request.Request(url,headers={'Accept':'application/dns-json','User-Agent':'Flower-Safe-Release/1'})
                      with urllib.request.urlopen(request,timeout=20) as response:answer=json.load(response)
                      if answer.get('Status') not in (0,3) or answer.get('Answer'):
                          raise RuntimeError('Public DNS record exists or lookup failed: '+kind)
              print('FLOWER_DOMAIN_PRE_ATTACH_SAFE='+json.dumps({'host':host,'dns':dns_method,'existingDomains':0,'previousWorkerVersion':active_version}))
              result=call('PUT','/accounts/'+account+'/workers/domains',{'hostname':host,'service':worker,'zone_id':zone_id,'enabled':True})
              if result.get('hostname')!=host or result.get('service')!=worker:
                  raise RuntimeError('Cloudflare attached unexpected resource')
              print('FLOWER_CUSTOM_DOMAIN_ATTACH_CREATED')
          else:
              print('FLOWER_CUSTOM_DOMAIN_ALREADY_CORRECT')
          current=domain_list()
          bound=[d for d in current if d.get('hostname')==host]
          if len(bound)!=1 or bound[0].get('service')!=worker:
              raise RuntimeError('Custom domain binding readback mismatch')
          if not all(any(d.get('hostname')==h and d.get('service')==w for d in current) for h,w in known):
              raise RuntimeError('V4 domain proof changed unexpectedly after attach')
          print('FLOWER_CUSTOM_DOMAIN_BINDING_VERIFIED='+json.dumps({'host':host,'worker':worker,'version':active_version,'indexed':False},ensure_ascii=False),flush=True)
          # A provider-succeeded binding may need propagation; do not undo a safe
          # completed DNS/Worker attach due to GitHub runner IP-blocked 403.
          origin='https://'+host
          outcomes=[]
          for attempt in range(1,13):
              paths=('/','/halls.json','/fh-0003dfe99ba37467302b.html','/robots.txt')
              checks=[]
              for path in paths:
                  req=urllib.request.Request(origin+path,headers={'User-Agent':'NalmadaFlower-SafeVerify/1'})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as response:
                          status=response.status
                          body=response.read(400_000).decode('utf-8','replace')
                          robot=response.headers.get('X-Robots-Tag','')
                  except urllib.error.HTTPError as error:
                      status=error.code;body=error.read(2000).decode('utf-8','replace')
                      robot=error.headers.get('X-Robots-Tag','')
                  except Exception as error:
                      status=type(error).__name__;body='';robot=''
                  checks.append({'path':path,'status':status,'robots':robot})
                  if status!=200 or (path=='/' and '날마다꽃' not in body) or (path=='/robots.txt' and 'Disallow: /' not in body):
                      break
                  if path.endswith('.html') and '근조화환 주문 가격안내' not in body:break
              outcomes=checks
              if len(checks)==4 and all(x['status']==200 for x in checks):
                  print('FLOWER_CUSTOM_DOMAIN_LIVE_READBACK='+json.dumps({'result':'PASS','checks':checks},ensure_ascii=False),flush=True)
                  break
              print('FLOWER_HTTP_PROBE_ATTEMPT',attempt,json.dumps(checks,ensure_ascii=False),flush=True)
              if attempt<12:time.sleep(8)
          else:
              print('FLOWER_CUSTOM_DOMAIN_LIVE_READBACK='+json.dumps({'result':'UNVERIFIED','checks':outcomes},ensure_ascii=False),flush=True)
          print('FLOWER_PUBLICATION_SCOPE=all-1080-pages-noindex; IndexNow not submitted')
          PY
