name: Gangjin pinned private source48 build and loopback QA only
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: gangjin-private-preview-qa-${{ github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.title == '[GANGJIN-PRIVATE-QA] source48-touchfix-20261017' && github.event.issue.user.login == 'joseungil-kr' && github.event.issue.user.type == 'User' && 'requested' || github.run_id }}
  cancel-in-progress: false
jobs:
  private_qa:
    if: github.repository == 'joseungil-kr/fwith-site-factory' && github.ref == 'refs/heads/main' && github.actor == 'joseungil-kr' && github.triggering_actor == 'joseungil-kr' && github.run_attempt == 1 && github.event.issue.title == '[GANGJIN-PRIVATE-QA] source48-touchfix-20261017' && github.event.issue.user.login == 'joseungil-kr' && github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed read-only control before executing source
        run: python3 -m unittest discover -s control/scripts/direct-gangjin/private-qa -p 'test_*.py' -v
      - name: Select exact reviewed source and owner request
        id: bind
        run: python3 control/scripts/direct-gangjin/private-qa/qa_control.py select --report evidence/selected-source.json
      - name: Read back frozen source branch head
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const b = JSON.parse(fs.readFileSync('control/scripts/direct-gangjin/private-qa/bindings.json', 'utf8'));
            const {data} = await github.rest.git.getRef({...context.repo, ref:'heads/' + b.sourceBranch});
            if (data.object.type !== 'commit' || data.object.sha !== b.sourceRevision) throw new Error('Frozen source branch moved');
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.bind.outputs.source_sha }}
          path: target
          persist-credentials: false
      - name: Verify all exact source48 files before executing them
        run: python3 control/scripts/direct-gangjin/private-qa/qa_control.py prebuild --checkout target --report evidence/source-prebuild.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact private source and run native tests
        working-directory: target/site-factory/gangjin-flower/candidate
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/logs"
          npm ci --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/npm-ci.log"
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/build.log"
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/evidence/logs/test.log"
      - name: Verify unchanged source48 and exact noindex output11
        run: python3 control/scripts/direct-gangjin/private-qa/qa_control.py postbuild --checkout target --report evidence/private-output.json
      - name: Test real source and explicitly synthetic browser rejection fixtures
        env:
          GANGJIN_PRIVATE_CHECKOUT: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          python3 -m unittest discover -s control/scripts/direct-gangjin/private-qa -p 'test_*.py' -v 2>&1 | tee evidence/logs/control-tests.log
      - name: Install existing pinned official browser tooling and Korean fonts
        run: |
          set -euo pipefail
          python3 -m pip install 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK KR' | tee evidence/logs/font-match.txt
      - name: Capture actual private browser over loopback only
        run: |
          set -euo pipefail
          python3 control/scripts/direct-gangjin/private-qa/capture_private.py --source target/site-factory/gangjin-flower --dist target/site-factory/gangjin-flower/candidate/dist --source-revision '${{ steps.bind.outputs.source_sha }}' 2>&1 | tee evidence/logs/browser.log
      - name: Validate actual DOM, HTTP11 and all 42 screenshot files
        run: python3 control/scripts/direct-gangjin/private-qa/qa_control.py browser --checkout target --report evidence/browser-verification.json
      - name: Preserve success or failure evidence for independent screenshot inspection
        if: always()
        run: |
          mkdir -p evidence
          if test -d target/site-factory/gangjin-flower/candidate/evidence; then cp -R target/site-factory/gangjin-flower/candidate/evidence evidence/candidate; fi
          python3 control/scripts/direct-gangjin/private-qa/qa_control.py seal --evidence evidence
      - name: Retain exact private output and evidence without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gangjin-private-source48-qa-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/site-factory/gangjin-flower/candidate/dist/
            evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
